function AssignForm({groupId,atype,assignId,onDone}) {
  const existing=assignId?DB.assignments().find(a=>a.id===assignId):null;
  const [f,setF]=useState({title:existing?.title||'',desc:existing?.description||'',marks:existing?.totalMark||'',due:existing?.dueDate||'',fileName:existing?.fileName||''});
  const [fileData,setFileData]=useState(null);
  const [err,setErr]=useState('');
  const fileRef=useRef(null);
  const resolvedType=existing?existing.type:atype;
  const lbl=resolvedType==='homework'?'Homework':'Mock Exam';
  function handleFile(e){ const file=e.target.files[0]; if(!file)return; setF({...f,fileName:file.name}); const r=new FileReader(); r.onload=ev=>setFileData(ev.target.result); r.readAsDataURL(file); }
  function submit(){
    if(!f.title.trim()||!f.marks){setErr('Please fill in title and total marks.');return;}
    if(existing){
      const assigns=DB.assignments(); const a=assigns.find(x=>x.id===assignId);
      a.title=f.title.trim(); a.description=f.desc; a.totalMark=Number(f.marks); a.dueDate=f.due||null;
      if(fileData){a.fileName=f.fileName;a.fileData=fileData;}
      DB.save.assignments(assigns);
    } else {
      const assigns=DB.assignments();
      assigns.push({id:uid(),groupId,type:resolvedType,title:f.title.trim(),description:f.desc,totalMark:Number(f.marks),dueDate:f.due||null,fileName:fileData?f.fileName:null,fileData:fileData||null,correctedFile:null,createdAt:now()});
      DB.save.assignments(assigns);
    }
    onDone();
  }
  return (
    <>
      <div className="mfield"><label>Title</label><input autoFocus value={f.title} onChange={e=>setF({...f,title:e.target.value})} placeholder={lbl+" title"}/></div>
      <div className="mfield"><label>Description (optional)</label><textarea value={f.desc} onChange={e=>setF({...f,desc:e.target.value})} placeholder="Instructions…"/></div>
      <div className="mfield"><label>Total marks</label><input type="number" min="1" value={f.marks} onChange={e=>setF({...f,marks:e.target.value})} placeholder="e.g. 100"/></div>
      <div className="mfield"><label>Due date</label><input type="date" value={f.due} onChange={e=>setF({...f,due:e.target.value})}/></div>
      <div className="mfield">
        <label>PDF attachment (optional)</label>
        <div className="mupload" onClick={()=>fileRef.current&&fileRef.current.click()}>
          📎 {f.fileName?f.fileName:(existing?.fileName?'Current: '+existing.fileName+' — click to replace':'Click to attach PDF')}
        </div>
        <input ref={fileRef} type="file" accept=".pdf" style={{display:'none'}} onChange={handleFile}/>
      </div>
      {err&&<div className="merr">{err}</div>}
      <button className="mbtn" onClick={submit}>{existing?'Save changes':'Add '+lbl}</button>
    </>
  );
}

function SubmitForm({assignId,userId,onDone}) {
  const [fileName,setFileName]=useState('');
  const [fileData,setFileData]=useState(null);
  const [err,setErr]=useState('');
  const fileRef=useRef(null);
  function handleFile(e){ const file=e.target.files[0]; if(!file)return; setFileName(file.name); const r=new FileReader(); r.onload=ev=>setFileData(ev.target.result); r.readAsDataURL(file); }
  function submit(){
    if(!fileData){setErr('Please upload a file first.');return;}
    const existing=DB.submissions().find(s=>s.assignmentId===assignId&&s.studentId===userId);
    if(existing){setErr('You have already submitted this assignment.');return;}
    const subs=DB.submissions();
    subs.push({id:uid(),assignmentId:assignId,studentId:userId,fileName:fileName||'(no file)',fileData,submittedAt:now(),mark:null,correctedFile:null});
    DB.save.submissions(subs); onDone();
  }
  return (
    <>
      <div className="mfield">
        <label>Upload your work</label>
        <div className="mupload" onClick={()=>fileRef.current&&fileRef.current.click()}>📤 {fileName||'Click to upload your work (PDF, DOC, JPG, PNG)'}</div>
        <input ref={fileRef} type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" style={{display:'none'}} onChange={handleFile}/>
      </div>
      {fileName&&<div style={{fontSize:13,marginBottom:10,color:'var(--green-deep)',fontWeight:600}}>✓ File selected: {fileName}</div>}
      {err&&<div className="merr">{err}</div>}
      <button className="mbtn" onClick={submit}>Submit</button>
    </>
  );
}

  function uploadCorrectionForStudent(subId,e){

      const subs=DB.submissions(); const sub=subs.find(s=>s.id===subId);

      DB.save.submissions(subs); onRefresh();

      <div style={{fontSize:12,opacity:0.6,marginBottom:12}}>📎 {viewingFile.fileName} · Submitted {fmtDate(viewingFile.submittedAt)}</div>

        const late=isLate(a?.dueDate,sub.submittedAt);
        if(!corrRefs.current[sub.id]) corrRefs.current[sub.id]=React.createRef();

          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>

            <div style={{flex:1}}><div style={{fontWeight:600}}>{stu.name}</div><div style={{fontSize:12,opacity:0.6}}>{fmtDate(sub.submittedAt)}</div></div>
            {late?<span className="tag-late">Late</span>:<span className="tag-ontime">On time</span>}
          </div>
          {sub.fileName&&<div style={{fontSize:12,marginBottom:8}}>📎 {sub.fileName}</div>}

          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:8}}>

function StudentDetail({studentId,groupId}) {
  const stu=DB.students().find(s=>s.id===studentId);
  const assigns=DB.assignments().filter(a=>a.groupId===groupId);
  const mySubs=DB.submissions().filter(s=>s.studentId===studentId&&assigns.find(a=>a.id===s.assignmentId));
  const marked=mySubs.filter(s=>s.mark!==null&&s.mark!==undefined);
  const totPoss=marked.reduce((sum,sub)=>{const a=assigns.find(x=>x.id===sub.assignmentId);return sum+(a?a.totalMark:0);},0);
  const totGot=marked.reduce((sum,sub)=>sum+sub.mark,0);
  const pct=totPoss>0?Math.round(totGot/totPoss*100):0;
  const done=mySubs.length,total=assigns.length,notDone=total-done;
  function buildPie(done,notDone){ const total=done+notDone; if(total===0)return`<circle cx="80" cy="80" r="60" fill="#D3D1C7"/>`; if(notDone===0)return`<circle cx="80" cy="80" r="60" fill="#16261F"/>`; if(done===0)return`<circle cx="80" cy="80" r="60" fill="#D3D1C7"/>`; const pct=done/total,angle=pct*2*Math.PI,x=80+60*Math.sin(angle),y=80-60*Math.cos(angle),large=pct>.5?1:0; return`<circle cx="80" cy="80" r="60" fill="#D3D1C7"/><path d="M80,80 L80,20 A60,60 0 ${large},1 ${x},${y} Z" fill="#16261F"/><circle cx="80" cy="80" r="36" fill="#F7F4EC"/><text x="80" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#16261F">${Math.round(pct*100)}%</text>`; }
  return (
    <>
      <div style={{fontWeight:700,fontSize:15,marginBottom:14}}>{stu?.name}</div>
      <div className="p-stat-row" style={{marginBottom:16}}>
        <div className="p-stat"><div className="n">{done}/{total}</div><div className="l">Submitted</div></div>
        <div className="p-stat"><div className="n">{totGot}/{totPoss||'—'}</div><div className="l">Marks</div></div>
        <div className="p-stat"><div className="n">{marked.length>0?pct+'%':'—'}</div><div className="l">Score</div></div>
      </div>
      {total>0&&<><svg viewBox="0 0 160 160" width="120" height="120" style={{display:'block',margin:'0 auto'}} dangerouslySetInnerHTML={{__html:buildPie(done,notDone)}}/>
      <div style={{display:'flex',gap:16,justifyContent:'center',margin:'8px 0 16px',fontSize:12}}>
        <span><span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:'#16261F',marginRight:4}}></span>Done ({done})</span>
        <span><span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:'#D3D1C7',marginRight:4}}></span>Pending ({notDone})</span>
      </div></>}
      <table className="p-table"><thead><tr><th>Assignment</th><th>Submitted</th><th>Mark</th></tr></thead><tbody>
        {assigns.map(a=>{const sub=mySubs.find(s=>s.assignmentId===a.id);return <tr key={a.id}><td>{a.title} <span className="pill pill-gray" style={{fontSize:10}}>{a.type}</span></td><td>{sub?<span className="pill pill-green">Yes</span>:<span className="pill pill-amber">No</span>}</td><td>{sub&&sub.mark!==null&&sub.mark!==undefined?`${sub.mark}/${a.totalMark}`:'—'}</td></tr>;})}
      </tbody></table>
    </>
  );
}

function PostsView({user}){
  const isT=user.role==='teacher';
  const posts=DB.posts().slice().sort((a,b)=>b.at-a.at);
  const [text,setText]=useState('');
  const [title,setTitle]=useState('');
  const [editId,setEditId]=useState(null);
  const [editText,setEditText]=useState('');
  const [editTitle,setEditTitle]=useState('');
  const [replyText,setReplyText]=useState({});
  useEffect(()=>{ try{ localStorage.setItem('zh_seen_posts_'+user.id,String(Date.now())); window.dispatchEvent(new Event('zh-data-changed')); }catch(e){} },[posts.length]);

  function publish(){ if(!text.trim())return; const p={id:uid(),title:title.trim()||null,text:text.trim(),by:user.name||'Teacher',at:now(),replies:[]}; DB.save.posts([...DB.posts(),p]); setText(''); setTitle(''); }
  function del(id){ if(!confirm('Delete this announcement?'))return; DB.save.posts(DB.posts().filter(p=>p.id!==id)); }
  function startEdit(p){ setEditId(p.id); setEditText(p.text); setEditTitle(p.title||''); }
  function saveEdit(){ const all=DB.posts(); const p=all.find(x=>x.id===editId); if(p){ p.text=editText.trim()||p.text; p.title=editTitle.trim()||null; p.edited=true; DB.save.posts(all);} setEditId(null); }
  function sendReply(postId){ const t=(replyText[postId]||'').trim(); if(!t)return; const all=DB.posts(); const p=all.find(x=>x.id===postId); if(p){ p.replies=p.replies||[]; p.replies.push({id:uid(),byId:user.id,by:user.name||(isT?'Teacher':'Student'),role:user.role,text:t,at:now()}); DB.save.posts(all);} setReplyText(Object.assign({},replyText,{[postId]:''})); }
  function delReply(postId,rid){ const all=DB.posts(); const p=all.find(x=>x.id===postId); if(p){ p.replies=(p.replies||[]).filter(r=>r.id!==rid); DB.save.posts(all);} }

  const card={background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:'14px 16px',boxShadow:'3px 3px 0 var(--ink)',marginBottom:12};
  return (<div className="p-main">
    <div className="p-topbar"><div className="p-topbar-title">📌 Announcements</div></div>
    <div className="p-page">
      {isT&&(
        <div style={{background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:16,boxShadow:'4px 4px 0 var(--ink)',marginBottom:18}}>
          <div className="mfield"><label>Title (optional)</label><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Reminder: test on Sunday"/></div>
          <div className="mfield"><label>Message</label><textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Write an announcement for your students…"/></div>
          <button className="mbtn" onClick={publish}>📢 Post announcement</button>
        </div>
      )}
      {posts.length===0&&<div className="empty-state">No announcements yet.</div>}
      {posts.map(p=>(
        <div key={p.id} style={card}>
          {editId===p.id?(
            <div>
              <div className="mfield"><label>Title</label><input value={editTitle} onChange={e=>setEditTitle(e.target.value)}/></div>
              <div className="mfield"><label>Message</label><textarea value={editText} onChange={e=>setEditText(e.target.value)}/></div>
              <div style={{display:'flex',gap:8}}><button className="mbtn" onClick={saveEdit}>Save</button><button className="a-btn" onClick={()=>setEditId(null)}>Cancel</button></div>
            </div>
          ):(
            <div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:4}}>
                <div style={{fontWeight:700,color:'var(--green-deep)',fontFamily:'Georgia,serif'}}>{p.title||'Announcement'}</div>
                {isT&&<div style={{display:'flex',gap:6,flexShrink:0}}>
                  <button className="a-btn" onClick={()=>startEdit(p)} style={{fontSize:11}}>✏️ Edit</button>
                  <button className="a-btn danger" onClick={()=>del(p.id)} style={{fontSize:11}}>🗑</button>
                </div>}
              </div>
              <div style={{whiteSpace:'pre-wrap',fontSize:14,lineHeight:1.5}}>{p.text}</div>
              <div style={{fontSize:11,opacity:0.55,marginTop:8}}>{p.by} · {fmtDate(p.at)}{p.edited?' · edited':''}</div>
            </div>
          )}

          {/* replies */}
          {(p.replies&&p.replies.length>0)&&(
            <div style={{marginTop:12,borderTop:'1px solid #eee',paddingTop:10,display:'flex',flexDirection:'column',gap:8}}>
              {p.replies.slice().sort((a,b)=>a.at-b.at).map(r=>(
                <div key={r.id} style={{background:r.role==='teacher'?'#FFF5F2':'var(--paper)',border:'1.5px solid var(--ink)',borderRadius:8,padding:'7px 10px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',gap:8}}>
                    <span style={{fontSize:12,fontWeight:700,color:r.role==='teacher'?'var(--coral-dark)':'var(--chalk-blue)'}}>{r.role==='teacher'?'👩‍🏫 ':''}{r.by}</span>
                    {(isT||r.byId===user.id)&&<button className="linklike" onClick={()=>delReply(p.id,r.id)} style={{fontSize:10}}>delete</button>}
                  </div>
                  <div style={{fontSize:13,whiteSpace:'pre-wrap'}}>{r.text}</div>
                  <div style={{fontSize:10,opacity:0.5}}>{fmtDate(r.at)}</div>
                </div>
              ))}
            </div>
          )}
          {/* reply box (everyone) */}
          <div style={{display:'flex',gap:8,marginTop:10}}>
            <input value={replyText[p.id]||''} onChange={e=>setReplyText(Object.assign({},replyText,{[p.id]:e.target.value}))} onKeyDown={e=>e.key==='Enter'&&sendReply(p.id)} placeholder="Write a reply…" style={{flex:1,padding:'9px 12px',border:'2px solid var(--ink)',borderRadius:8,fontSize:14,fontFamily:'inherit',background:'white'}}/>
            <button className="a-btn" onClick={()=>sendReply(p.id)} style={{flexShrink:0}}>Reply</button>
          </div>
        </div>
      ))}
    </div>
  </div>);
}

/* ═══════════ NOTIFICATIONS ═══════════ */
function _seen(uid,key){ try{ return Number(localStorage.getItem('zh_seen_'+key+'_'+uid))||0; }catch(e){ return 0; } }
function _markSeen(uid,key){ try{ localStorage.setItem('zh_seen_'+key+'_'+uid,String(Date.now())); }catch(e){} }
function Notifications({user,onOpenPosts,onOpenGroup,onOpenMeetings,onAddStudent,onOpenParents,onOpenChat,onOpenRegs}){
  const isT=user.role==='teacher';
  const isParent=user.role==='parent';
  const [open,setOpen]=useState(false);
  const items=[];
  const allMeet=DB.meetings();
  const myMeetings=isT?allMeet:allMeet.filter(m=>m.participants==='all'||(Array.isArray(m.participants)&&m.participants.includes(user.id)));
  if(isT){
    const subs=DB.submissions(), studs=DB.students(), assigns=DB.assignments(), parents=DB.parents();
    /* new student registrations → tap to add them to a group */
    const seenReg=_seen(user.id,'reg');
    studs.filter(s=>(s.createdAt||0)>seenReg).forEach(s=>{
      items.push({t:s.createdAt,txt:'👤 New student registered: '+s.name+(s.approved===false?' — tap to approve':''),go:onOpenRegs});
    });
    /* new parent registrations → shows which child, tap to approve */
    const seenPreg=_seen(user.id,'preg');
    parents.filter(p=>(p.createdAt||0)>seenPreg).forEach(p=>{
      const cn=(studs.find(s=>s.id===p.childId)||{}).name||'a student';
      items.push({t:p.createdAt,txt:'👪 New parent registered: '+p.name+' (parent of '+cn+')'+(p.approved===false?' — tap to approve':''),go:onOpenRegs});
    });
    const seenSub=_seen(user.id,'subs');
    subs.filter(s=>(s.submittedAt||0)>seenSub).forEach(s=>{
      const nm=(studs.find(x=>x.id===s.studentId)||{}).name||'A student';
      const a=assigns.find(x=>x.id===s.assignmentId)||{};
      items.push({t:s.submittedAt,txt:'📥 '+nm+' submitted "'+(a.title||'work')+'"',go:()=>onOpenGroup(a.groupId,a.type==='mock'?'mock':'homework',a.id)});
    });
    const seenMsg=_seen(user.id,'tmsg');
    DB.messages().filter(m=>m.to==='teacher'&&!m.parentId&&(m.at||0)>seenMsg).forEach(m=>{
      const nm=(studs.find(x=>x.id===m.from)||{}).name||'A student';
      items.push({t:m.at,txt:'💬 '+nm+': '+String(m.text||'').slice(0,40),go:()=>onOpenGroup(m.groupId,'chat')});
    });
    /* parent messages */
    const seenPmsg=_seen(user.id,'pmsg');
    DB.messages().filter(m=>m.parentId&&m.from==='parent'&&(m.at||0)>seenPmsg).forEach(m=>{
      const pn=(parents.find(p=>p.id===m.parentId)||{}).name||'A parent';
      items.push({t:m.at,txt:'💬 '+pn+' (parent): '+String(m.text||'').slice(0,40),go:onOpenParents});
    });
  } else if(isParent){
    const seenPost=_seen(user.id,'posts');
    DB.posts().filter(p=>(p.at||0)>seenPost).forEach(p=>items.push({t:p.at,txt:'📌 New announcement: '+(p.title||String(p.text||'').slice(0,40)),go:onOpenPosts}));
    const seenTd=_seen(user.id,'ptmsg');
    DB.messages().filter(m=>m.parentId===user.id&&m.from==='teacher'&&(m.at||0)>seenTd).forEach(m=>items.push({t:m.at,txt:'💬 Teacher: '+String(m.text||'').slice(0,40),go:onOpenChat}));
  } else {
    const seenPost=_seen(user.id,'posts');
    DB.posts().filter(p=>(p.at||0)>seenPost).forEach(p=>items.push({t:p.at,txt:'📌 New announcement: '+(p.title||String(p.text||'').slice(0,40)),go:onOpenPosts}));
    const myGroupIds=DB.groups().filter(g=>(g.students||[]).includes(user.id)).map(g=>g.id);
    const seenAssign=_seen(user.id,'assign');
    DB.assignments().filter(a=>myGroupIds.includes(a.groupId)&&(a.createdAt||0)>seenAssign).forEach(a=>items.push({t:a.createdAt,txt:'📋 New '+(a.type==='mock'?'mock exam':'homework')+': '+a.title,go:()=>onOpenGroup(a.groupId,a.type==='mock'?'mock':'homework')}));
    const seenMsg=_seen(user.id,'smsg');
    DB.messages().filter(m=>(m.at||0)>seenMsg&&m.from==='teacher'&&!m.parentId&&(m.to===user.id||m.broadcast)).forEach(m=>items.push({t:m.at,txt:'💬 Teacher: '+String(m.text||'').slice(0,40),go:()=>onOpenGroup(m.groupId,'chat')}));
  }
  items.sort((a,b)=>b.t-a.t);
  const count=items.length;
  function clearAll(){
    if(isT){ _markSeen(user.id,'subs'); _markSeen(user.id,'tmsg'); _markSeen(user.id,'reg'); _markSeen(user.id,'pmsg'); _markSeen(user.id,'preg'); }
    else if(isParent){ _markSeen(user.id,'posts'); _markSeen(user.id,'ptmsg'); }
    else { _markSeen(user.id,'posts'); _markSeen(user.id,'assign'); _markSeen(user.id,'smsg'); _markSeen(user.id,'meet'); }
    window.dispatchEvent(new Event('zh-data-changed')); setOpen(false);
  }
  return (
    <div style={{position:'relative'}}>
      <button className="a-btn" onClick={()=>setOpen(o=>!o)} style={{position:'relative',padding:'6px 10px'}}>
        🔔
        {count>0&&<span style={{position:'absolute',top:-7,right:-7,background:'var(--coral)',color:'white',borderRadius:'50%',minWidth:18,height:18,fontSize:10,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 4px',border:'2px solid var(--ink)'}}>{count>9?'9+':count}</span>}
      </button>
      {open&&(
        <div style={{position:'absolute',right:0,top:'115%',width:260,maxWidth:'80vw',maxHeight:340,overflowY:'auto',background:'white',border:'2px solid var(--ink)',borderRadius:10,boxShadow:'4px 4px 0 var(--ink)',zIndex:1500,padding:8}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'4px 6px 8px'}}>
            <strong style={{fontSize:13}}>Notifications</strong>
            {count>0&&<button className="linklike" onClick={clearAll} style={{fontSize:11}}>Mark all read</button>}
          </div>
          {count===0&&<div style={{fontSize:13,opacity:0.6,padding:'10px 6px'}}>No new notifications.</div>}
          {items.slice(0,30).map((it,i)=>(
            <div key={i} onClick={()=>{ if(it.go)it.go(); clearAll(); }} style={{padding:'8px 6px',borderTop:i?'1px solid #eee':'none',fontSize:13,cursor:'pointer'}}>
              <div>{it.txt}</div>
              <div style={{fontSize:11,opacity:0.5}}>{fmtDate(it.t)}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ═══════════ LIVE MEETING (Jitsi) ═══════════ */
let _jitsiLoading=null;
function loadJitsi(){
  if(window.JitsiMeetExternalAPI) return Promise.resolve();
  if(_jitsiLoading) return _jitsiLoading;
  _jitsiLoading=new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='https://meet.jit.si/external_api.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('Could not load the video service. Check your internet.'));
    document.body.appendChild(s);
  });
  return _jitsiLoading;
}
function LiveMeeting({meeting,user,onClose}){
  const ref=useRef(null); const apiRef=useRef(null); const [err,setErr]=useState('');
  const recRef=useRef(null); const chunksRef=useRef([]); const [recording,setRecording]=useState(false);
  useEffect(()=>{
    loadJitsi().then(()=>{
      if(!ref.current) return;
      const api=new window.JitsiMeetExternalAPI('meet.jit.si',{
        roomName:'ZahraMathHub_'+meeting.id,
        parentNode:ref.current, width:'100%', height:'100%',
        userInfo:{ displayName:(user.name||(user.role==='teacher'?'Teacher':'Student')) },
        configOverwrite:{ prejoinPageEnabled:true, startWithAudioMuted:user.role!=='teacher', startWithVideoMuted:user.role!=='teacher', disableDeepLinking:true, whiteboard:{ enabled:true } },
        interfaceConfigOverwrite:{ MOBILE_APP_PROMO:false, DISABLE_DEEP_LINKING:true,
          TOOLBAR_BUTTONS:['microphone','camera','desktop','whiteboard','recording','chat','raisehand','participants-pane','tileview','security','settings','fullscreen','hangup'] }
      });
      apiRef.current=api;
      api.addEventListener('readyToClose',()=>onClose());
    }).catch(e=>setErr(e.message||'Video failed to load'));
    return ()=>{ try{ apiRef.current&&apiRef.current.dispose(); }catch(e){} try{ recRef.current&&recRef.current.stop(); }catch(e){} };
  },[]);
  async function startRec(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){
      alert('In-browser recording isn\u2019t supported on this device (common on phones). Please use your phone\u2019s built-in screen recorder instead, then add the video link on the Recordings page.');
      return;
    }
    try{
      const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
      chunksRef.current=[];
      const rec=new MediaRecorder(stream);
      rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunksRef.current.push(e.data); };
      rec.onstop=()=>{
        try{
          const blob=new Blob(chunksRef.current,{type:'video/webm'});
          const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
          a.download=(meeting.title||'meeting').replace(/[^a-z0-9]+/gi,'_')+'_'+new Date().toISOString().slice(0,10)+'.webm';
          a.click();
        }catch(e){}
        stream.getTracks().forEach(t=>t.stop()); setRecording(false);
      };
      stream.getVideoTracks()[0].addEventListener('ended',()=>{ try{ rec.state!=='inactive'&&rec.stop(); }catch(e){} });
      rec.start(); recRef.current=rec; setRecording(true);
    }catch(e){ /* user cancelled the screen picker */ }
  }
  function stopRec(){ try{ recRef.current&&recRef.current.state!=='inactive'&&recRef.current.stop(); }catch(e){} }
  return (
    <div style={{position:'fixed',inset:0,zIndex:5000,background:'#000',display:'flex',flexDirection:'column'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 14px',background:'#1F3A33',color:'#fff',gap:8}}>
        <div style={{fontWeight:700,fontFamily:'Georgia,serif'}}>🎥 {meeting.title}</div>
        <div style={{display:'flex',gap:8}}>
          {user.role==='teacher'&&(recording
            ? <button className="a-btn" onClick={stopRec} style={{background:'#a11',color:'#fff',borderColor:'#a11'}}>⏹ Stop &amp; save video</button>
            : <button className="a-btn" onClick={startRec} style={{background:'#fff',color:'var(--ink)'}}>⏺ Record to device</button>)}
          <button className="a-btn" onClick={onClose} style={{background:'var(--coral)',color:'#fff',borderColor:'var(--coral)'}}>✕ Leave</button>
        </div>
      </div>
      {err&&<div style={{color:'#fff',padding:20,fontFamily:'Georgia,serif'}}>{err}</div>}
      <div ref={ref} style={{flex:1,minHeight:0}}/>
      {user.role==='teacher'&&<div style={{background:'#132b25',color:'#cfe',fontSize:11,padding:'5px 12px',textAlign:'center'}}>Tip: <b>Share screen</b> for slides, <b>Whiteboard</b> to draw. To record, tap the <b>⏺ Record</b> button and connect Dropbox — after the meeting, copy the Dropbox link into the meeting's "Add recording" so students can watch it. Open <b>Security → Lobby</b> to admit students.</div>}
    </div>
  );
}

/* ═══════════ MEETINGS (scheduler) ═══════════ */
function MeetingsView({user,onLive}){
  const isT=user.role==='teacher';
  const students=DB.students();
  const meetings=DB.meetings().slice().sort((a,b)=>(((b.date||'')+(b.start||'')) > ((a.date||'')+(a.start||''))?1:-1));
  const blank={title:'',date:'',start:'',end:'',purpose:'',location:'',online:true,participants:'all',recurrence:'none',reminderMin:15,status:'Scheduled',notes:'',actionItems:'',attachmentData:null,attachmentName:'',recordingUrl:''};
  const [f,setF]=useState(blank);
  const [editId,setEditId]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const fileRef=useRef(null);
  useEffect(()=>{ try{ localStorage.setItem('zh_seen_meet_'+user.id,String(Date.now())); }catch(e){} },[meetings.length]);
  function set(k,v){ setF(p=>Object.assign({},p,{[k]:v})); }
  function pickFile(e){ const file=e.target.files[0]; if(!file)return; set('attachmentName',file.name); const r=new FileReader(); r.onload=()=>set('attachmentData',r.result); r.readAsDataURL(file); }
  function dur(s,e){ if(!s||!e)return''; const a=s.split(':').map(Number),b=e.split(':').map(Number); let m=(b[0]*60+b[1])-(a[0]*60+a[1]); if(m<0)m+=1440; return Math.floor(m/60)+'h '+(m%60)+'m'; }
  function save(){
    if(!f.title.trim()||!f.date||!f.start){ alert('Please add at least a title, date and start time.'); return; }
    const all=DB.meetings();
    if(editId){ const m=all.find(x=>x.id===editId); if(m){ Object.assign(m,f,{duration:dur(f.start,f.end)}); DB.save.meetings(all);} }
    else {
      const mid=uid();
      all.push(Object.assign({id:mid,createdAt:now(),by:user.name||'Teacher'},f,{duration:dur(f.start,f.end)}));
      DB.save.meetings(all);
      /* also announce it (with reminder info) so students see it on the Announcements page */
      const remTxt=f.reminderMin?('\nReminder: '+f.reminderMin+' min before.'):'';
      const where=f.online!==false?'In-app video (open Meetings → Join).':(f.location||'See meeting details.');
      const post={id:uid(),title:'🎥 Meeting: '+f.title.trim(),
        text:'A meeting is scheduled for '+f.date+' at '+f.start+(f.end?('–'+f.end):'')+'.'+(f.purpose?('\nAgenda: '+f.purpose):'')+'\nWhere: '+where+remTxt,
        by:user.name||'Teacher',at:now(),meetingId:mid,replies:[]};
      DB.save.posts([...DB.posts(),post]);
    }
    setF(blank); setEditId(null); setShowForm(false);
  }
  function edit(m){ setF(Object.assign({},blank,m)); setEditId(m.id); setShowForm(true); }
  function del(id){ if(!confirm('Delete this meeting?'))return; DB.save.meetings(DB.meetings().filter(m=>m.id!==id)); }
  function setStatus(id,st){ const all=DB.meetings(); const m=all.find(x=>x.id===id); if(m){ m.status=st; DB.save.meetings(all);} }
  function mine(m){ return m.participants==='all'||(Array.isArray(m.participants)&&m.participants.includes(user.id)); }
  const list=isT?meetings:meetings.filter(mine);
  const badge={Scheduled:'pill-blue',Completed:'pill-green',Cancelled:'pill-red',Rescheduled:'pill-gray'};
  return (<div className="p-main">
    <div className="p-topbar">
      <div className="p-topbar-title">🎥 Meetings</div>
      {isT&&<button className="a-btn" onClick={()=>{setF(blank);setEditId(null);setShowForm(s=>!s);}} style={{background:'var(--coral)',color:'#fff',borderColor:'var(--coral)'}}>＋ Schedule meeting</button>}
    </div>
    <div className="p-page">
      {isT&&showForm&&(
        <div style={{background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:16,boxShadow:'4px 4px 0 var(--ink)',marginBottom:18}}>
          <div className="mfield"><label>Meeting title *</label><input value={f.title} onChange={e=>set('title',e.target.value)} placeholder="e.g. Math Progress Review"/></div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            <div className="mfield" style={{flex:1,minWidth:130}}><label>Date *</label><input type="date" value={f.date} onChange={e=>set('date',e.target.value)}/></div>
            <div className="mfield" style={{flex:1,minWidth:100}}><label>Start *</label><input type="time" value={f.start} onChange={e=>set('start',e.target.value)}/></div>
            <div className="mfield" style={{flex:1,minWidth:100}}><label>End</label><input type="time" value={f.end} onChange={e=>set('end',e.target.value)}/></div>
          </div>
          <div className="mfield"><label>Participants</label>
            <select value={f.participants==='all'?'all':'select'} onChange={e=>set('participants',e.target.value==='all'?'all':[])}>
              <option value="all">All students</option><option value="select">Choose students…</option>
            </select>
          </div>
          {f.participants!=='all'&&(
            <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:10}}>
              {students.map(s=>{ const on=Array.isArray(f.participants)&&f.participants.includes(s.id); return <button key={s.id} className="a-btn" onClick={()=>{ const arr=Array.isArray(f.participants)?f.participants.slice():[]; const i=arr.indexOf(s.id); if(i<0)arr.push(s.id); else arr.splice(i,1); set('participants',arr); }} style={{background:on?'var(--green-deep)':'white',color:on?'#fff':'var(--ink)',fontSize:12}}>{on?'✓ ':''}{s.name}</button>; })}
            </div>
          )}
          <div className="mfield"><label>Location / link</label>
            <label style={{display:'flex',gap:6,fontSize:13,marginBottom:6}}><input type="checkbox" checked={f.online!==false} onChange={e=>set('online',e.target.checked)}/> In-app video (Jitsi)</label>
            {f.online===false&&<input value={f.location} onChange={e=>set('location',e.target.value)} placeholder="Classroom / office, or paste a meeting link"/>}
          </div>

            <div className="mfield" style={{flex:1,minWidth:120}}><label>Status</label><select value={f.status} onChange={e=>set('status',e.target.value)}><option>Scheduled</option><option>Completed</option><option>Cancelled</option><option>Rescheduled</option></select></div>

          <div style={{display:'flex',gap:8}}><button className="mbtn" onClick={save}>{editId?'Save changes':'Schedule meeting'}</button><button className="a-btn" onClick={()=>{setShowForm(false);setEditId(null);setF(blank);}}>Cancel</button></div>
        </div>

      {list.length===0&&<div className="empty-state">No meetings {isT?'scheduled':'yet'}.</div>}

          <div style={{fontSize:13,opacity:0.8,margin:'6px 0'}}>📅 {m.date} · 🕐 {m.start}{m.end?('–'+m.end):''}{m.duration?(' ('+m.duration+')'):''}{m.recurrence&&m.recurrence!=='none'?(' · 🔁 '+m.recurrence):''}</div>

function embedVideo(url){
  const yt=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{11})/);
  if(yt) return <iframe src={'https://www.youtube.com/embed/'+yt[1]} style={{width:'100%',aspectRatio:'16/9',border:0,borderRadius:8}} allowFullScreen title="rec"/>;
  const gd=url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if(gd) return <iframe src={'https://drive.google.com/file/d/'+gd[1]+'/preview'} style={{width:'100%',aspectRatio:'16/9',border:0,borderRadius:8}} allowFullScreen title="rec"/>;
  const dbx=url.match(/dropbox\.com\/[^\s]+/);
  if(dbx){ const direct=url.replace('www.dropbox.com','dl.dropboxusercontent.com').replace('?dl=0','').replace('&dl=0',''); return <video src={direct} controls controlsList="nodownload noplaybackrate" onContextMenu={e=>e.preventDefault()} style={{width:'100%',borderRadius:8,background:'#000'}}/>; }
  return <video src={url} controls controlsList="nodownload noplaybackrate" onContextMenu={e=>e.preventDefault()} style={{width:'100%',borderRadius:8,background:'#000'}}/>;
}

function RegistrationsView(){

    if(a.kind==='student'){ const all=DB.students(); const r=all.find(x=>x.id===a.id); if(r){r.approved=true;DB.save.students(all);} }

    } else { DB.save.parents(DB.parents().filter(x=>x.id!==a.id)); }

/* ═══════════ PARENT PORTAL ═══════════ */function childReport(childId,since){
  const gids=DB.groups().filter(g=>(g.students||[]).includes(childId)).map(g=>g.id);
  const assigns=DB.assignments().filter(a=>gids.includes(a.groupId)&&(!since||(a.createdAt||0)>=since));
  const subs=DB.submissions().filter(s=>s.studentId===childId);
  const r={hwTotal:0,hwDone:0,mkTotal:0,mkDone:0,late:0,onTime:0,got:0,poss:0};
  assigns.forEach(a=>{
    const isHw=a.type!=='mock';
    if(isHw)r.hwTotal++;else r.mkTotal++;
    const sub=subs.find(s=>s.assignmentId===a.id);
    if(sub){ if(isHw)r.hwDone++;else r.mkDone++;
      if(isLate(a.dueDate,sub.submittedAt))r.late++;else r.onTime++;
      if(sub.mark!=null&&sub.mark!==undefined){ r.got+=Number(sub.mark)||0; r.poss+=Number(a.totalMark)||0; }
    }
  });
  r.hwNotDone=r.hwTotal-r.hwDone; r.mkNotDone=r.mkTotal-r.mkDone;
  r.pct=r.poss>0?Math.round(r.got/r.poss*100):null;
  return r;
}

  return (

/* ═══════════ PDF VIEWER (renders pages via PDF.js — works on phones) ═══════════ */
function PdfView({data}){
  const ref=useRef(null); const [err,setErr]=useState(''); const [busy,setBusy]=useState(true);
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      try{
        setBusy(true); setErr('');
        if(!data||!window.pdfjsLib){ setErr('PDF viewer not ready — use Download.'); setBusy(false); return; }
        const b64=(data.split(',')[1])||''; const bin=atob(b64);
        const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
        const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
        if(cancelled) return;
        const cont=ref.current; if(!cont) return; cont.innerHTML='';
        const width=cont.clientWidth||700;
        for(let p=1;p<=pdf.numPages;p++){
          const page=await pdf.getPage(p); if(cancelled) return;
          const base=page.getViewport({scale:1});
          const scale=Math.max(0.3,Math.min(2.5,(width-6)/base.width));
          const vp=page.getViewport({scale});
          const canvas=document.createElement('canvas');
          canvas.width=vp.width; canvas.height=vp.height;
          canvas.style.cssText='width:100%;height:auto;margin-bottom:8px;border:1px solid #ddd;border-radius:6px;';
          cont.appendChild(canvas);
          await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
          if(cancelled) return;
        }
        setBusy(false);
      }catch(e){ if(!cancelled){ setErr('Could not display this PDF here — tap Download to open it.'); setBusy(false); } }
    })();
    return ()=>{ cancelled=true; };
  },[data]);
  return (
    <div style={{marginTop:10}}>
      {busy&&<div style={{fontSize:12,opacity:0.6,marginBottom:6}}>⏳ Rendering PDF…</div>}
      <div ref={ref} style={{maxHeight:'75vh',overflowY:'auto',background:'#fff',border:'1px solid #ccc',borderRadius:8,padding:3}}/>
      {err&&<div style={{fontSize:12,color:'#a11',marginTop:6}}>{err}</div>}
    </div>
  );
}
function isPdfData(data,name){ return (data&&data.startsWith('data:application/pdf'))||(name&&/\.pdf$/i.test(name)); }

function CorrectionBox({name,data,label}){
  const [show,setShow]=useState(false);
  const [slow,setSlow]=useState(false);
  const isImg=data&&data.startsWith('data:image');
  const isPdf=isPdfData(data,name);

    <div style={{marginTop:8,padding:'10px 14px',background:'#DCEFE3',border:'2px solid #22c55e',borderRadius:10}}>

}

        ? <AccountNotice icon="⛔" title="Account deactivated" text="Accounts are currently deactivated by the teacher. Please check back later — your account will work again once the teacher reactivates it." onLogout={doLogout}/>
        : gate==='waiting'
        ? <AccountNotice icon="⏳" title="Waiting for approval" text={"Hi "+portalUser.name+"! Your account has been created and is waiting for the teacher to approve it. Once approved, this page opens automatically — keep it open or check back soon."} onLogout={doLogout}/>
        : portalUser.role==='parent'
        ? <ParentPortal user={portalUser} onLogout={doLogout}/>
        : <PortalApp
        user={portalUser}
        onLogout={doLogout}
        topics={topics}
        progress={progress}
        toggleDone={toggleDone}
        addQuestion={addQuestion}
        deleteQuestion={deleteQuestion}
        saveCroppedQuestion={saveCroppedQuestion}
        doneCount={doneCount}
        totalCount={totalCount}
      />}
    </div>
  );
  }

  /* ── DEFAULT: LOGIN ── */
  return (
    <LoginPage
      onSuccess={user=>{ doLogin(user); }}
      onBack={()=>{}}
    />
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
_syncBadge(); /* show version + sync status */

/* Gentle reminder shown only until the Firebase config is pasted in. */
if(!CLOUD_ON){
  var _b=document.createElement('div');
  _b.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#1F3A33;color:#fff;font:13px/1.4 Georgia,serif;padding:8px 14px;text-align:center;';
  _b.textContent='⚠ Local-only mode — registrations stay on this device. Paste your Firebase config near the top of index.html to enable cross-device sync.';
  document.body.appendChild(_b);
}

</script>
</body>
</html>
