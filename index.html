<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Zahra's IGCSE Math Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- Firebase (free Firestore database) — enables cross-device sync -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="questions-data.js"></script>
</head>
<body style="margin:0;">
<div id="app-root"></div>
<style>
  #app-root, #app-root * { box-sizing: border-box; }
  #app-root {
    --ink: #1F3A33;
    --paper: #F7F4EC;
    --paper-line: #d8dccb;
    --coral: #E8623D;
    --coral-dark: #C84F2F;
    --chalk-blue: #4C7A8C;
    --gold: #E0AC2B;
    --green-deep: #16261F;
    --level-easy: #22c55e;
    --level-medium: #f59e0b;
    --level-hard: #ef4444;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    min-height: 100vh;
    width: 100%;
    position: relative;
  }
  #app-root .display { font-family: 'Georgia', 'Spectral', serif; font-weight: 700; }
  #app-root .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }

  /* ===== Top bar ===== */
  .topbar {
    background: var(--green-deep);
    color: var(--paper);
    padding: 18px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 4px solid var(--coral);
  }
  .topbar .brand { display: flex; align-items: center; gap: 12px; }
  .topbar .brand .badge {
    width: 40px; height: 40px;
    background: var(--coral); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Georgia', serif; font-weight: 700; font-size: 18px;
    color: var(--green-deep); transform: rotate(-4deg);
  }
  .topbar .brand h1 { font-size: 19px; margin: 0; letter-spacing: 0.3px; }
  .topbar .brand p { margin: 0; font-size: 12px; opacity: 0.7; }
  .topbar .who { font-size: 13px; opacity: 0.85; display: flex; align-items: center; gap: 10px; }
  .topbar button.linklike { background: none; border: none; color: var(--coral); cursor: pointer; font-size: 13px; text-decoration: underline; padding: 0; }

  /* ===== Home page ===== */
  .home-wrap { max-width: 960px; margin: 0 auto; padding: 40px 32px; }
  .home-hero {
    background: var(--green-deep); color: var(--paper);
    border-radius: 16px; padding: 36px 40px; margin-bottom: 32px;
    border: 3px solid var(--ink);
    position: relative; overflow: hidden;
  }
  .home-hero::before {
    content: "π∑∫";
    position: absolute; right: 30px; top: 20px;
    font-size: 80px; opacity: 0.07; font-family: 'Georgia', serif;
    letter-spacing: 10px;
  }
  .home-hero h1 { font-size: 28px; margin: 0 0 8px; font-family: 'Georgia', serif; color: var(--gold); }
  .home-hero .sub { font-size: 15px; opacity: 0.85; margin-bottom: 20px; line-height: 1.6; }
  .home-hero .author-card {
    background: rgba(255,255,255,0.08); border-radius: 10px; padding: 16px 20px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .home-hero .author-name { font-size: 18px; font-weight: 700; color: var(--gold); }
  .home-hero .author-title { font-size: 13px; opacity: 0.8; font-style: italic; }
  .home-hero .author-contact { font-size: 13px; opacity: 0.9; display: flex; flex-wrap: wrap; gap: 16px; margin-top: 6px; }
  .home-hero .author-contact a { color: var(--gold); text-decoration: none; border-bottom: 1px solid rgba(224,172,43,0.4); }

  .home-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px; margin-bottom: 28px;
  }
  .home-stat-card {
    background: white; border: 2px solid var(--ink); border-radius: 12px;
    padding: 18px 20px; text-align: center;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .home-stat-card .big { font-size: 32px; font-weight: 800; font-family: 'Georgia', serif; color: var(--coral-dark); }
  .home-stat-card .lbl { font-size: 11px; text-transform: uppercase; opacity: 0.6; font-weight: 700; margin-top: 4px; }

  .home-section { margin-bottom: 32px; }
  .home-section h2 { font-size: 18px; font-family: 'Georgia', serif; margin: 0 0 14px; color: var(--green-deep); border-bottom: 2px solid var(--coral); padding-bottom: 6px; }

  .color-key { display: flex; flex-wrap: wrap; gap: 10px; }
  .color-key-item {
    display: flex; align-items: center; gap: 8px;
    background: white; border: 2px solid var(--ink); border-radius: 8px; padding: 8px 14px;
    font-size: 13px; font-weight: 600;
  }
  .color-dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; }

  .lvl-easy { background: #dcfce7; color: #166534; border: 1.5px solid #22c55e; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  .lvl-medium { background: #fef3c7; color: #92400e; border: 1.5px solid #f59e0b; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  .lvl-hard { background: #fee2e2; color: #991b1b; border: 1.5px solid #ef4444; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }

  .syllabus-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .syllabus-area { background: white; border: 2px solid var(--ink); border-radius: 10px; padding: 14px 16px; }
  .syllabus-area h4 { margin: 0 0 8px; font-size: 13px; color: var(--green-deep); font-weight: 700; }
  .syllabus-area ul { margin: 0; padding-left: 16px; font-size: 12px; line-height: 1.7; opacity: 0.8; }

  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .topic-chip {
    background: white; border: 2px solid var(--ink); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    transition: background 0.12s;
  }
  .topic-chip:hover { background: var(--ink); color: var(--paper); }
  .topic-chip .tnum { opacity: 0.5; font-size: 11px; margin-right: 6px; }
  .topic-chip .qcount { font-size: 10px; opacity: 0.6; background: rgba(0,0,0,0.07); padding: 1px 6px; border-radius: 5px; }

  .enter-btn {
    background: var(--coral); color: white; border: 3px solid var(--ink);
    border-radius: 10px; padding: 14px 28px; font-weight: 700; font-size: 16px;
    cursor: pointer; box-shadow: 5px 5px 0 var(--ink);
    transition: transform 0.08s, box-shadow 0.08s;
    display: block; margin: 0 auto; text-align: center;
  }
  .enter-btn:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--ink); }

  /* ===== Layout ===== */
  .layout { display: flex; min-height: calc(100vh - 78px); }
  .sidebar {
    width: 260px; flex-shrink: 0;
    background: rgba(255,255,255,0.5); border-right: 2px solid var(--ink);
    padding: 20px 16px;
  }
  .sidebar h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.55; margin: 18px 0 8px; font-weight: 700; }
  .sidebar h3:first-child { margin-top: 0; }
  .nav-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
    font-size: 14px; margin-bottom: 3px; font-weight: 600;
  }
  .nav-item:hover { background: rgba(0,0,0,0.05); }
  .nav-item.active { background: var(--ink); color: var(--paper); }
  .nav-item .count { font-size: 11px; opacity: 0.6; font-weight: 400; }
  .nav-item.active .count { opacity: 0.8; }

  .main { flex: 1; padding: 28px 32px; max-width: 880px; }
  .page-title { font-size: 26px; margin: 0 0 4px; }
  .page-sub { font-size: 14px; opacity: 0.65; margin: 0 0 24px; }

  /* ===== Question cards ===== */
  .qcard {
    background: white; border: 2px solid var(--ink);
    border-radius: 10px; margin-bottom: 14px; overflow: hidden;
  }
  .qcard .qhead {
    padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    cursor: pointer; gap: 12px;
  }
  .qcard .qhead:hover { background: #faf8f2; }
  .qnum { background: var(--chalk-blue); color: white; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-right: 8px; white-space: nowrap; }
  .qtext { font-size: 15px; line-height: 1.5; }
  .qmeta { display: flex; gap: 6px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
  .tag-done { background: #DCEFE3; color: #1F6B43; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .chev { font-size: 18px; opacity: 0.4; transition: transform 0.15s; }
  .qcard.open .chev { transform: rotate(180deg); }
  .answer-panel { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: #FBF6E9; border-top: 2px dashed var(--ink); }
  .qcard.open .answer-panel { max-height: 9000px; }
  .answer-inner { padding: 16px; font-size: 14px; line-height: 1.6; }

  .qref { display: inline-block; background: #EFE7D2; color: var(--green-deep); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.2px; white-space: nowrap; }
  .qbody { padding: 0 16px 14px 16px; }
  .qbody .qimg + .qimg { margin-top: 4px; }
  .answer-inner .qimg + .qimg { margin-top: 4px; }
  .reveal-hint { font-size: 12px; font-weight: 700; color: var(--chalk-blue); display: flex; align-items: center; gap: 5px; }
  .answer-inner .label { font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--coral-dark); margin-bottom: 6px; letter-spacing: 0.5px; }
  .mark-row { margin-top: 12px; display: flex; gap: 8px; }
  .mark-row button { border: 2px solid var(--ink); background: white; border-radius: 7px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .mark-row button.active { background: #1F6B43; color: white; border-color: #1F6B43; }

  .difficulty-box {
    background: white; border: 1.5px solid var(--ink); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
    font-size: 13px;
  }
  .difficulty-box .dlabel { font-weight: 700; opacity: 0.6; font-size: 11px; text-transform: uppercase; }

  .add-box { background: white; border: 2px dashed var(--ink); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .add-box textarea, .add-box input, .add-box select { width: 100%; border: 2px solid var(--ink); border-radius: 7px; padding: 9px 10px; font-family: inherit; font-size: 13px; margin-bottom: 10px; }
  .add-box textarea { min-height: 60px; resize: vertical; }
  .add-box .grid2 { display: flex; gap: 10px; }
  .add-box .grid2 > * { flex: 1; }
  .small-btn { background: var(--ink); color: var(--paper); border: none; border-radius: 7px; padding: 9px 16px; font-weight: 700; font-size: 13px; cursor: pointer; }

  .stat-row { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-card { background: white; border: 2px solid var(--ink); border-radius: 10px; padding: 14px 18px; min-width: 130px; flex: 1; }
  .stat-card .num { font-size: 26px; font-weight: 800; font-family: 'Georgia', serif; }
  .stat-card .lab { font-size: 11px; text-transform: uppercase; opacity: 0.6; font-weight: 700; }

  .mock-row { background: white; border: 2px solid var(--ink); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .mock-row .info { font-size: 14px; }
  .mock-row .score { font-family: 'Georgia', serif; font-weight: 800; font-size: 20px; color: var(--coral-dark); }
  .mock-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .mock-form input, .mock-form select { border: 2px solid var(--ink); border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: inherit; }

  .contact-card { background: var(--green-deep); color: var(--paper); border-radius: 12px; padding: 20px 24px; margin-top: 30px; }
  .contact-card h4 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--gold); }
  .contact-card a { color: var(--paper); text-decoration: none; border-bottom: 1px solid var(--coral); }
  .contact-line { font-size: 14px; margin-bottom: 4px; }

  .empty-state { text-align: center; padding: 50px 20px; opacity: 0.6; font-size: 14px; }

  .cropper-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: white; border: 2px solid var(--ink); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
  .cropper-toolbar input[type="file"] { font-size: 13px; }
  .cropper-toolbar button { border: 2px solid var(--ink); background: white; border-radius: 7px; padding: 7px 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .cropper-toolbar button.primary { background: var(--ink); color: var(--paper); }
  .cropper-toolbar span.pageinfo { font-size: 13px; font-weight: 700; }
  .cropper-canvas-wrap { position: relative; border: 2px solid var(--ink); border-radius: 10px; overflow: auto; max-height: 70vh; background: #ddd; margin-bottom: 14px; }
  .cropper-canvas-wrap canvas.pdfcanvas { display: block; }
  .crop-rect { position: absolute; border: 2px dashed var(--coral); background: rgba(232,98,61,0.15); pointer-events: none; }
  .capture-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .capture-box { flex: 1; min-width: 220px; background: white; border: 2px solid var(--ink); border-radius: 10px; padding: 12px; }
  .capture-box h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
  .capture-box img { max-width: 100%; border: 1px solid #ccc; border-radius: 6px; }
  .capture-box .placeholder { font-size: 12px; opacity: 0.5; padding: 20px 0; text-align: center; }
  .save-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .save-row select { border: 2px solid var(--ink); border-radius: 7px; padding: 8px 10px; font-family: inherit; font-size: 13px; }
  .qimg { max-width: 100%; border-radius: 6px; border: 1px solid #ddd; margin-top: 6px; }

  /* ===== LOGIN PAGE ===== */
  .login-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 2rem; flex-direction: column; gap: 1rem;
  }
  .login-back {
    align-self: flex-start; display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--chalk-blue); cursor: pointer; font-weight: 700;
    background: none; border: none; padding: 0;
  }
  .login-back:hover { color: var(--ink); }
  .login-card {
    background: white; border: 3px solid var(--ink); border-radius: 14px;
    padding: 2.5rem; width: 100%; max-width: 470px;
    box-shadow: 6px 6px 0 var(--ink);
  }
  .login-logo { font-size: 22px; font-weight: 700; font-family: 'Georgia', serif; color: var(--green-deep); margin-bottom: 4px; }
  .login-tagline { font-size: 13px; color: var(--chalk-blue); margin-bottom: 1.75rem; }
  .login-tabs {
    display: flex; gap: 4px; background: var(--paper); border: 2px solid var(--ink);
    border-radius: 9px; padding: 3px; margin-bottom: 1.75rem;
  }
  .login-tab {
    flex: 1; text-align: center; padding: 9px 4px; border-radius: 6px;
    font-size: 12.5px; cursor: pointer; font-weight: 700; color: var(--ink); opacity: 0.5; transition: .12s; white-space: nowrap;
  }
  .login-tab.active { background: var(--ink); color: var(--paper); opacity: 1; }
  .lfield { margin-bottom: 14px; }
  .lfield label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--chalk-blue); margin-bottom: 5px; }
  .lfield input { width: 100%; padding: 9px 12px; border: 2px solid var(--ink); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--paper); color: var(--ink); outline: none; }
  .lfield input:focus { border-color: var(--coral); box-shadow: 3px 3px 0 var(--coral); }
  .login-btn {
    width: 100%; padding: 11px; background: var(--coral); color: white;
    border: 3px solid var(--ink); border-radius: 9px; font-weight: 700; font-size: 15px;
    cursor: pointer; box-shadow: 4px 4px 0 var(--ink); margin-top: 4px;
    transition: transform .08s, box-shadow .08s;
  }
  .login-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .login-switch { text-align: center; margin-top: 1rem; font-size: 13px; }
  .login-switch span { color: var(--coral); cursor: pointer; font-weight: 700; border-bottom: 1px solid var(--coral); }
  .lerr { color: var(--coral-dark); font-size: 13px; font-weight: 600; margin-top: 8px; background: #FEE2E2; border: 1.5px solid #EF4444; border-radius: 6px; padding: 7px 10px; }

  /* ===== PORTAL LAYOUT ===== */
  .portal-layout { display: flex; height: calc(100vh - 78px); overflow: hidden; }

  /* Portal sidebar */
  .p-sidebar {
    width: 260px; flex-shrink: 0;
    background: rgba(255,255,255,0.6); border-right: 2px solid var(--ink);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .p-sidebar-top { padding: 14px 16px; border-bottom: 2px solid var(--ink); }
  .p-sidebar-logo { font-size: 13px; font-weight: 700; font-family: 'Georgia', serif; color: var(--green-deep); }
  .p-sidebar-user { font-size: 11px; color: var(--chalk-blue); margin-top: 2px; }
  .p-sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 10px; }
  .p-nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.5; font-weight: 700; padding: 0 6px; margin: 14px 0 5px; }
  .p-nav-label:first-child { margin-top: 0; }
  .p-nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 2px;
    transition: background .1s;
  }
  .p-nav-item:hover { background: rgba(0,0,0,0.06); }
  .p-nav-item.active { background: var(--ink); color: var(--paper); }

  /* Group row with 3-dot menu */
  .p-group-row { display: flex; align-items: center; margin-bottom: 2px; }
  .p-group-btn {
    flex: 1; display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--ink);
    transition: background .1s; min-width: 0;
  }
  .p-group-btn:hover { background: rgba(0,0,0,0.06); }
  .p-group-btn.active { background: var(--ink); color: var(--paper); }
  .p-group-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-dots-btn {
    width: 26px; height: 26px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px; cursor: pointer; font-size: 16px;
    color: var(--chalk-blue); position: relative;
  }
  .p-dots-btn:hover { background: rgba(0,0,0,0.07); color: var(--ink); }
  .p-dots-menu {
    position: absolute; top: 100%; right: 0; z-index: 400;
    background: white; border: 2px solid var(--ink); border-radius: 10px;
    padding: 5px; min-width: 200px;
    box-shadow: 5px 5px 0 var(--ink);
  }
  .p-dots-item {
    padding: 9px 13px; font-size: 13px; font-weight: 600;
    cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 8px;
    color: var(--ink);
  }
  .p-dots-item:hover { background: var(--paper); }
  .p-dots-item.danger { color: var(--coral-dark); }

  .p-sidebar-foot { padding: 12px 10px; border-top: 2px solid var(--ink); display: flex; gap: 8px; }
  .p-foot-btn {
    border: 2px solid var(--ink); background: white; border-radius: 8px;
    padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink); transition: transform .08s;
  }
  .p-foot-btn:hover { transform: translate(-1px,-1px); }

  /* Portal main */
  .p-main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .p-topbar {
    padding: 16px 24px; border-bottom: 2px solid var(--ink);
    background: rgba(255,255,255,0.7);
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  }
  .p-topbar-title { font-size: 18px; font-weight: 700; font-family: 'Georgia', serif; flex: 1; color: var(--green-deep); }
  .p-page { padding: 24px 28px; flex: 1; }
  .p-tabs { display: flex; gap: 6px; flex-wrap: wrap; }

    padding: 6px 16px; border-radius: 8px; font-size: 13px; font-weight: 700;

async function _uploadFile(b64){

  const parts=[]; for(let i=0;i<b64.length;i+=CHUNK) parts.push(b64.slice(i,i+CHUNK));

/* Convert an app item into the small "doc" form stored in Firestore (files externalised). */
async function _toDoc(k,item){

    const mapKey=k+':'+item.id+':'+f;
    const val=item[f];
    if(typeof val==='string' && val.startsWith('data:')){
      const prevFid=_fieldFileId[mapKey];
      if(prevFid && _fileBlobs[prevFid]===val){ doc[f]={__fileId:prevFid}; }
      else { const fid=await _uploadFile(val); _fieldFileId[mapKey]=fid; doc[f]={__fileId:fid}; }
    } else if(val && typeof val==='object' && val.__fileId){
      doc[f]=val; /* already externalised */
    } else {
      doc[f]=val||null;
    }
  }
  return doc;
}

/* Convert a Firestore doc back into an app item (file fields resolved to their base64). */

/* Pending local writes not yet confirmed on the server. These keep optimistic UI

const _pending    = { groups:{}, students:{}, messages:{}, submissions:{}, assignments:{}, posts:{}, meetings:{}, parents:{}, recordings:{}, sessions:{}, settings:{} };
const _pendingDel = { groups:{}, students:{}, messages:{}, submissions:{}, assignments:{}, posts:{}, meetings:{}, parents:{}, recordings:{}, sessions:{}, settings:{} };

  const next=_clone(arr);

  const seen={};
  next.forEach(it=>{ if(it&&it.id!=null){ seen[it.id]=true; _pending[k][it.id]=it; delete _pendingDel[k][it.id]; } });
  Object.keys(_shadow[k]).forEach(id=>{ if(!seen[id]) _pendingDel[k][id]=true; });

function _clean(o){ const r={}; for(const key in o){ if(o[key]!==undefined) r[key]=o[key]; } return r; }

/* Write one item: the RECORD lands first (so it appears for everyone within a second),
   then any heavy file uploads in the background and patches itself in. */
async function _writeItem(k,item){
  const fileFields=FILE_FIELDS[k]||[];
  const base=JSON.parse(JSON.stringify(item)); /* JSON round-trip also drops undefined */
  const uploads=[];
  for(const f of fileFields){
    const mapKey=k+':'+item.id+':'+f;
    const val=item[f];
    const prevDoc=_shadow[k][item.id] && _shadow[k][item.id][f];  /* what's currently in the cloud */
    if(typeof val==='string' && val.startsWith('data:')){
      const prevFid=_fieldFileId[mapKey];
      if(prevFid && _fileBlobs[prevFid]===val){ base[f]={__fileId:prevFid}; }
      else { base[f]=null; uploads.push({f,val,mapKey}); } /* defer the heavy file */
    } else if(val && typeof val==='object' && val.__fileId){ base[f]=val; }
    else if((val===''||val==null) && prevDoc && typeof prevDoc==='object' && prevDoc.__fileId){
      base[f]=prevDoc;  /* file not downloaded on this device yet → KEEP the existing file, don't wipe it */
    }
    else { base[f]=(val===undefined?null:val); }
  }
  const cleaned=_clean(base);
  if(!_shadowEqual(_shadow[k][item.id],cleaned)){
    await colRef(k).doc(String(item.id)).set(cleaned);   /* record appears immediately */
    _shadow[k][item.id]=cleaned;
  }
  for(const u of uploads){
    try{
      const fid=await _uploadFile(u.val);
      _fieldFileId[u.mapKey]=fid;
      const patch={}; patch[u.f]={__fileId:fid};
      await colRef(k).doc(String(item.id)).set(patch,{merge:true});
      _shadow[k][item.id]=Object.assign({},_shadow[k][item.id],patch);
      _rerender();
    }catch(e){ console.warn('File upload failed ('+k+'/'+u.f+'):',e); }
  }

async function _pushToCloud(k,arr){

    const seen={};

      if(!item || item.id==null) continue;

      if(!seen[id]){ try{ await colRef(k).doc(String(id)).delete(); }catch(e){} delete _shadow[k][id]; delete _pendingDel[k][id]; }
    }

/* ---- live listeners: any change on any device updates every device ---- */

    colRef(k).onSnapshot(snap=>{
      const shadow={}; const map={};
      snap.forEach(d=>{ const data=d.data()||{}; shadow[d.id]=data; map[d.id]=data; });

      Object.keys(_pending[k]).forEach(id=>{ map[id]=_pending[k][id]; });
      Object.keys(_pendingDel[k]).forEach(id=>{ delete map[id]; });

/* ═══════════ PDF CROPPER ═══════════ */
function PdfCropper({topics,onSaveQuestion}) {
  const [pdfDoc,setPdfDoc]=useState(null);
  const [pageNum,setPageNum]=useState(1);
  const [numPages,setNumPages]=useState(0);
  const [dragStart,setDragStart]=useState(null);
  const [cropRect,setCropRect]=useState(null);
  const [capturedQ,setCapturedQ]=useState(null);
  const [capturedA,setCapturedA]=useState(null);
  const [saveTopic,setSaveTopic]=useState(topics[0]?.id||"");
  const canvasRef=useRef(null);
  const wrapRef=useRef(null);
  useEffect(()=>{ if(pdfDoc)renderPage(pageNum); },[pdfDoc,pageNum]);
  async function handleFile(e){ const file=e.target.files[0]; if(!file)return; const ab=await file.arrayBuffer(); const doc=await pdfjsLib.getDocument({data:ab}).promise; setPdfDoc(doc); setNumPages(doc.numPages); setPageNum(1); }
  async function renderPage(n){ if(!pdfDoc||!canvasRef.current)return; const page=await pdfDoc.getPage(n); const viewport=page.getViewport({scale:1.6}); const canvas=canvasRef.current; canvas.width=viewport.width; canvas.height=viewport.height; const ctx=canvas.getContext("2d"); await page.render({canvasContext:ctx,viewport}).promise; }
  function getRelPos(e){ const rect=canvasRef.current.getBoundingClientRect(); return{x:e.clientX-rect.left+wrapRef.current.scrollLeft,y:e.clientY-rect.top+wrapRef.current.scrollTop}; }
  function onMouseDown(e){ if(!pdfDoc)return; setCropRect(null); setDragStart(getRelPos(e)); }
  function onMouseMove(e){ if(!dragStart)return; const cur=getRelPos(e); setCropRect({x:Math.min(dragStart.x,cur.x),y:Math.min(dragStart.y,cur.y),w:Math.abs(cur.x-dragStart.x),h:Math.abs(cur.y-dragStart.y)}); }
  function onMouseUp(){ setDragStart(null); }
  function cropToDataUrl(){ if(!cropRect||!canvasRef.current)return null; const src=canvasRef.current; const tmp=document.createElement("canvas"); tmp.width=cropRect.w; tmp.height=cropRect.h; tmp.getContext("2d").drawImage(src,cropRect.x,cropRect.y,cropRect.w,cropRect.h,0,0,cropRect.w,cropRect.h); return tmp.toDataURL("image/jpeg",0.9); }
  function captureAsQuestion(){ const d=cropToDataUrl(); if(d)setCapturedQ(d); }
  function captureAsAnswer(){ const d=cropToDataUrl(); if(d)setCapturedA(d); }
  function saveToTopic(){ if(!capturedQ||!capturedA||!saveTopic)return; onSaveQuestion(saveTopic,capturedQ,capturedA); setCapturedQ(null); setCapturedA(null); setCropRect(null); }
  return (
    <div>
      <h2 className="page-title display">PDF Question Cropper</h2>
      <p className="page-sub">Upload your own book PDF. Browse to a page, drag a box around the question, capture it, then do the same for the answer.</p>
      <div className="cropper-toolbar">
        <input type="file" accept="application/pdf" onChange={handleFile}/>
        {pdfDoc&&<><button onClick={()=>setPageNum(p=>Math.max(1,p-1))}>← Prev</button><span className="pageinfo">Page {pageNum}/{numPages}</span><button onClick={()=>setPageNum(p=>Math.min(numPages,p+1))}>Next →</button><input type="number" min="1" max={numPages} value={pageNum} onChange={e=>setPageNum(Math.min(numPages,Math.max(1,Number(e.target.value)||1)))} style={{width:60,border:"2px solid var(--ink)",borderRadius:6,padding:"6px 8px",fontFamily:"inherit"}}/></>}
      </div>
      {pdfDoc&&(<div className="cropper-canvas-wrap" ref={wrapRef} onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} style={{cursor:"crosshair"}}><canvas ref={canvasRef} className="pdfcanvas"/>{cropRect&&<div className="crop-rect" style={{left:cropRect.x,top:cropRect.y,width:cropRect.w,height:cropRect.h}}/>}</div>)}
      <div className="capture-row">
        <div className="capture-box"><h4>Question</h4>{capturedQ?<img src={capturedQ} alt="q"/>:<div className="placeholder">No question captured yet</div>}</div>
        <div className="capture-box"><h4>Answer / Mark Scheme</h4>{capturedA?<img src={capturedA} alt="a"/>:<div className="placeholder">No answer captured yet</div>}</div>
      </div>
      <div className="capture-row" style={{gap:8,flexWrap:"wrap"}}>
        <button className="small-btn" onClick={captureAsQuestion} disabled={!cropRect}>Capture as Question</button>
        <button className="small-btn" onClick={captureAsAnswer} disabled={!cropRect}>Capture as Answer</button>
      </div>
      <div className="save-row" style={{marginTop:10}}>
        <select value={saveTopic} onChange={e=>setSaveTopic(e.target.value)}>{topics.map(t=><option key={t.id} value={t.id}>{t.num}. {t.name}</option>)}</select>
        <button className="small-btn" onClick={saveToTopic} disabled={!capturedQ||!capturedA}>Save to Topic</button>
      </div>
    </div>
  );
}

            <div className="lfield"><label>Full name</label><input type="text" value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="Your name"/></div>
            <div className="lfield"><label>Email</label><input type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})} placeholder="student@email.com"/></div>
            <div className="lfield"><label>Password</label><input type="password" value={f.pass} onChange={e=>setF({...f,pass:e.target.value})} placeholder="Create a password"/></div>
            {err&&<div className="lerr">{err}</div>}
            <button className="login-btn" onClick={doStudentRegister}>Create account</button>
            <div className="login-switch">Already registered? <span onClick={()=>{setMode('login');setErr('');}}>Sign in</span></div>
          </>
        )}
      </div>
    </div>
  );
}

/* ═══════════ PORTAL MODAL ═══════════ */
function Modal({title,onClose,children}) {
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box">
        <div className="modal-hd">
          <div className="modal-title">{title}</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ═══════════ PORTAL APP ═══════════ */
function PortalApp({user,onLogout,topics,progress,toggleDone,addQuestion,deleteQuestion,saveCroppedQuestion,doneCount,totalCount}) {
  const [view,setView]=useState('home');   // home | group | ebook
  const [groupId,setGroupId]=useState(null);
  const [subView,setSubView]=useState('homework');
  const [dotsOpen,setDotsOpen]=useState(null);
  const [chatTarget,setChatTarget]=useState(null);
  const [modal,setModal]=useState(null);  // {type,id,extra}
  const [tick,setTick]=useState(0);
  const [pendingFile,setPendingFile]=useState({});
  const [showManageStudents,setShowManageStudents]=useState(false);
  // eBook state
  const [ebookTopic,setEbookTopic]=useState(null);
  const [ebookLockMsg,setEbookLockMsg]=useState(false);
  const [ebookSearch,setEbookSearch]=useState('');
  const [ebookLevelFilter,setEbookLevelFilter]=useState('All');
  const [openQ,setOpenQ]=useState(null);
  const [reviewAssignId,setReviewAssignId]=useState(null);
  const [liveMeeting,setLiveMeeting]=useState(null);
  const [assignStudentId,setAssignStudentId]=useState(null);

  const refresh=()=>setTick(t=>t+1);
  const isT=user.role==='teacher';

  const groups=DB.groups();
  const myGroups=isT?groups:groups.filter(g=>(g.students||[]).includes(user.id));
  const allStudents=DB.students();

  function removeStudentAccount(sid){
    if(!confirm('Remove this student account? They will be removed from all groups.'))return;
    // Remove from all groups
    const grps=DB.groups();
    grps.forEach(g=>{g.students=(g.students||[]).filter(s=>s!==sid);});
    DB.save.groups(grps);
    // Remove submissions
    DB.save.submissions(DB.submissions().filter(s=>s.studentId!==sid));
    // Remove messages
    DB.save.messages(DB.messages().filter(m=>m.from!==sid&&m.to!==sid));
    // Remove student
    DB.save.students(DB.students().filter(s=>s.id!==sid));
    refresh();
  }

  function openGroup(id,tab,reviewId){ setGroupId(id); setView('group'); setSubView(tab||'homework'); setDotsOpen(null); setReviewAssignId(reviewId||null); }
  function openHome(){ setView('home'); setGroupId(null); setDotsOpen(null); setReviewAssignId(null); }
  function deleteGroup(id){
    if(!confirm('Delete this group and all its assignments?'))return;
    const aIds=DB.assignments().filter(a=>a.groupId===id).map(a=>a.id);
    DB.save.assignments(DB.assignments().filter(a=>a.groupId!==id));
    DB.save.submissions(DB.submissions().filter(s=>!aIds.includes(s.assignmentId)));
    DB.save.groups(DB.groups().filter(g=>g.id!==id));
    if(groupId===id){ setGroupId(null); setView('home'); }
    setDotsOpen(null); refresh();
  }
  function renameGroup(g){
    const nn=prompt('Group name:', g.name); if(nn==null) return;
    if(!nn.trim()){ alert('Please enter a name.'); return; }
    const all=DB.groups(); const r=all.find(x=>x.id===g.id); if(r){ r.name=nn.trim(); DB.save.groups(all);} refresh();
  }
  function removeFromGroup(gid,sid){
    if(!confirm('Remove this student from the group?'))return;
    const all=DB.groups(); const g=all.find(x=>x.id===gid); if(g){ g.students=(g.students||[]).filter(id=>id!==sid); DB.save.groups(all);} refresh();
  }

  /* sidebar */
  const sidebar = (
    <div className="p-sidebar">
      <div className="p-sidebar-top" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
        <div>
          <div className="p-sidebar-logo">Zπ Maths Hub Portal</div>
          <div className="p-sidebar-user">{user.name} · {isT?'Teacher':'Student'}</div>
        </div>
        <Notifications user={user} onOpenPosts={()=>{setView('posts');setDotsOpen(null);}} onOpenGroup={(id,tab,rid)=>id?openGroup(id,tab,rid):openHome()} onOpenMeetings={()=>{setView('meetings');setDotsOpen(null);}} onAddStudent={(sid)=>setAssignStudentId(sid)} onOpenParents={()=>{setView('parents');setDotsOpen(null);}} onOpenRegs={()=>{setView('registrations');setDotsOpen(null);}}/>
      </div>
      <div className="p-sidebar-nav">
        <div className="p-nav-label">Navigation</div>
        <div className={"p-nav-item "+(view==='home'?'active':'')} onClick={openHome}>🏠 Home</div>
        <div className={"p-nav-item "+(view==='ebook'?'active':'')} onClick={()=>{setView('ebook');setEbookTopic(null);setDotsOpen(null);}}>📖 eBook</div>
        <div className={"p-nav-item "+(view==='lessons'?'active':'')} onClick={()=>{setView('lessons');setDotsOpen(null);}}>📊 Lessons</div>
        <div className={"p-nav-item "+(view==='posts'?'active':'')} onClick={()=>{setView('posts');setDotsOpen(null);}}>📌 Announcements</div>
        <div className={"p-nav-item "+(view==='recordings'?'active':'')} onClick={()=>{setView('recordings');setDotsOpen(null);}}>🎬 Recordings</div>
        {isT&&<div className={"p-nav-item "+(view==='parents'?'active':'')} onClick={()=>{setView('parents');setDotsOpen(null);}}>👪 Parents</div>}

        <div className="p-nav-label">Groups</div>
        {myGroups.map(g=>(
          <div key={g.id} className="p-group-row">
            <div className={"p-group-btn "+(view==='group'&&groupId===g.id?'active':'')} onClick={()=>openGroup(g.id)}>
              <span>👥</span><span>{g.name}</span>
            </div>
            {isT&&(
              <div className="p-dots-btn" onClick={e=>{e.stopPropagation();setDotsOpen(dotsOpen===g.id?null:g.id);}}>
                ⋮
                {dotsOpen===g.id&&(
                  <div className="p-dots-menu">
                    <div className="p-dots-item" onClick={()=>{openGroup(g.id,'members');setDotsOpen(null);}}>👥 Manage students</div>
                    <div className="p-dots-item" onClick={()=>{renameGroup(g);setDotsOpen(null);}}>✏️ Rename group</div>
                    <div className="p-dots-item" onClick={()=>{setModal({type:'addStudent',id:g.id});setDotsOpen(null);}}>➕ Add students</div>
                    <div className="p-dots-item" onClick={()=>{setModal({type:'addAssign',id:g.id,extra:'homework'});setDotsOpen(null);}}>📋 Add homework</div>
                    <div className="p-dots-item" onClick={()=>{setModal({type:'addAssign',id:g.id,extra:'mock'});setDotsOpen(null);}}>📝 Add mock exam</div>
                    <div className="p-dots-item danger" onClick={()=>deleteGroup(g.id)}>🗑 Delete group</div>
                  </div>
                )}
              </div>
            )}
          </div>
        ))}
        {isT&&<div className="p-nav-item" onClick={()=>setModal({type:'createGroup'})} style={{marginTop:6}}>＋ Create group</div>}
      </div>
      <div className="p-sidebar-foot">
        <button className="p-foot-btn" onClick={onLogout} style={{flex:1}}>Sign out</button>
      </div>
    </div>
  );

  /* Manage students overlay */
  const manageStudentsOverlay = showManageStudents?(
    <Modal title={"All registered students ("+allStudents.length+")"} onClose={()=>setShowManageStudents(false)}>
      {allStudents.length===0&&<div className="empty-state">No students registered yet.</div>}
      {allStudents.map(s=><div key={s.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid #eee'}}>
        <div style={{width:32,height:32,borderRadius:'50%',background:'var(--chalk-blue)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700}}>{initials(s.name)}</div>
        <div style={{flex:1}}>
          <div style={{fontWeight:600,fontSize:14}}>{s.name}</div>
          <div style={{fontSize:12,opacity:0.6}}>{s.email}</div>
          <div style={{fontSize:11,opacity:0.5}}>Joined {fmtDate(s.createdAt||Date.now())}</div>
        </div>
        <button className="a-btn danger" onClick={()=>{removeStudentAccount(s.id);setShowManageStudents(false);setTimeout(()=>setShowManageStudents(true),50);}}>🗑 Remove</button>
      </div>)}
    </Modal>
  ):null;

  /* Assign a (newly registered) student to a group */
  const assignStudent = assignStudentId?allStudents.find(s=>s.id===assignStudentId):null;
  function addStudentToGroup(sid,gid){
    const all=DB.groups(); const g=all.find(x=>x.id===gid); if(g){ g.students=g.students||[]; if(!g.students.includes(sid)) g.students.push(sid); DB.save.groups(all);} 
  }
  const assignStudentOverlay = assignStudent?(
    <Modal title={"Add "+assignStudent.name+" to a group"} onClose={()=>setAssignStudentId(null)}>
      <div style={{fontSize:13,opacity:0.7,marginBottom:10}}>{assignStudent.email}</div>
      {groups.length===0&&<div className="empty-state">No groups yet. Create a group first, then add the student.</div>}
      {groups.map(g=>{ const inG=(g.students||[]).includes(assignStudent.id); return (
        <div key={g.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid #eee'}}>
          <div style={{flex:1,fontWeight:600,fontSize:14}}>{g.name}<span style={{fontWeight:400,fontSize:12,opacity:0.6}}> · {(g.students||[]).length} student(s)</span></div>
          {inG?<span className="pill pill-green">✓ In group</span>
             :<button className="a-btn" onClick={()=>addStudentToGroup(assignStudent.id,g.id)} style={{background:'var(--green-deep)',color:'#fff',borderColor:'var(--green-deep)'}}>＋ Add</button>}
        </div>); })}
    </Modal>
  ):null;

  /* ── HOME ── */
  const portalHome = ()=>{
    const assigns=DB.assignments();
    if(isT){
      return (
        <div className="p-main">
          <div className="p-topbar">
            <div className="p-topbar-title">Welcome back, {user.name} 👋</div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <button className="a-btn" onClick={()=>setView('registrations')} style={{background:'var(--chalk-blue)',color:'white',borderColor:'var(--chalk-blue)'}}>👤 {allStudents.length} student{allStudents.length!==1?'s':''} registered</button>
              <button className="a-btn" onClick={()=>setView('registrations')} style={{background:'var(--green-deep)',color:'white',borderColor:'var(--green-deep)'}}>👪 {DB.parents().length} parent{DB.parents().length!==1?'s':''}</button>
              <button className="a-btn" onClick={()=>setModal({type:'createGroup'})}>＋ New group</button>
            </div>
          </div>
          <div className="p-page">
            <HomePage topics={topics} onEnter={(topicId)=>{setView('ebook');if(topicId){setEbookTopic(topicId);}}}/>
          </div>
        </div>
      );
    }
    return (
      <div className="p-main">
        <div className="p-topbar"><div className="p-topbar-title">Hello, {user.name} 👋</div><div style={{fontSize:12,opacity:0.75,fontWeight:700,textAlign:'right'}}>👥 {allStudents.length+DB.parents().length} registered</div></div>
        <div className="p-page">
          {myGroups.length>0&&(
            <div style={{background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:'16px 20px',boxShadow:'4px 4px 0 var(--ink)',marginBottom:18}}>
              <div style={{fontFamily:'Georgia,serif',fontWeight:700,fontSize:16,marginBottom:14,color:'var(--green-deep)'}}>My groups</div>
              <div className="p-cards">
                {myGroups.map(g=>{
                  const hw=assigns.filter(a=>a.groupId===g.id&&a.type==='homework').length;
                  const mk=assigns.filter(a=>a.groupId===g.id&&a.type==='mock').length;
                  return <div key={g.id} className="p-gcard" onClick={()=>openGroup(g.id)}>
                    <div style={{fontWeight:700,marginBottom:8}}>{g.name}</div>
                    <div style={{display:'flex',gap:6}}><span className="pill pill-blue">{hw} hw</span><span className="pill pill-gray">{mk} mocks</span></div>
                  </div>;
                })}
              </div>
            </div>
          )}
          {myGroups.length===0&&<div style={{background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:'16px 20px',boxShadow:'4px 4px 0 var(--ink)',marginBottom:18}}><div className="empty-state">Waiting for your teacher to add you to a group.</div></div>}
          <HomePage topics={topics} onEnter={(topicId)=>{setView('ebook');if(topicId){setEbookTopic(topicId);}}}/>
        </div>
      </div>
    );
  };

  /* ── GROUP VIEW ── */
  const groupView = ()=>{
    const group=DB.groups().find(g=>g.id===groupId);
    if(!group) return <div className="p-main"><div className="p-topbar"><div className="p-topbar-title">Group not found</div></div></div>;

    // Full-page review mode
    if(reviewAssignId){
      const assignment=DB.assignments().find(a=>a.id===reviewAssignId);
      if(!assignment) { setReviewAssignId(null); return null; }
      return (
        <div className="p-main">
          <div className="p-topbar">
            <button className="a-btn" onClick={()=>setReviewAssignId(null)}>← Back</button>
            <div className="p-topbar-title" style={{flex:1}}>{assignment.title}</div>
            <span className="pill pill-gray">{assignment.type==='homework'?'Homework':'Mock'}</span>
          </div>
          <div className="p-page">
            <FullReviewPage assignId={reviewAssignId} group={group} tick={tick} refresh={refresh}/>
          </div>
        </div>
      );
    }

    const tabs=isT?['homework','mock','track','members','chat']:['homework','mock','track','chat'];
    const lbls={homework:'Homework',mock:'Mock Exam',track:'Track',members:'👥 Members',chat:'Chat'};
    const groupStudents=DB.students().filter(s=>(group.students||[]).includes(s.id));
    return (
      <div className="p-main">
        <div className="p-topbar" style={{flexWrap:'wrap',gap:8}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <div className="p-topbar-title">{group.name}</div>
            {isT&&<button className="a-btn" onClick={()=>renameGroup(group)} style={{fontSize:11,padding:'4px 9px'}}>✏️ Rename</button>}
            {isT&&<button className="a-btn danger" onClick={()=>deleteGroup(group.id)} style={{fontSize:11,padding:'4px 9px'}}>🗑 Delete</button>}
          </div>
          <div className="p-tabs">{tabs.map(t=><button key={t} className={"p-tab "+(subView===t?'active':'')} onClick={()=>{setSubView(t);setReviewAssignId(null);}}>{lbls[t]}</button>)}</div>
        </div>
        <div className="p-page">
          {subView==='homework'&&<AssignView type="homework" groupId={groupId} user={user} onModal={setModal} tick={tick} refresh={refresh} onReview={setReviewAssignId}/>}
          {subView==='mock'&&<AssignView type="mock" groupId={groupId} user={user} onModal={setModal} tick={tick} refresh={refresh} onReview={setReviewAssignId}/>}
          {subView==='track'&&<TrackView groupId={groupId} user={user} onModal={setModal} tick={tick}/>}
          {subView==='members'&&isT&&(
            <div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
                <div style={{fontFamily:'Georgia,serif',fontWeight:700,color:'var(--green-deep)'}}>Students in this group ({groupStudents.length})</div>
                <button className="a-btn" onClick={()=>setModal({type:'addStudent',id:groupId})} style={{background:'var(--green-deep)',color:'#fff',borderColor:'var(--green-deep)'}}>➕ Add students</button>
              </div>
              {groupStudents.length===0&&<div className="empty-state">No students in this group yet. Tap "Add students".</div>}
              {groupStudents.map(s=>(
                <div key={s.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid #eee'}}>
                  <div style={{width:32,height:32,borderRadius:'50%',background:'var(--chalk-blue)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,flexShrink:0}}>{initials(s.name)}</div>
                  <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:14}}>{s.name}</div><div style={{fontSize:12,opacity:0.6}}>{s.email}</div></div>
                  <button className="a-btn danger" onClick={()=>removeFromGroup(groupId,s.id)} style={{fontSize:12,flexShrink:0}}>Remove</button>
                </div>
              ))}
            </div>
          )}
          {subView==='chat'&&<ChatView groupId={groupId} user={user} chatTarget={chatTarget} setChatTarget={setChatTarget} tick={tick} refresh={refresh}/>}
        </div>
      </div>
    );
  };

  /* ── MODALS ── */
  const renderModal = ()=>{
    if(!modal) return null;
    const {type,id,extra}=modal;
    const close=()=>{ setModal(null); setPendingFile({}); refresh(); };

    if(type==='createGroup') return (
      <Modal title="Create group" onClose={close}>
        <CreateGroupForm onDone={close}/>
      </Modal>
    );
    if(type==='addStudent') return (
      <Modal title={"Add students — "+( DB.groups().find(g=>g.id===id)||{name:''}).name} onClose={close}>
        <AddStudentForm groupId={id} onRefresh={()=>setModal({type,id,extra})}/>
      </Modal>
    );
    if(type==='addAssign') return (
      <Modal title={"Add "+(extra==='homework'?'Homework':'Mock Exam')} onClose={close}>
        <AssignForm groupId={id} atype={extra} onDone={close}/>
      </Modal>
    );
    if(type==='editAssign') return (
      <Modal title={"Edit assignment"} onClose={close}>
        <AssignForm assignId={id} onDone={close}/>
      </Modal>
    );
    if(type==='submitWork') return (
      <Modal title={"Submit work"} onClose={close}>
        <SubmitForm assignId={id} userId={user.id} onDone={close}/>
      </Modal>
    );
    if(type==='viewSubs') return (
      <Modal title={"Submissions"} onClose={close}>
        <SubsView assignId={id} onRefresh={()=>setModal({type,id,extra})}/>
      </Modal>
    );
    if(type==='uploadCorrection') return (
      <Modal title={"Upload correction"} onClose={close}>
        <CorrectionForm assignId={id} onDone={close}/>
      </Modal>
    );
    if(type==='studentDetail') return (
      <Modal title={"Student progress"} onClose={close}>
        <StudentDetail studentId={id} groupId={extra}/>
      </Modal>
    );
    return null;
  };

  /* ── EBOOK VIEW ── */
  const ebookView = ()=>{
    const filteredTopics=ebookSearch.trim()?topics.filter(t=>t.name.toLowerCase().includes(ebookSearch.toLowerCase())||String(t.num)===ebookSearch.trim()):topics;
    if(!ebookTopic){
      const est=appSettings();
      return (
        <div className="p-main">
          <div className="p-topbar" style={{gap:8,flexWrap:'wrap'}}><div className="p-topbar-title">📖 eBook — All 58 Topics</div>
            {isT&&<div style={{display:'flex',gap:8}}>
              <button className="a-btn" onClick={()=>saveSetting({ebookLocked:!est.ebookLocked})} style={est.ebookLocked?{background:'#a11',color:'#fff',borderColor:'#a11'}:{}}>{est.ebookLocked?'🔒 Locked (4+)':'🔓 Unlocked for all'}</button>
              <button className="a-btn" onClick={()=>setView('access')}>🔑 Manage access</button>
            </div>}
          </div>
          <div className="p-page">
            {ebookLockMsg&&(
              <div style={{background:'#FFF3E0',border:'2px solid #d97706',borderRadius:12,padding:'14px 16px',marginBottom:14}}>
                <div style={{fontWeight:700,color:'#b45309'}}>🔒 This topic is locked</div>
                <div style={{fontSize:14,marginTop:4}}>Topics 4 onwards need a subscription. Please <b>contact the teacher in the Chat</b> to get access.</div>
                <button className="a-btn" onClick={()=>setEbookLockMsg(false)} style={{marginTop:8}}>OK</button>
              </div>
            )}
            <input placeholder="Search topics…" value={ebookSearch} onChange={e=>setEbookSearch(e.target.value)} style={{width:'100%',padding:'10px 14px',border:'2px solid var(--ink)',borderRadius:8,fontSize:14,marginBottom:16,fontFamily:'inherit',background:'white'}}/>
            <div className="topic-grid">
              {filteredTopics.map(t=>{
                const done=t.questions.filter(q=>progress[q.id]).length;
                const locked=itemLocked((t.num||99)-1,user,'ebook');
                return <div key={t.id} className="topic-chip" style={{opacity:locked?0.6:1}} onClick={()=>{ if(locked){setEbookLockMsg(true);return;} setEbookTopic(t.id);setEbookLevelFilter('All');setOpenQ(null);}}>
                  <span><span className="tnum">{t.num}.</span>{locked?'🔒 ':''}{t.name}</span>
                  <span className="qcount">{locked?'Locked':done+'/'+t.questions.length}</span>
                </div>;
              })}
            </div>
          </div>
        </div>
      );
    }
    const currentTopic=topics.find(t=>t.id===ebookTopic)||topics[0];
    const filteredQs=currentTopic.questions.filter(q=>ebookLevelFilter==='All'||(q.level||'Medium')===ebookLevelFilter);
    return (
      <div className="p-main">
        <div className="p-topbar">
          <button className="a-btn" onClick={()=>{setEbookTopic(null);setOpenQ(null);}}>← Back to topics</button>
          <div className="p-topbar-title" style={{flex:1}}>{currentTopic.num}. {currentTopic.name}</div>
        </div>
        <div className="p-page">
          <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
            {['All','Easy','Medium','Hard'].map(lv=><button key={lv} onClick={()=>setEbookLevelFilter(lv)} style={{padding:'6px 16px',borderRadius:8,fontSize:13,fontWeight:700,border:'2px solid var(--ink)',cursor:'pointer',boxShadow:'3px 3px 0 var(--ink)',transition:'transform .08s',background:ebookLevelFilter===lv?'var(--ink)':'white',color:ebookLevelFilter===lv?'var(--paper)':'var(--ink)'}}>{lv==='Easy'?'🟢 Easy':lv==='Medium'?'🟡 Medium':lv==='Hard'?'🔴 Hard':'All Levels'}</button>)}
          </div>
          <p className="page-sub">{filteredQs.length} question{filteredQs.length===1?'':'s'}{ebookLevelFilter!=='All'?' ('+ebookLevelFilter.toLowerCase()+')':''}</p>
          {filteredQs.length===0&&<div className="empty-state">{ebookLevelFilter==='All'?'No questions in this topic yet.':'No '+ebookLevelFilter.toLowerCase()+' questions.'}</div>}
          {filteredQs.map((q,i)=>{
            const level=q.level||'Medium';
            return <div key={q.id} className={"qcard "+(openQ===q.id?'open':'')}>
              <div className="qhead" onClick={()=>setOpenQ(openQ===q.id?null:q.id)}>
                <div className="qtext" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                  <span className="qnum">Q{i+1}</span>
                  {q.ref?<span className="qref">{q.ref}</span>:null}
                  <LevelBadge level={level}/>
                </div>
                <div className="qmeta">
                  {progress[q.id]&&<span className="tag-done">✓ Done</span>}
                  <span className="reveal-hint">{openQ===q.id?'Hide answer':'Show answer'}</span>
                  <span className="chev">▾</span>
                </div>
              </div>
              <div className="qbody"><MediaList images={q.questionImages} single={q.questionImage} text={q.text} alt="question"/></div>
              <div className="answer-panel">
                <div className="answer-inner">
                  <div className="label">Mark scheme / answer</div>
                  <MediaList images={q.answerImages} single={q.answerImage} text={q.answer} alt="answer"/>
                  <div className="mark-row">
                    <button className={progress[q.id]?'active':''} onClick={()=>toggleDone(q.id)}>{progress[q.id]?'✓ Marked done':'Mark as done'}</button>
                  </div>
                </div>
              </div>
            </div>;
          })}
        </div>
      </div>
    );
  };

  const postsView = ()=> <PostsView user={user}/>;
  const meetingsView = ()=> <MeetingsView user={user} onLive={setLiveMeeting}/>;
  const recordingsView = ()=> <RecordingsView user={user}/>;

  return (
    <div className="portal-layout" onClick={()=>dotsOpen&&setDotsOpen(null)}>
      {sidebar}
      {view==='home'?portalHome():view==='ebook'?ebookView():view==='lessons'?<LessonsView user={user} onManageAccess={()=>setView('access')}/>:view==='access'?<AccessView/>:view==='posts'?postsView():view==='recordings'?recordingsView():view==='parents'?<TeacherParentsView/>:view==='registrations'?<RegistrationsView/>:groupView()}
      {renderModal()}
      {manageStudentsOverlay}
      {assignStudentOverlay}
    </div>
  );
}

/* ═══════════ FULL REVIEW PAGE (teacher marks each student) ═══════════ */
function FullReviewPage({assignId,group,tick,refresh}) {
  const a=DB.assignments().find(x=>x.id===assignId);
  const allSubs=DB.submissions().filter(s=>s.assignmentId===assignId);
  const studs=DB.students().filter(s=>(group.students||[]).includes(s.id));
  const [viewingFile,setViewingFile]=useState(null);
  const corrRefs=useRef({});

  function saveMark(subId,val){
    const subs=DB.submissions(); const sub=subs.find(s=>s.id===subId);
    if(sub) sub.mark=isNaN(parseFloat(val))?null:parseFloat(val);
    DB.save.submissions(subs); refresh();
  }
  function uploadCorrection(subId,e){
    const file=e.target.files[0]; if(!file)return;
    const r=new FileReader(); r.onload=ev=>{
      const subs=DB.submissions(); const sub=subs.find(s=>s.id===subId);
      if(sub){sub.correctedFile=file.name;sub.correctedFileData=ev.target.result;}
      DB.save.submissions(subs); refresh();
    }; r.readAsDataURL(file);
  }

  if(!a) return <div className="empty-state">Assignment not found.</div>;

  /* file viewer */
  if(viewingFile) {
    const vsub=DB.submissions().find(x=>x.id===viewingFile.subId)||{};
    const vName=viewingFile.corr?vsub.correctedFile:vsub.fileName;
    const vData=viewingFile.corr?vsub.correctedFileData:vsub.fileData;
    return (
    <div>
      <button className="a-btn" onClick={()=>setViewingFile(null)} style={{marginBottom:12}}>← Back to students</button>
      <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>
        {(studs.find(s=>s.id===vsub.studentId)||{name:'Unknown'}).name}'s {viewingFile.corr?'correction':'submission'}
      </div>
      <div style={{fontSize:12,opacity:0.6,marginBottom:12}}>📎 {vName}{vsub.submittedAt?(' · '+fmtDate(vsub.submittedAt)):''}</div>
      {vData&&vData.startsWith('data:image')?
        <img src={vData} alt="file" style={{maxWidth:'100%',border:'2px solid var(--ink)',borderRadius:10}}/>:
        vData&&isPdfData(vData,vName)?
        <PdfView data={vData}/>:
        vData?<iframe src={vData} style={{width:'100%',height:'70vh',border:'2px solid var(--ink)',borderRadius:10}} title="file"/>:
        <div className="empty-state">⏳ Loading file… if it stays blank, this file was uploaded before the fix and needs to be re-uploaded (correction) or re-submitted by the student.</div>
      }
      {vData&&<div style={{marginTop:10}}><a href={vData} download={vName} className="a-btn" style={{textDecoration:'none'}}>⬇ Download</a></div>}
    </div>
  );
  }

  const submitted=allSubs.length, total=studs.length;
  const markedSubs=allSubs.filter(s=>s.mark!==null&&s.mark!==undefined);
  const avgMark=markedSubs.length?Math.round(markedSubs.reduce((sum,s)=>sum+s.mark,0)/markedSubs.length*10)/10:null;
  const avgPct=markedSubs.length&&a.totalMark?Math.round(markedSubs.reduce((sum,s)=>sum+(s.mark/a.totalMark*100),0)/markedSubs.length):null;

  return (
    <div>
      {/* assignment info */}
      <div style={{fontSize:13,opacity:0.7,marginBottom:12}}>
        Total marks: <strong>{a.totalMark}</strong>
        {a.dueDate&&<> · Due: <strong>{fmtDate(new Date(a.dueDate).getTime())}</strong></>}
        {a.description&&<> · {a.description}</>}
      </div>

      {/* top stats */}
      <div className="p-stat-row" style={{marginBottom:22}}>
        <div className="p-stat"><div className="n">{submitted}/{total}</div><div className="l">Submitted</div></div>
        <div className="p-stat"><div className="n">{avgMark!==null?avgMark:'—'}<span style={{fontSize:13,opacity:0.5}}>/{a.totalMark}</span></div><div className="l">Avg mark</div></div>
        <div className="p-stat"><div className="n">{avgPct!==null?avgPct+'%':'—'}</div><div className="l">Avg score</div></div>
        <div className="p-stat"><div className="n">{total-submitted}</div><div className="l">Pending</div></div>
      </div>

      {studs.length===0&&<div className="empty-state">No students in this group.</div>}

      {/* student list */}
      {studs.map(s=>{
        const sub=allSubs.find(x=>x.studentId===s.id);
        const late=sub&&isLate(a.dueDate,sub.submittedAt);
        const refKey=sub?sub.id:'no_'+s.id;
        if(sub&&!corrRefs.current[refKey]) corrRefs.current[refKey]=React.createRef();

        return (
          <div key={s.id} style={{background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:'16px 18px',marginBottom:12,boxShadow:'3px 3px 0 var(--ink)'}}>
            {/* row 1: name + status */}
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:sub?12:0}}>
              <div style={{width:40,height:40,borderRadius:'50%',background:sub?'var(--chalk-blue)':'#bbb',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,fontWeight:700,flexShrink:0}}>{initials(s.name)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:15}}>{s.name}</div>
                <div style={{fontSize:12,opacity:0.55}}>{s.email}</div>
              </div>
              <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',flexShrink:0}}>
                {sub?(
                  <>
                    {a.dueDate&&(late?<span className="tag-late">Late</span>:<span className="tag-ontime">On time</span>)}
                    {sub.mark!==null&&sub.mark!==undefined?<span className="pill pill-blue" style={{fontSize:13,padding:'3px 10px'}}>{sub.mark}/{a.totalMark}</span>:<span className="pill pill-amber">Not marked</span>}
                  </>
                ):(
                  <span className="pill pill-amber" style={{fontSize:12}}>⏳ Not submitted</span>
                )}
              </div>
            </div>

            {/* row 2+: actions — only if submitted */}
            {sub&&(
              <div style={{borderTop:'1.5px dashed #d0cec4',paddingTop:12,display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
                {/* view & download */}
                <button className="a-btn" onClick={()=>setViewingFile({subId:sub.id})} style={{background:'var(--chalk-blue)',color:'white',borderColor:'var(--chalk-blue)',fontSize:12}}>👁 View</button>
                {sub.fileData&&<a href={sub.fileData} download={sub.fileName||'submission'} className="a-btn" style={{textDecoration:'none',fontSize:12}}>⬇ Download</a>}
                {sub.correctedFile&&<button className="a-btn" onClick={()=>setViewingFile({subId:sub.id,corr:true})} style={{background:'#1F6B43',color:'white',borderColor:'#1F6B43',fontSize:12}}>👁 View correction</button>}

                {/* divider */}
                <div style={{width:1,height:24,background:'#d0cec4',margin:'0 2px'}}/>

                {/* mark */}
                <MarkInput subId={sub.id} initVal={sub.mark} onSave={saveMark}/>
                <span style={{fontSize:13,fontWeight:600,opacity:0.6}}>/ {a.totalMark}</span>

                {/* divider */}
                <div style={{width:1,height:24,background:'#d0cec4',margin:'0 2px'}}/>

                {/* correction upload */}
                <input ref={corrRefs.current[refKey]} type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" style={{display:'none'}} onChange={e=>uploadCorrection(sub.id,e)}/>
                <button className="a-btn" onClick={()=>corrRefs.current[refKey]?.current?.click()} style={{background:sub.correctedFile?'#1F6B43':'var(--coral)',color:'white',borderColor:sub.correctedFile?'#1F6B43':'var(--coral)',fontSize:12}}>
                  {sub.correctedFile?'✓ '+sub.correctedFile:'📤 Correction'}
                </button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ═══════════ ASSIGN VIEW ═══════════ */
function AssignView({type,groupId,user,onModal,tick,refresh,onReview}) {
  const isT=user.role==='teacher';
  const assigns=DB.assignments().filter(a=>a.groupId===groupId&&a.type===type);
  const subs=DB.submissions();
  const lbl=type==='homework'?'Homework':'Mock Exam';
  function delAssign(id){ if(!confirm('Delete this assignment and all submissions?'))return; DB.save.assignments(DB.assignments().filter(a=>a.id!==id)); DB.save.submissions(DB.submissions().filter(s=>s.assignmentId!==id)); refresh(); }
  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div style={{fontFamily:'Georgia,serif',fontWeight:700,fontSize:17,color:'var(--green-deep)'}}>{lbl}</div>
        {isT&&<button className="small-btn" onClick={()=>onModal({type:'addAssign',id:groupId,extra:type})}>＋ Add {lbl}</button>}
      </div>
      {assigns.length===0&&<div className="empty-state">No {lbl.toLowerCase()} yet.</div>}
      {assigns.map(a=>{
        const mySub=subs.find(s=>s.assignmentId===a.id&&s.studentId===user.id);
        const allSubs=isT?subs.filter(s=>s.assignmentId===a.id):[];
        const due=a.dueDate?new Date(a.dueDate):null;
        const overdue=due&&now()>due.getTime();
        return (
          <div key={a.id} className="a-card">
            <div className="a-card-top">
              <div style={{flex:1}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}>
                  <span style={{fontWeight:700,fontSize:15}}>{a.title}</span>
                  {overdue&&<span className="pill pill-red">Overdue</span>}
                </div>
                <div style={{fontSize:13,opacity:0.7,marginBottom:6}}>
                  Total marks: <strong>{a.totalMark}</strong>
                  {a.dueDate&&<> · Due: <strong>{fmtDate(new Date(a.dueDate).getTime())}</strong></>}
                </div>
                {a.fileName&&<CorrectionBox name={a.fileName} data={a.fileData} label="Worksheet"/>}
                {a.description&&<div style={{fontSize:13,opacity:0.75,marginTop:4}}>{a.description}</div>}
              </div>
              {isT&&(
                <div className="a-acts">
                  <button className="a-btn" onClick={()=>onModal({type:'editAssign',id:a.id})}>✏️ Edit</button>
                  <button className="a-btn danger" onClick={()=>delAssign(a.id)}>🗑</button>
                </div>
              )}
            </div>
            {isT&&(
              <>
                <div className="a-sep"/>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                  <span className="pill pill-gray">{allSubs.length} submission{allSubs.length!==1?'s':''}</span>
                  <button className="a-btn" onClick={()=>onReview&&onReview(a.id)} style={{background:'var(--chalk-blue)',color:'white',borderColor:'var(--chalk-blue)'}}>👁 Review &amp; Mark</button>
                </div>
              </>
            )}
            {!isT&&(
              <>
                <div className="a-sep"/>
                {a.correctedFile&&<CorrectionBox name={a.correctedFile} data={a.correctionData} label="Model answers"/>}
                {mySub?(
                  <div>
                    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                      <span className="pill pill-green">✓ Submitted</span>
                      {a.dueDate&&(isLate(a.dueDate,mySub.submittedAt)?<span className="tag-late">Late</span>:<span className="tag-ontime">On time</span>)}
                      {mySub.mark!==null&&mySub.mark!==undefined&&<span className="pill pill-blue">Mark: {mySub.mark}/{a.totalMark}</span>}
                    </div>
                    {mySub.fileName&&<CorrectionBox name={mySub.fileName} data={mySub.fileData} label="Your submitted file"/>}
                    {mySub.correctedFile&&<CorrectionBox name={mySub.correctedFile} data={mySub.correctedFileData} label="Your correction"/>}
                  </div>
                ):(
                  <button className="small-btn" onClick={()=>onModal({type:'submitWork',id:a.id})}>📤 Submit work</button>
                )}
              </>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ═══════════ TRACK VIEW ═══════════ */
function TrackView({groupId,user,onModal,tick}) {
  const isT=user.role==='teacher';
  const group=DB.groups().find(g=>g.id===groupId);
  const studs=DB.students().filter(s=>(group.students||[]).includes(s.id));
  const assigns=DB.assignments().filter(a=>a.groupId===groupId);
  const subs=DB.submissions();
  if(isT) return (
    <div>
      <div style={{fontFamily:'Georgia,serif',fontWeight:700,fontSize:17,color:'var(--green-deep)',marginBottom:16}}>Student progress</div>
      {studs.length===0&&<div className="empty-state">No students in this group yet.</div>}
      {studs.length>0&&(
        <table className="p-table">
          <thead><tr><th>Student</th><th>HW done</th><th>Mock done</th><th>Avg score</th><th></th></tr></thead>
          <tbody>
            {studs.map(s=>{
              const hw=assigns.filter(a=>a.type==='homework');
              const mk=assigns.filter(a=>a.type==='mock');
              const hwS=subs.filter(sub=>sub.studentId===s.id&&hw.find(a=>a.id===sub.assignmentId));
              const mkS=subs.filter(sub=>sub.studentId===s.id&&mk.find(a=>a.id===sub.assignmentId));
              const allS=subs.filter(sub=>sub.studentId===s.id&&assigns.find(a=>a.id===sub.assignmentId));
              const marked=allS.filter(sub=>sub.mark!==null&&sub.mark!==undefined);
              let avg='—'; if(marked.length){const pcts=marked.map(sub=>{const a=assigns.find(x=>x.id===sub.assignmentId);return a?sub.mark/a.totalMark*100:0;});avg=Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length)+'%';}
              return <tr key={s.id}>
                <td><strong>{s.name}</strong><br/><span style={{fontSize:12,opacity:0.6}}>{s.email}</span></td>
                <td>{hwS.length}/{hw.length}</td><td>{mkS.length}/{mk.length}</td><td>{avg}</td>
                <td><button className="a-btn" onClick={()=>onModal({type:'studentDetail',id:s.id,extra:groupId})}>📊 Details</button></td>
              </tr>;
            })}
          </tbody>
        </table>
      )}
    </div>
  );
  const mySubs=subs.filter(s=>s.studentId===user.id&&assigns.find(a=>a.id===s.assignmentId));
  const marked=mySubs.filter(s=>s.mark!==null&&s.mark!==undefined);
  const avg=marked.length?Math.round(marked.map(s=>{const a=assigns.find(x=>x.id===s.assignmentId);return a?s.mark/a.totalMark*100:0;}).reduce((a,b)=>a+b,0)/marked.length):null;
  return (
    <div>
      <div style={{fontFamily:'Georgia,serif',fontWeight:700,fontSize:17,color:'var(--green-deep)',marginBottom:16}}>My progress</div>
      <div className="p-stat-row" style={{marginBottom:20}}>
        <div className="p-stat"><div className="n">{mySubs.length}/{assigns.length}</div><div className="l">Submitted</div></div>
        <div className="p-stat"><div className="n">{marked.length}</div><div className="l">Marked</div></div>
        <div className="p-stat"><div className="n">{avg!==null?avg+'%':'—'}</div><div className="l">Avg score</div></div>
      </div>
      {assigns.length===0&&<div className="empty-state">No assignments yet.</div>}
      {assigns.length>0&&<table className="p-table">
        <thead><tr><th>Assignment</th><th>Type</th><th>Status</th><th>Mark</th></tr></thead>
        <tbody>{assigns.map(a=>{const sub=mySubs.find(s=>s.assignmentId===a.id); return <tr key={a.id}><td>{a.title}</td><td><span className="pill pill-gray">{a.type}</span></td><td>{sub?<span className="pill pill-green">Submitted</span>:<span className="pill pill-amber">Pending</span>}</td><td>{sub&&sub.mark!==null&&sub.mark!==undefined?`${sub.mark}/${a.totalMark}`:'—'}</td></tr>;})}
        </tbody>
      </table>}
    </div>
  );
}

/* ═══════════ CHAT VIEW ═══════════ */
function ChatView({groupId,user,chatTarget,setChatTarget,tick,refresh}) {
  const isT=user.role==='teacher';
  const group=DB.groups().find(g=>g.id===groupId);
  const studs=DB.students().filter(s=>(group.students||[]).includes(s.id));
  const allMsgs=DB.messages().filter(m=>m.groupId===groupId);
  const [msg,setMsg]=useState('');
  const ALL_TARGET='__all__';
  const target=chatTarget||ALL_TARGET;
  function send(){
    if(!msg.trim())return;
    const msgs=DB.messages();
    if(isT){
      if(target===ALL_TARGET){
        // Broadcast to all students
        msgs.push({id:uid(),groupId,from:'teacher',to:ALL_TARGET,text:msg.trim(),at:now(),broadcast:true});
      } else {
        msgs.push({id:uid(),groupId,from:'teacher',to:target,text:msg.trim(),at:now()});
      }
    } else {
      msgs.push({id:uid(),groupId,from:user.id,to:'teacher',text:msg.trim(),at:now()});
    }
    DB.save.messages(msgs);
    setMsg(''); refresh();
  }
  if(isT){
    let conv;
    if(target===ALL_TARGET){
      conv=allMsgs.filter(m=>m.broadcast);
    } else {
      conv=allMsgs.filter(m=>(m.from===target&&m.to==='teacher')||(m.from==='teacher'&&m.to===target)||m.broadcast);
    }
    return (
      <div className="chat-frame">
        <div className="chat-students">
          <div className="chat-hd">Recipients</div>
          <div style={{flex:1,overflowY:'auto'}}>
            <div onClick={()=>setChatTarget(ALL_TARGET)} style={{padding:'10px 12px',cursor:'pointer',display:'flex',alignItems:'center',gap:8,background:(target===ALL_TARGET)?'var(--paper)':'',borderBottom:'2px solid var(--ink)'}}>
              <div style={{width:28,height:28,borderRadius:'50%',background:'var(--coral)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>📢</div>
              <span style={{fontSize:13,fontWeight:700}}>All Students</span>
            </div>
            {studs.length===0&&<div style={{padding:14,fontSize:13,opacity:0.6}}>No students yet</div>}
            {studs.map(s=><div key={s.id} onClick={()=>setChatTarget(s.id)} style={{padding:'10px 12px',cursor:'pointer',display:'flex',alignItems:'center',gap:8,background:(target===s.id)?'var(--paper)':'',borderBottom:'1px solid #eee'}}>
              <div style={{width:28,height:28,borderRadius:'50%',background:'var(--chalk-blue)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>{initials(s.name)}</div>
              <span style={{fontSize:13,fontWeight:600}}>{s.name}</span>
            </div>)}
          </div>
        </div>
        <div className="chat-body">
          <div className="chat-hd">{target===ALL_TARGET?'📢 Broadcast to all students':'Chat with '+(studs.find(s=>s.id===target)||{name:'Student'}).name}</div>
          <div className="chat-list" id="chat-list-el">{conv.map(m=><div key={m.id} className={"msg "+(m.from==='teacher'?'mine':'')}><div className={"msg-bubble "+(m.from==='teacher'?'mine':'other')}>{m.broadcast&&<div style={{fontSize:10,opacity:0.6,marginBottom:2}}>📢 Broadcast</div>}{m.text}</div></div>)}</div>
          <div className="chat-ir"><input value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder={target===ALL_TARGET?'Broadcast to all students…':'Type a message…'}/><button className="chat-send" onClick={send}>Send</button></div>
        </div>
      </div>
    );
  }
  // Student view: two tabs - Teacher (private) and All (broadcasts)
  const [stuChatTab,setStuChatTab]=useState('teacher'); // 'teacher' | 'all'
  const teacherConv=allMsgs.filter(m=>(m.from===user.id&&m.to==='teacher')||(m.from==='teacher'&&m.to===user.id));
  const allConv=allMsgs.filter(m=>m.broadcast);
  const stuConv=stuChatTab==='teacher'?teacherConv:allConv;
  return (
    <div className="chat-frame">
      <div className="chat-students">
        <div className="chat-hd">Chat</div>
        <div style={{flex:1,overflowY:'auto'}}>
          <div onClick={()=>setStuChatTab('teacher')} style={{padding:'10px 12px',cursor:'pointer',display:'flex',alignItems:'center',gap:8,background:stuChatTab==='teacher'?'var(--paper)':'',borderBottom:'1px solid #eee'}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:'var(--green-deep)',color:'var(--gold)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,flexShrink:0}}>👩‍🏫</div>
            <div><div style={{fontSize:13,fontWeight:700}}>Teacher</div><div style={{fontSize:10,opacity:0.6}}>Private chat</div></div>
          </div>
          <div onClick={()=>setStuChatTab('all')} style={{padding:'10px 12px',cursor:'pointer',display:'flex',alignItems:'center',gap:8,background:stuChatTab==='all'?'var(--paper)':'',borderBottom:'1px solid #eee'}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:'var(--coral)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,flexShrink:0}}>📢</div>
            <div><div style={{fontSize:13,fontWeight:700}}>All</div><div style={{fontSize:10,opacity:0.6}}>Group announcements</div></div>
          </div>
        </div>
      </div>
      <div className="chat-body">
        <div className="chat-hd">{stuChatTab==='teacher'?'💬 Chat with Teacher':'📢 Group Announcements'}</div>
        <div className="chat-list">{stuConv.map(m=>{
          const isMine=m.from===user.id;

function AddStudentForm({groupId,onRefresh}) {
  const [searchQ,setSearchQ]=useState('');
  const [err,setErr]=useState('');
  const group=DB.groups().find(g=>g.id===groupId)||{students:[]};
  const enrolled=DB.students().filter(s=>(group.students||[]).includes(s.id));
  const allStudents=DB.students();
  const notEnrolled=allStudents.filter(s=>!(group.students||[]).includes(s.id));
  const filtered=searchQ.trim()?notEnrolled.filter(s=>s.name.toLowerCase().includes(searchQ.toLowerCase())||s.email.toLowerCase().includes(searchQ.toLowerCase())):notEnrolled;
  function addStudent(sid){
    setErr('');
    if((group.students||[]).includes(sid)){setErr('This student is already in the group.');return;}
    const groups=DB.groups(); const g=groups.find(x=>x.id===groupId);
    g.students.push(sid); DB.save.groups(groups);
    setSearchQ(''); onRefresh();
  }
  function remove(sid){ const groups=DB.groups(); const g=groups.find(x=>x.id===groupId); g.students=g.students.filter(s=>s!==sid); DB.save.groups(groups); onRefresh(); }
  return (
    <>
      <p style={{fontSize:13,opacity:0.7,marginBottom:14}}>Search for registered students by name or email to add them to this group.</p>
      <div className="mfield">
        <label>Search students</label>

        {err&&<div className="merr">{err}</div>}
      </div>
      {searchQ.trim()&&(
        <div style={{marginBottom:16,maxHeight:200,overflowY:'auto',border:'2px solid var(--ink)',borderRadius:10,background:'white'}}>
          {filtered.length===0&&<div style={{padding:14,fontSize:13,opacity:0.6,textAlign:'center'}}>No matching students found. They must register first.</div>}
          {filtered.map(s=><div key={s.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:'1px solid #eee',cursor:'pointer'}} onClick={()=>addStudent(s.id)}>
            <div style={{width:30,height:30,borderRadius:'50%',background:'var(--chalk-blue)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700}}>{initials(s.name)}</div>
            <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{s.name}</div><div style={{fontSize:12,opacity:0.6}}>{s.email}</div></div>
            <span style={{fontSize:12,fontWeight:700,color:'var(--coral)',background:'#FFF5F2',padding:'4px 10px',borderRadius:6,border:'1.5px solid var(--coral)'}}>＋ Add</span>
          </div>)}
        </div>
      )}
      {enrolled.length>0&&(
        <div style={{marginTop:16}}>
          <div style={{fontSize:12,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.5px',opacity:0.6,marginBottom:8}}>Students in this group ({enrolled.length})</div>
          {enrolled.map(s=><div key={s.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 0',borderBottom:'1px solid #eee'}}>
            <div style={{width:30,height:30,borderRadius:'50%',background:'var(--chalk-blue)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700}}>{initials(s.name)}</div>
            <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{s.name}</div><div style={{fontSize:12,opacity:0.6}}>{s.email}</div></div>
            <button className="a-btn danger" onClick={()=>remove(s.id)}>✕ Remove</button>
