/* ═══════════ PDF VIEWER (renders pages via PDF.js — works on phones) ═══════════ */
function PdfView({data}){
  const ref=useRef(null); const [err,setErr]=useState(''); const [busy,setBusy]=useState(true);
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      try{
        setBusy(true); setErr('');
        if(!data||!window.pdfjsLib){ setErr('PDF viewer not ready — use Download.'); setBusy(false); return; }
        const b64=(data.split(',')[1])||''; const bin=atob(b64);
        const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
        const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
        if(cancelled) return;
        const cont=ref.current; if(!cont) return; cont.innerHTML='';
        const width=cont.clientWidth||700;
        for(let p=1;p<=pdf.numPages;p++){
          const page=await pdf.getPage(p); if(cancelled) return;
          const base=page.getViewport({scale:1});
          const scale=Math.max(0.3,Math.min(2.5,(width-6)/base.width));
          const vp=page.getViewport({scale});
          const canvas=document.createElement('canvas');
          canvas.width=vp.width; canvas.height=vp.height;
          canvas.style.cssText='width:100%;height:auto;margin-bottom:8px;border:1px solid #ddd;border-radius:6px;';
          cont.appendChild(canvas);
          await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
          if(cancelled) return;
        }
        setBusy(false);
      }catch(e){ if(!cancelled){ setErr('Could not display this PDF here — tap Download to open it.'); setBusy(false); } }
    })();
    return ()=>{ cancelled=true; };
  },[data]);
  return (
    <div style={{marginTop:10}}>
      {busy&&<div style={{fontSize:12,opacity:0.6,marginBottom:6}}>⏳ Rendering PDF…</div>}
      <div ref={ref} style={{maxHeight:'75vh',overflowY:'auto',background:'#fff',border:'1px solid #ccc',borderRadius:8,padding:3}}/>
      {err&&<div style={{fontSize:12,color:'#a11',marginTop:6}}>{err}</div>}
    </div>
  );
}
function isPdfData(data,name){ return (data&&data.startsWith('data:application/pdf'))||(name&&/\.pdf$/i.test(name)); }

/* Shrink photos before upload. A 3–5 MB phone photo becomes ~200–400 KB with no
   visible difference on screen — the difference between filling the free Firebase
   plan in a month and staying inside it all year. PDFs/Word pass through untouched. */
const IMG_MAX_PX = 1600, IMG_QUALITY = 0.72, IMG_SKIP_UNDER = 300*1024;
function readUpload(file){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=ev=>{
      const data=ev.target.result;
      const isImg=/^image\//i.test(file.type||'') && !/svg/i.test(file.type||'');
      if(!isImg || file.size<=IMG_SKIP_UNDER) return resolve(data);
      const img=new Image();
      img.onload=()=>{
        try{
          let w=img.width, h=img.height;
          const scale=Math.min(1, IMG_MAX_PX/Math.max(w,h));
          w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img,0,0,w,h);
          const out=c.toDataURL('image/jpeg',IMG_QUALITY);
          resolve(out && out.length < data.length ? out : data);
        }catch(e){ resolve(data); }
      };
      img.onerror=()=>resolve(data);
      img.src=data;
    };
    r.onerror=()=>resolve(null);
    r.readAsDataURL(file);
  });
}

/* Load a script once, on demand. Used for the Word viewer so the library is only
   fetched when somebody actually opens a .docx. */
const _scriptOnce={};
function loadScript(src){
  if(_scriptOnce[src]) return _scriptOnce[src];
  _scriptOnce[src]=new Promise((res,rej)=>{
    const el=document.createElement('script'); el.src=src; el.async=true;
    el.onload=()=>res(true); el.onerror=()=>rej(new Error('script failed'));
    document.head.appendChild(el);
  });
  return _scriptOnce[src];
}

/* Build and download a workbook. sheets = [{name, rows:[[...]], widths:[n]}] */
async function downloadWorkbook(sheets,fileName){
  await loadScript(XLSX_URL);
  if(!window.XLSX) throw new Error('XLSX library did not load');
  const wb=window.XLSX.utils.book_new();
  sheets.forEach(sh=>{
    const ws=window.XLSX.utils.aoa_to_sheet(sh.rows);
    if(sh.widths) ws['!cols']=sh.widths.map(w=>({wch:w}));
    /* Filter arrows on the header row so she can sort/filter in Excel. */
    if(sh.filter){
      const hdr=sh.filter.row, last=sh.filter.lastRow, cols=sh.filter.cols;
      ws['!autofilter']={ref:window.XLSX.utils.encode_range(
        {r:hdr,c:0},{r:last,c:Math.max(0,cols-1)})};
    }
    window.XLSX.utils.book_append_sheet(wb,ws,safeSheetName(sh.name));
  });
  window.XLSX.writeFile(wb,fileName);

/* Rows for a block of assignments. Every row carries its month, so rows stay
   meaningful wherever they are copied to. */
function _stuRows(who,list,subs){
  const rows=[]; let got=0,poss=0,done=0,late=0;
  let hwGot=0,hwPoss=0,mkGot=0,mkPoss=0,hwN=0,mkN=0;
  list.forEach(a=>{
    const sub=subs.find(x=>x.assignmentId===a.id);
    const has=sub&&sub.mark!=null&&sub.mark!==undefined;
    const isMock=(a.type==='mock');
    if(isMock) mkN++; else hwN++;
    if(has){
      got+=sub.mark; poss+=(a.totalMark||0);
      if(isMock){ mkGot+=sub.mark; mkPoss+=(a.totalMark||0); }
      else      { hwGot+=sub.mark; hwPoss+=(a.totalMark||0); }
    }
    if(sub){ done++; if(isLate(a.dueDate,sub.submittedAt)) late++; }
    rows.push([
      who, monthLabel(monthKeyOf(a)), a.title||'', a.type||'', a.dueDate||'',
      sub?fmtDate(sub.submittedAt):'',
      sub?(isLate(a.dueDate,sub.submittedAt)?'Late':'On time'):'Not done',
      has?sub.mark:'', a.totalMark||'',
      has&&a.totalMark?Math.round(sub.mark/a.totalMark*100):''
    ]);
  });
  return {rows,got,poss,done,late,hwGot,hwPoss,mkGot,mkPoss,hwN,mkN};
}

    gHwG+=r.hwGot; gHwP+=r.hwPoss; gMkG+=r.mkGot; gMkP+=r.mkPoss; gHwN+=r.hwN; gMkN+=r.mkN;
    sum.push([mo.label,list.length,r.hwN,r.mkN,r.done,list.length-r.done,r.late,
              _mk(r.hwGot,r.hwPoss),_mk(r.hwPoss,r.hwPoss),_pct(r.hwGot,r.hwPoss),
              _mk(r.mkGot,r.mkPoss),_mk(r.mkPoss,r.mkPoss),_pct(r.mkGot,r.mkPoss),
              _mk(r.got,r.poss),_mk(r.poss,r.poss),_pct(r.got,r.poss)]);
  });
  sum.push([]);
  sum.push(['WHOLE YEAR',assigns.length,gHwN,gMkN,gDone,assigns.length-gDone,gLate,
            _mk(gHwG,gHwP),_mk(gHwP,gHwP),_pct(gHwG,gHwP),
            _mk(gMkG,gMkP),_mk(gMkP,gMkP),_pct(gMkG,gMkP),
            _mk(gGot,gPoss),_mk(gPoss,gPoss),_pct(gGot,gPoss)]);
  sheets.push({name:'Summary by month',rows:sum,
               widths:[18,12,10,7,10,9,6,15,8,12,12,8,9,12,8,9],
               filter:{row:HDR,lastRow:HDR+months.length,cols:16}});

  /* 2 — one sheet per month: every homework and mock with its grade, then
         homework, mock and month subtotals. */
  months.forEach(mo=>{
    const list=assigns.filter(a=>monthKeyOf(a)===mo.key)
      .slice().sort((x,y)=>(x.dueDate||'').localeCompare(y.dueDate||''));
    const r=_stuRows(who,list,subs);
    const rows=[[who+' — '+mo.label],[],STU_HEAD].concat(r.rows);
    const lastRow=rows.length-1;
    rows.push([]);
    if(r.hwN) rows.push(_totalRow(who,'HOMEWORK TOTAL',r.hwGot,r.hwPoss));
    if(r.mkN) rows.push(_totalRow(who,'MOCK TOTAL',r.mkGot,r.mkPoss));
    rows.push(_totalRow(who,'MONTH TOTAL',r.got,r.poss));
    sheets.push({name:monthShort(mo.key),rows,widths:STU_WIDTHS,filter:{row:2,lastRow,cols:10}});
  });

  /* 3 — everything in one list, month named on every row. */
  sheets.push(studentSheet(stu,assigns,subs,groupName,'All assignments'));
  return sheets;
}

function studentSheet(stu,assigns,subs,groupName,sheetName){
  const who=(stu&&stu.name)?stu.name:'Student';
  /* Her feedback: the name must be visible IN the sheet, not only on the tab. */
  const ordered=assigns.slice().sort((x,y)=>

/* One grid: students down the side, the given assignments across the top. */
function _classGrid(studs,list,allSubs){
  const head=['Student','Email'];
  list.forEach(a=>head.push((a.title||'')+' ('+(a.totalMark||0)+')'));
  head.push('Total','Out of','Score %','Submitted','Not done','Late');
  const rows=[head];
  studs.forEach(st=>{
    const mine=allSubs.filter(x=>x.studentId===st.id);
    const row=[st.name||'',st.email||''];
    let got=0,poss=0,done=0,late=0;
    list.forEach(a=>{
      const sub=mine.find(x=>x.assignmentId===a.id);
      const has=sub&&sub.mark!=null&&sub.mark!==undefined;
      if(sub){ done++; if(isLate(a.dueDate,sub.submittedAt)) late++; }
      if(has){ got+=sub.mark; poss+=(a.totalMark||0); }
      row.push(has?sub.mark:(sub?'—':''));
    });
    row.push(_mk(got,poss),_mk(poss,poss),_pct(got,poss),done,list.length-done,late);
    rows.push(row);
  });
  const widths=[22,26].concat(list.map(()=>13)).concat([8,8,9,11,10,7]);
  return {rows,widths,cols:head.length};
}
function _keyRows(studs,list){
  return [
    [],
    ['KEY:','a number = the mark awarded','—  = handed in, not marked yet','(blank) = not handed in'],
    ['Exported '+fmtDate(Date.now())+' · '+studs.length+' students · '+list.length+' assignments']
  ];
}

/* Whole class, organised like the student workbook: a month summary, one grid
   per month, the full year, then per-assignment stats. Months are independent —
   a month with 3 homework simply gets 3 columns, one with 5 gets 5. */
function classSheets(groupName,studs,assigns,allSubs){
  const months=buildMonths(assigns);
  const sheets=[];

  /* 1 — Summary: one row per month for the class as a whole. */
  const sum=[
    ['Class:',groupName||''],['Students:',studs.length],['Exported:',fmtDate(Date.now())],
    [],
    ['Month','Assignments','Homework','Mocks','Expected hand-ins','Submitted','Not done','Late','Marked','Class average %']
  ];
  const HDR=sum.length-1;
  months.forEach(mo=>{
    const list=assigns.filter(a=>monthKeyOf(a)===mo.key);
    const ids={}; list.forEach(a=>ids[a.id]=a);
    const subs=allSubs.filter(x=>ids[x.assignmentId]);
    const marked=subs.filter(x=>x.mark!=null&&x.mark!==undefined);
    let got=0,poss=0,late=0;
    subs.forEach(x=>{
      const a=ids[x.assignmentId];
      if(isLate(a.dueDate,x.submittedAt)) late++;
      if(x.mark!=null&&x.mark!==undefined){ got+=x.mark; poss+=(a.totalMark||0); }
    });
    const expected=list.length*studs.length;
    sum.push([mo.label,list.length,list.filter(a=>a.type!=='mock').length,list.filter(a=>a.type==='mock').length,
              expected,subs.length,expected-subs.length,late,marked.length,_pct(got,poss)]);
  });
  sheets.push({name:'Summary by month',rows:sum,widths:[18,12,11,7,17,11,10,7,8,16],
               filter:{row:HDR,lastRow:HDR+months.length,cols:10}});

  /* 2 — one grid per month, newest first. */
  months.forEach(mo=>{
    const list=assigns.filter(a=>monthKeyOf(a)===mo.key)
      .slice().sort((x,y)=>(x.dueDate||'').localeCompare(y.dueDate||''));
    const g=_classGrid(studs,list,allSubs);
    const title=(groupName||'Class')+' — '+mo.label+'  ('+list.length+' assignment'+(list.length===1?'':'s')+')';
    const rows=[[title],[]].concat(g.rows).concat(_keyRows(studs,list));
    sheets.push({name:monthShort(mo.key),rows,widths:g.widths,
                 filter:{row:2,lastRow:2+studs.length,cols:g.cols}});
  });

  /* 3 — the whole year in one grid. */
  const ordered=assigns.slice().sort((x,y)=>monthKeyOf(x).localeCompare(monthKeyOf(y))||(x.dueDate||'').localeCompare(y.dueDate||''));
  const all=_classGrid(studs,ordered,allSubs);
  sheets.push({name:'Whole year',rows:all.rows.concat(_keyRows(studs,ordered)),widths:all.widths,
               filter:{row:0,lastRow:studs.length,cols:all.cols}});

  /* 4 — per-assignment stats. */
  const info=[['Month','Assignment','Type','Due','Out of','Submitted','Not done','Marked','Class average %']];
  assigns.slice().sort((x,y)=>monthKeyOf(y).localeCompare(monthKeyOf(x))||(y.dueDate||'').localeCompare(x.dueDate||'')).forEach(a=>{
    const subs=allSubs.filter(x=>x.assignmentId===a.id);
    const marked=subs.filter(x=>x.mark!=null&&x.mark!==undefined);
    const avg=(marked.length&&a.totalMark)?Math.round(marked.reduce((t,x)=>t+x.mark,0)/marked.length/a.totalMark*100):'';
    info.push([monthLabel(monthKeyOf(a)),a.title||'',a.type||'',a.dueDate||'',a.totalMark||'',subs.length,studs.length-subs.length,marked.length,avg]);
  });
  sheets.push({name:'By assignment',rows:info,widths:[18,34,11,12,8,11,10,8,16],
               filter:{row:0,lastRow:assigns.length,cols:9}});
  return sheets;
}
function isDocxData(data,name){
  return !!((name&&/\.docx$/i.test(name))||(data&&data.startsWith('data:application/vnd.openxmlformats-officedocument.wordprocessingml.document')));
}
function isLegacyDoc(name){ return !!(name&&/\.doc$/i.test(name)); }

/* Word (.docx) rendered inline. Browsers cannot display Word natively, so the
   document is converted to HTML in the browser and shown as a page. */
function DocxView({data,name}){
  const [html,setHtml]=useState(null); const [err,setErr]=useState('');
  useEffect(()=>{
    let dead=false;
    (async()=>{
      try{
        await loadScript(MAMMOTH_URL);
        if(!window.mammoth) throw new Error('no mammoth');
        const c=data.indexOf(','); const bin=atob(data.slice(c+1));
        const buf=new ArrayBuffer(bin.length); const u=new Uint8Array(buf);
        for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
        const r=await window.mammoth.convertToHtml({arrayBuffer:buf});
        if(!dead) setHtml(r.value||'<p><em>This document has no text in it.</em></p>');
      }catch(e){ if(!dead) setErr('Could not open this Word file here — use Download and open it in Word.'); }
    })();
    return ()=>{ dead=true; };
  },[data]);
  if(err) return <div style={{marginTop:10,fontSize:13,color:'#a11'}}>{err}</div>;
  if(html==null) return <div style={{marginTop:10,fontSize:13,opacity:0.65}}>⏳ Opening Word document…</div>;
  return <div className="docx-view" dangerouslySetInnerHTML={{__html:html}}/>;
}

/* Chrome refuses to render a data: URL inside an iframe — that is why "View file"
   used to show a blank page or silently download instead. Convert to a blob: URL,
   which browsers DO allow, and route PDFs through PdfView (PDF.js) instead. */
function dataUrlToBlobUrl(d){
  try{
    const c=d.indexOf(','); if(c<0) return null;
    const mime=(d.slice(0,c).match(/data:([^;]+)/)||[null,'application/octet-stream'])[1];
    const bin=atob(d.slice(c+1));
    const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([u],{type:mime}));
  }catch(e){ return null; }
}

/* One shared viewer for every uploaded file: images inline, PDFs via PDF.js,
   anything else gets Download + Open-in-new-tab instead of a blank iframe. */
function FileView({data,name,fileId}){
  /* Files load only when someone actually opens one. */
  const [fetched,setFetched]=useState(null);
  useEffect(()=>{
    let dead=false;
    if(!data&&fileId){ (async()=>{ const b=await DB.fetchFile(fileId); if(!dead) setFetched(b||''); })(); }
    else setFetched(null);
    return ()=>{ dead=true; };
  },[data,fileId]);
  const real=data||fetched||'';
  const isImg=!!(real&&real.startsWith('data:image'));
  const isPdf=!!isPdfData(real,name);
  const [blobUrl,setBlobUrl]=useState(null);
  useEffect(()=>{
    if(!real||isImg||isPdf){ setBlobUrl(null); return; }
    const u=dataUrlToBlobUrl(real); setBlobUrl(u);
    return ()=>{ if(u) try{ URL.revokeObjectURL(u); }catch(e){} };
  },[real,isImg,isPdf]);
  const data_=real;
  if(!data_&&fileId) return <div className="empty-state">⏳ Opening file…</div>;
  if(!data_) return <div className="empty-state">⏳ Loading file… if it stays blank, this file was uploaded before the fix and needs to be re-uploaded (correction) or re-submitted by the student.</div>;
  /* a download is always offered, even while the picture or PDF is on screen */
  const dl=<div style={{marginTop:8}}><DownloadBtn data={data_} name={name||'file'} style={{fontSize:11,padding:'4px 10px'}}/></div>;
  if(isImg) return <div><img src={data_} alt={name||'file'} style={{maxWidth:'100%',border:'2px solid var(--ink)',borderRadius:10}}/>{dl}</div>;
  if(isPdf) return <div><PdfView data={data_}/>{dl}</div>;
  if(isDocxData(data_,name)) return <div><DocxView data={data_} name={name}/>{dl}</div>;
  const ext=((name||'').split('.').pop()||'').toUpperCase();
  return (
    <div style={{marginTop:10,padding:'14px 16px',background:'#FFF4E5',border:'2px solid #E8623D',borderRadius:10}}>
      <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>{ext?(ext+' files'):'This file type'} can’t be displayed inside the browser.</div>
      <div style={{fontSize:13,marginBottom:10,opacity:0.8}}>{isLegacyDoc(name)
        ? 'This is an old-style .doc file. Save it as .docx in Word and it will display here; for now, open it with one of these:'
        : 'The file itself is fine — open it with one of these:'}</div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        <a className="a-btn" href={data_} download={name||'file'} style={{textDecoration:'none'}}>⬇ Download</a>
        {blobUrl&&<a className="a-btn" href={blobUrl} target="_blank" rel="noreferrer" style={{textDecoration:'none'}}>↗ Open in a new tab</a>}
      </div>
    </div>
  );
}

/* Download that works whether or not the bytes are in memory yet. */
function DownloadBtn({data,fileId,name,className,style,label}){
  const [busy,setBusy]=useState(false);
  const cls=className||'a-btn';
  const st=Object.assign({textDecoration:'none'},style||{});
  if(data) return <a href={data} download={name||'file'} className={cls} style={st}>{label||'\u2b07 Download'}</a>;
  if(!fileId) return null;
  return <button className={cls} style={st} disabled={busy} onClick={async()=>{
    setBusy(true);
    const b=await DB.fetchFile(fileId);
    setBusy(false);
    if(!b){ alert('Could not load this file \u2014 check your connection and try again.'); return; }
    const u=dataUrlToBlobUrl(b);
    if(!u){ alert('Could not open this file.'); return; }
    const a=document.createElement('a'); a.href=u; a.download=name||'file';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>{ try{ URL.revokeObjectURL(u); }catch(e){} },4000);
  }}>{busy?'\u23f3 Loading\u2026':(label||'\u2b07 Download')}</button>;
}

function CorrectionBox({name,data,label,fileId}){
  const [show,setShow]=useState(false);
  const [slow,setSlow]=useState(false);

          <DownloadBtn data={data} fileId={fileId} name={name} style={{fontSize:11,padding:'4px 10px',background:'#1F6B43',color:'white',borderColor:'#1F6B43'}}/>
        </>):(slow

}

        <div className="brand">
          <div className="badge display">Zπ</div>
          <div><h1 className="display">Zahra's IGCSE Math Hub</h1><p>Pearson Edexcel IGCSE (9–1) Mathematics A · Higher Tier · 58 Topics</p></div>
        </div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          {portalUser.role==='teacher'&&(()=>{ const dv=appSettings().deactivated; return (
            <button className="a-btn" onClick={()=>{ if(confirm(dv?'Reactivate ALL student and parent accounts?':'Deactivate ALL student and parent accounts? They will be locked out until you reactivate.')) saveSetting({deactivated:!dv}); }} style={dv?{background:'var(--green-deep)',color:'#fff',borderColor:'var(--green-deep)'}:{background:'#a11',color:'#fff',borderColor:'#a11'}}>{dv?'✅ Activate all':'⛔ Deactivate all'}</button>
          ); })()}
          <button className="linklike" onClick={doLogout}>Sign out</button>
        </div>
      </div>
      {gate==='removed'
        ? <AccountNotice icon="🚫" title="Account removed" text="Your account has been removed by the teacher. If you think this is a mistake, please register again or contact the teacher." onLogout={doLogout}/>
        : gate==='deactivated'
        ? <AccountNotice icon="⛔" title="Account deactivated" text="Accounts are currently deactivated by the teacher. Please check back later — your account will work again once the teacher reactivates it." onLogout={doLogout}/>
        : gate==='waiting'
        ? <AccountNotice icon="⏳" title="Waiting for approval" text={"Hi "+portalUser.name+"! Your account has been created and is waiting for the teacher to approve it. Once approved, this page opens automatically — keep it open or check back soon."} onLogout={doLogout}/>
        : portalUser.role==='parent'
        ? <ParentPortal user={portalUser} onLogout={doLogout}/>
        : <PortalApp
        user={portalUser}
        onLogout={doLogout}
        topics={topics}
        progress={progress}
        toggleDone={toggleDone}
        addQuestion={addQuestion}
        deleteQuestion={deleteQuestion}
        saveCroppedQuestion={saveCroppedQuestion}
        doneCount={doneCount}
        totalCount={totalCount}
      />}
    </div>
  );
  }

  /* ── DEFAULT: LOGIN ── */
  return (
    <LoginPage
      onSuccess={user=>{ doLogin(user); }}
      onBack={()=>{}}
    />
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<App/>);
_syncBadge(); /* show version + sync status */

/* Gentle reminder shown only until the Firebase config is pasted in. */
if(!CLOUD_ON){
  var _b=document.createElement('div');
  _b.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#1F3A33;color:#fff;font:13px/1.4 Georgia,serif;padding:8px 14px;text-align:center;';
  _b.textContent='⚠ Local-only mode — registrations stay on this device. Paste your Firebase config near the top of index.html to enable cross-device sync.';
  document.body.appendChild(_b);
}

</script>
</body>
</html>
