<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Zahra's IGCSE Math Hub</title>
<!-- Installable app (PWA): adds an icon to the home screen and opens full-screen -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#16261F" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

</head>
<body style="margin:0;">
<div id="app-root"></div>
<script>
/* Register the service worker so the site can be installed as an app.
   It is network-first, so a new version always wins over the cached copy. */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
/* Android/Chrome fires this instead of installing straight away — keep it so
   the in-app "Install" button can use it later. */
window.__installPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); window.__installPrompt=e;
  try{ window.dispatchEvent(new Event('zh-installable')); }catch(err){}
});
</script>
<style>
  #app-root, #app-root * { box-sizing: border-box; }
  #app-root {
    --ink: #1F3A33;
    --paper: #F7F4EC;
    --paper-line: #d8dccb;
    --coral: #E8623D;
    --coral-dark: #C84F2F;
    --chalk-blue: #4C7A8C;
    --gold: #E0AC2B;
    --green-deep: #16261F;
    --level-easy: #22c55e;
    --level-medium: #f59e0b;
    --level-hard: #ef4444;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 28px 28px;
    min-height: 100vh;
    width: 100%;
    position: relative;
  }
  #app-root .display { font-family: 'Georgia', 'Spectral', serif; font-weight: 700; }
  #app-root .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }

  /* ===== Top bar ===== */
  .topbar {
    background: var(--green-deep);
    color: var(--paper);
    padding: 18px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 4px solid var(--coral);
  }
  .topbar .brand { display: flex; align-items: center; gap: 12px; }
  .topbar .brand .badge {
    width: 40px; height: 40px;
    background: var(--coral); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Georgia', serif; font-weight: 700; font-size: 18px;
    color: var(--green-deep); transform: rotate(-4deg);
  }
  .topbar .brand h1 { font-size: 19px; margin: 0; letter-spacing: 0.3px; }
  .topbar .brand p { margin: 0; font-size: 12px; opacity: 0.7; }
  .topbar .who { font-size: 13px; opacity: 0.85; display: flex; align-items: center; gap: 10px; }
  .topbar button.linklike { background: none; border: none; color: var(--coral); cursor: pointer; font-size: 13px; text-decoration: underline; padding: 0; }

  /* ===== Home page ===== */
  .home-wrap { max-width: 960px; margin: 0 auto; padding: 40px 32px; }
  .home-hero {
    background: var(--green-deep); color: var(--paper);
    border-radius: 16px; padding: 36px 40px; margin-bottom: 32px;
    border: 3px solid var(--ink);
    position: relative; overflow: hidden;
  }
  .home-hero::before {
    content: "π∑∫";
    position: absolute; right: 30px; top: 20px;
    font-size: 80px; opacity: 0.07; font-family: 'Georgia', serif;
    letter-spacing: 10px;
  }
  .home-hero h1 { font-size: 28px; margin: 0 0 8px; font-family: 'Georgia', serif; color: var(--gold); }
  .home-hero .sub { font-size: 15px; opacity: 0.85; margin-bottom: 20px; line-height: 1.6; }
  .home-hero .author-card {
    background: rgba(255,255,255,0.08); border-radius: 10px; padding: 16px 20px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .home-hero .author-name { font-size: 18px; font-weight: 700; color: var(--gold); }
  .home-hero .author-title { font-size: 13px; opacity: 0.8; font-style: italic; }
  .home-hero .author-contact { font-size: 13px; opacity: 0.9; display: flex; flex-wrap: wrap; gap: 16px; margin-top: 6px; }
  .home-hero .author-contact a { color: var(--gold); text-decoration: none; border-bottom: 1px solid rgba(224,172,43,0.4); }

  .home-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px; margin-bottom: 28px;
  }
  .home-stat-card {
    background: white; border: 2px solid var(--ink); border-radius: 12px;
    padding: 18px 20px; text-align: center;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .home-stat-card .big { font-size: 32px; font-weight: 800; font-family: 'Georgia', serif; color: var(--coral-dark); }
  .home-stat-card .lbl { font-size: 11px; text-transform: uppercase; opacity: 0.6; font-weight: 700; margin-top: 4px; }

  .home-section { margin-bottom: 32px; }
  .home-section h2 { font-size: 18px; font-family: 'Georgia', serif; margin: 0 0 14px; color: var(--green-deep); border-bottom: 2px solid var(--coral); padding-bottom: 6px; }

  .color-key { display: flex; flex-wrap: wrap; gap: 10px; }
  .color-key-item {
    display: flex; align-items: center; gap: 8px;
    background: white; border: 2px solid var(--ink); border-radius: 8px; padding: 8px 14px;
    font-size: 13px; font-weight: 600;
  }
  .color-dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; }

  .lvl-easy { background: #dcfce7; color: #166534; border: 1.5px solid #22c55e; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  .lvl-medium { background: #fef3c7; color: #92400e; border: 1.5px solid #f59e0b; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  .lvl-hard { background: #fee2e2; color: #991b1b; border: 1.5px solid #ef4444; font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }

  .syllabus-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .syllabus-area { background: white; border: 2px solid var(--ink); border-radius: 10px; padding: 14px 16px; }
  .syllabus-area h4 { margin: 0 0 8px; font-size: 13px; color: var(--green-deep); font-weight: 700; }
  .syllabus-area ul { margin: 0; padding-left: 16px; font-size: 12px; line-height: 1.7; opacity: 0.8; }

  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .topic-chip {
    background: white; border: 2px solid var(--ink); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    transition: background 0.12s;
  }
  .topic-chip:hover { background: var(--ink); color: var(--paper); }
  .topic-chip .tnum { opacity: 0.5; font-size: 11px; margin-right: 6px; }
  .topic-chip .qcount { font-size: 10px; opacity: 0.6; background: rgba(0,0,0,0.07); padding: 1px 6px; border-radius: 5px; }

  .enter-btn {
    background: var(--coral); color: white; border: 3px solid var(--ink);
    border-radius: 10px; padding: 14px 28px; font-weight: 700; font-size: 16px;
    cursor: pointer; box-shadow: 5px 5px 0 var(--ink);
    transition: transform 0.08s, box-shadow 0.08s;
    display: block; margin: 0 auto; text-align: center;
  }
  .enter-btn:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--ink); }

  /* ===== Layout ===== */
  .layout { display: flex; min-height: calc(100vh - 78px); }
  .sidebar {
    width: 260px; flex-shrink: 0;
    background: rgba(255,255,255,0.5); border-right: 2px solid var(--ink);
    padding: 20px 16px;
  }
  .sidebar h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.55; margin: 18px 0 8px; font-weight: 700; }
  .sidebar h3:first-child { margin-top: 0; }
  .nav-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
    font-size: 14px; margin-bottom: 3px; font-weight: 600;
  }
  .nav-item:hover { background: rgba(0,0,0,0.05); }
  .nav-item.active { background: var(--ink); color: var(--paper); }
  .nav-item .count { font-size: 11px; opacity: 0.6; font-weight: 400; }
  .nav-item.active .count { opacity: 0.8; }

  .main { flex: 1; padding: 28px 32px; max-width: 880px; }
  .page-title { font-size: 26px; margin: 0 0 4px; }
  .page-sub { font-size: 14px; opacity: 0.65; margin: 0 0 24px; }

  /* ===== Question cards ===== */
  .qcard {
    background: white; border: 2px solid var(--ink);
    border-radius: 10px; margin-bottom: 14px; overflow: hidden;
  }
  .qcard .qhead {
    padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    cursor: pointer; gap: 12px;
  }
  .qcard .qhead:hover { background: #faf8f2; }
  .qnum { background: var(--chalk-blue); color: white; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-right: 8px; white-space: nowrap; }
  .qtext { font-size: 15px; line-height: 1.5; }
  .qmeta { display: flex; gap: 6px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
  .tag-done { background: #DCEFE3; color: #1F6B43; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .chev { font-size: 18px; opacity: 0.4; transition: transform 0.15s; }
  .qcard.open .chev { transform: rotate(180deg); }
  .answer-panel { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: #FBF6E9; border-top: 2px dashed var(--ink); }
  .qcard.open .answer-panel { max-height: 9000px; }
  .answer-inner { padding: 16px; font-size: 14px; line-height: 1.6; }

  .qref { display: inline-block; background: #EFE7D2; color: var(--green-deep); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.2px; white-space: nowrap; }
  .qbody { padding: 0 16px 14px 16px; }
  .qbody .qimg + .qimg { margin-top: 4px; }
  .answer-inner .qimg + .qimg { margin-top: 4px; }
  .reveal-hint { font-size: 12px; font-weight: 700; color: var(--chalk-blue); display: flex; align-items: center; gap: 5px; }
  .answer-inner .label { font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--coral-dark); margin-bottom: 6px; letter-spacing: 0.5px; }
  .mark-row { margin-top: 12px; display: flex; gap: 8px; }
  .mark-row button { border: 2px solid var(--ink); background: white; border-radius: 7px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .mark-row button.active { background: #1F6B43; color: white; border-color: #1F6B43; }

  .difficulty-box {
    background: white; border: 1.5px solid var(--ink); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
    font-size: 13px;
  }
  .difficulty-box .dlabel { font-weight: 700; opacity: 0.6; font-size: 11px; text-transform: uppercase; }

  .add-box { background: white; border: 2px dashed var(--ink); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .add-box textarea, .add-box input, .add-box select { width: 100%; border: 2px solid var(--ink); border-radius: 7px; padding: 9px 10px; font-family: inherit; font-size: 13px; margin-bottom: 10px; }
  .add-box textarea { min-height: 60px; resize: vertical; }
  .add-box .grid2 { display: flex; gap: 10px; }
  .add-box .grid2 > * { flex: 1; }
  .small-btn { background: var(--ink); color: var(--paper); border: none; border-radius: 7px; padding: 9px 16px; font-weight: 700; font-size: 13px; cursor: pointer; }

  .stat-row { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-card { background: white; border: 2px solid var(--ink); border-radius: 10px; padding: 14px 18px; min-width: 130px; flex: 1; }
  .stat-card .num { font-size: 26px; font-weight: 800; font-family: 'Georgia', serif; }
  .stat-card .lab { font-size: 11px; text-transform: uppercase; opacity: 0.6; font-weight: 700; }

  .mock-row { background: white; border: 2px solid var(--ink); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .mock-row .info { font-size: 14px; }
  .mock-row .score { font-family: 'Georgia', serif; font-weight: 800; font-size: 20px; color: var(--coral-dark); }
  .mock-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .mock-form input, .mock-form select { border: 2px solid var(--ink); border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: inherit; }

  .contact-card { background: var(--green-deep); color: var(--paper); border-radius: 12px; padding: 20px 24px; margin-top: 30px; }
  .contact-card h4 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--gold); }
  .contact-card a { color: var(--paper); text-decoration: none; border-bottom: 1px solid var(--coral); }
  .contact-line { font-size: 14px; margin-bottom: 4px; }

  .empty-state { text-align: center; padding: 50px 20px; opacity: 0.6; font-size: 14px; }

  .cropper-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: white; border: 2px solid var(--ink); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
  .cropper-toolbar input[type="file"] { font-size: 13px; }
  .cropper-toolbar button { border: 2px solid var(--ink); background: white; border-radius: 7px; padding: 7px 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .cropper-toolbar button.primary { background: var(--ink); color: var(--paper); }
  .cropper-toolbar span.pageinfo { font-size: 13px; font-weight: 700; }
  .cropper-canvas-wrap { position: relative; border: 2px solid var(--ink); border-radius: 10px; overflow: auto; max-height: 70vh; background: #ddd; margin-bottom: 14px; }
  .cropper-canvas-wrap canvas.pdfcanvas { display: block; }
  .crop-rect { position: absolute; border: 2px dashed var(--coral); background: rgba(232,98,61,0.15); pointer-events: none; }
  .capture-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .capture-box { flex: 1; min-width: 220px; background: white; border: 2px solid var(--ink); border-radius: 10px; padding: 12px; }
  .capture-box h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
  .capture-box img { max-width: 100%; border: 1px solid #ccc; border-radius: 6px; }
  .capture-box .placeholder { font-size: 12px; opacity: 0.5; padding: 20px 0; text-align: center; }
  .save-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .save-row select { border: 2px solid var(--ink); border-radius: 7px; padding: 8px 10px; font-family: inherit; font-size: 13px; }
  .qimg { max-width: 100%; border-radius: 6px; border: 1px solid #ddd; margin-top: 6px; }

  /* ===== LOGIN PAGE ===== */
  .login-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 2rem; flex-direction: column; gap: 1rem;
  }
  /* Sign-in screen: information panel on the left, sign-in card on the right */
  .login-split {
    display: flex; width: 100%; max-width: 980px; align-items: stretch;
    border: 3px solid var(--ink); border-radius: 16px; overflow: hidden;
    box-shadow: 8px 8px 0 var(--ink); background: white;
  }
  .login-info {
    flex: 1 1 46%; background: var(--green-deep); color: #fff;
    padding: 2.4rem 2.2rem; display: flex; flex-direction: column; gap: 1.1rem;
    background-image: radial-gradient(circle at 88% 8%, rgba(224,172,43,0.20), transparent 42%),
                      radial-gradient(circle at 6% 96%, rgba(232,98,61,0.22), transparent 46%);
  }
  .login-info h2 { font-family: Georgia, serif; font-size: 25px; line-height: 1.2; margin: 0; }
  .login-exam {
    display: inline-block; align-self: flex-start; background: var(--gold); color: var(--green-deep);
    font-weight: 800; font-size: 11px; letter-spacing: .6px; text-transform: uppercase;
    padding: 5px 11px; border-radius: 999px;
  }
  .login-teacher {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.20);
    border-radius: 12px; padding: 11px 13px;
  }
  .login-points { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 9px; }
  .login-points li { display: flex; gap: 9px; font-size: 13.5px; line-height: 1.45; opacity: .95; }
  .login-points b { color: var(--gold); }
  .login-right { flex: 1 1 54%; display: flex; align-items: center; justify-content: center; padding: 2rem 1.6rem; background: var(--paper); }
  .login-right .login-card { border: none; box-shadow: none; padding: 0; max-width: 400px; background: transparent; }
  @media (max-width: 860px) {
    .login-split { flex-direction: column; box-shadow: 5px 5px 0 var(--ink); }
    .login-info { padding: 1.6rem 1.4rem; gap: .85rem; }
    .login-info h2 { font-size: 21px; }
    .login-points { display: none; }             /* keep phones short */
    .login-right { padding: 1.4rem 1.1rem; }
  }
  .login-back {
    align-self: flex-start; display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--chalk-blue); cursor: pointer; font-weight: 700;
    background: none; border: none; padding: 0;
  }
  .login-back:hover { color: var(--ink); }
  .login-card {
    background: white; border: 3px solid var(--ink); border-radius: 14px;
    padding: 2.5rem; width: 100%; max-width: 470px;
    box-shadow: 6px 6px 0 var(--ink);
  }
  .login-logo { font-size: 22px; font-weight: 700; font-family: 'Georgia', serif; color: var(--green-deep); margin-bottom: 4px; }
  .login-tagline { font-size: 13px; color: var(--chalk-blue); margin-bottom: 1.75rem; }
  .login-tabs {
    display: flex; gap: 4px; background: var(--paper); border: 2px solid var(--ink);
    border-radius: 9px; padding: 3px; margin-bottom: 1.75rem;
  }
  .login-tab {
    flex: 1; text-align: center; padding: 9px 4px; border-radius: 6px;
    font-size: 12.5px; cursor: pointer; font-weight: 700; color: var(--ink); opacity: 0.5; transition: .12s; white-space: nowrap;
  }
  .login-tab.active { background: var(--ink); color: var(--paper); opacity: 1; }
  .lfield { margin-bottom: 14px; }
  .lfield label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--chalk-blue); margin-bottom: 5px; }
  .lfield input { width: 100%; padding: 9px 12px; border: 2px solid var(--ink); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--paper); color: var(--ink); outline: none; }
  .lfield input:focus { border-color: var(--coral); box-shadow: 3px 3px 0 var(--coral); }
  .login-btn {
    width: 100%; padding: 11px; background: var(--coral); color: white;
    border: 3px solid var(--ink); border-radius: 9px; font-weight: 700; font-size: 15px;
    cursor: pointer; box-shadow: 4px 4px 0 var(--ink); margin-top: 4px;
    transition: transform .08s, box-shadow .08s;
  }
  .login-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .login-switch { text-align: center; margin-top: 1rem; font-size: 13px; }
  .login-switch span { color: var(--coral); cursor: pointer; font-weight: 700; border-bottom: 1px solid var(--coral); }
  .lerr { color: var(--coral-dark); font-size: 13px; font-weight: 600; margin-top: 8px; background: #FEE2E2; border: 1.5px solid #EF4444; border-radius: 6px; padding: 7px 10px; }

  /* ===== PORTAL LAYOUT ===== */
  .portal-layout { display: flex; height: calc(100vh - 78px); overflow: hidden; }

  /* Portal sidebar */
  .p-sidebar {
    width: 260px; flex-shrink: 0;
    background: rgba(255,255,255,0.6); border-right: 2px solid var(--ink);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .p-sidebar-top { padding: 14px 16px; border-bottom: 2px solid var(--ink); }
  .p-sidebar-logo { font-size: 13px; font-weight: 700; font-family: 'Georgia', serif; color: var(--green-deep); }

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
try{ if(window.pdfjsLib&&pdfjsLib.GlobalWorkerOptions) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}

/* ═══════════ HELPERS ═══════════ */
function uid() { return Math.random().toString(36).slice(2,10); }
function now() { return Date.now(); }
function fmtDate(ts) { return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function initials(n) { return (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function isLate(due,subAt) { if(!due||!subAt) return false; const end=new Date(due+'T23:59:59').getTime(); return !isNaN(end) ? subAt>end : subAt>new Date(due).getTime(); }
/* ═══════════ PHONE NOTIFICATIONS ═══════════
   Free. The sending key lives on the Cloudflare server, never in this file.
   The teacher's send-token is typed once and kept in HER browser only — it is
   deliberately NOT synced, so nobody else's device ever sees it. */
const PUSH_TOKEN_KEY='zh_push_token';
function teacherPushToken(){ try{ return localStorage.getItem(PUSH_TOKEN_KEY)||''; }catch(e){ return ''; } }
function setTeacherPushToken(v){ try{ v?localStorage.setItem(PUSH_TOKEN_KEY,v):localStorage.removeItem(PUSH_TOKEN_KEY); }catch(e){} }

function pushSupported(){
  try{ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }catch(e){ return false; }
}
async function subscribeToPush(user){
  if(!pushSupported()) return {ok:false,why:'unsupported'};
  if(isIOS()&&!isStandalone()) return {ok:false,why:'ios-needs-install'};
  const perm=await Notification.requestPermission();
  if(perm!=='granted') return {ok:false,why:'denied'};
  const reg=await navigator.serviceWorker.ready;
  const r=await fetch('/api/vapid-public').then(x=>x.json()).catch(()=>null);
  if(!r||!r.key) return {ok:false,why:'server'};
  const raw=atob(r.key.replace(/-/g,'+').replace(/_/g,'/'));
  const key=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) key[i]=raw.charCodeAt(i);
  const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
  const j=sub.toJSON();
  const res=await fetch('/api/subscribe',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({endpoint:j.endpoint,keys:j.keys,role:user.role,userId:user.id})});
  return res.ok?{ok:true}:{ok:false,why:'server'};
}
/* Send a notification. Silently does nothing if the teacher has not set her token. */
async function pushNotify(title,body,opts){
  const token=teacherPushToken(); if(!token) return;
  try{
    await fetch('/api/notify',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify(Object.assign({token,title,body},opts||{}))});
  }catch(e){}
}

/* Students and parents: one button to turn phone notifications on. */
function NotifyButton({user}){
  const [state,setState]=useState('idle');
  const [msg,setMsg]=useState('');
  if(!pushSupported()) return null;
  if(typeof Notification!=='undefined'&&Notification.permission==='granted'&&state==='idle') return null;
  return (
    <div style={{padding:'0 10px',marginBottom:6}}>
      <button className="p-foot-btn" style={{width:'100%'}} onClick={async()=>{
        setState('working'); setMsg('');
        const r=await subscribeToPush(user);
        if(r.ok){ setState('done'); setMsg('✓ Notifications are on'); }
        else{
          setState('idle');
          setMsg(r.why==='ios-needs-install'?'On iPhone, first add the app to your Home Screen, then try again.'
            :r.why==='denied'?'You said no to notifications. Allow them in your browser settings to turn them on.'
            :r.why==='unsupported'?'This browser cannot show notifications.'
            :'Could not turn them on. Try again later.');
        }
      }}>{state==='working'?'…':state==='done'?'🔔 Notifications on':'🔔 Turn on notifications'}</button>
      {msg&&<div style={{fontSize:11,marginTop:4,opacity:.85}}>{msg}</div>}
    </div>
  );
}

/* Teacher: paste the send-token once, and test it. */
function PushSetup(){
  const [tok,setTok]=useState(teacherPushToken());
  const [msg,setMsg]=useState('');
  return (
    <div style={{background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:'14px 16px',boxShadow:'3px 3px 0 var(--ink)',marginBottom:16}}>
      <div style={{fontWeight:700,fontFamily:'Georgia,serif',color:'var(--green-deep)',marginBottom:4}}>🔔 Phone notifications</div>
      <div style={{fontSize:12.5,opacity:.8,marginBottom:8}}>
        Paste the send-token you set in Cloudflare. It is saved only on this device and never shared.
      </div>
      <input type="password" value={tok} onChange={e=>setTok(e.target.value)} placeholder="send-token"
        style={{width:'100%',padding:'7px 10px',border:'2px solid var(--ink)',borderRadius:7,fontSize:13,fontFamily:'inherit'}}/>
      <div style={{display:'flex',gap:6,marginTop:8,flexWrap:'wrap'}}>
        <button className="a-btn" onClick={()=>{ setTeacherPushToken(tok.trim()); setMsg(tok.trim()?'Saved on this device.':'Cleared.'); }}>Save</button>
        <button className="a-btn" onClick={async()=>{
          if(!teacherPushToken()){ setMsg('Save the token first.'); return; }
          setMsg('Sending…');
          try{
            const r=await fetch('/api/notify',{method:'POST',headers:{'content-type':'application/json'},
              body:JSON.stringify({token:teacherPushToken(),title:'Test from the Maths Hub',body:'If you can read this, notifications are working.'})});
            const j=await r.json();
            setMsg(r.ok?('Sent to '+j.sent+' device'+(j.sent===1?'':'s')+(j.removed?(', '+j.removed+' old ones removed'):'')+'.')
                       :('Server said: '+(j.error||r.status)));
          }catch(e){ setMsg('Could not reach the server. Is the Worker deployed?'); }
        }}>Send a test</button>
      </div>
      {msg&&<div style={{fontSize:12,fontWeight:700,marginTop:8}}>{msg}</div>}
    </div>
  );
}

/* ═══════════ INSTALL AS AN APP ═══════════
   Android shows a real install prompt; iPhone has no prompt, so we explain the
   Share → Add to Home Screen steps instead. Hidden once it is already installed. */
function isStandalone(){
  try{ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }catch(e){ return false; }
}
function isIOS(){ try{ return /iphone|ipad|ipod/i.test(navigator.userAgent); }catch(e){ return false; } }
function InstallApp({compact}){
  const [prompt,setPrompt]=useState(()=>window.__installPrompt||null);
  const [showIos,setShowIos]=useState(false);
  const [done,setDone]=useState(false);
  useEffect(()=>{
    const fn=()=>setPrompt(window.__installPrompt||null);
    window.addEventListener('zh-installable',fn);
    return ()=>window.removeEventListener('zh-installable',fn);
  },[]);
  if(done||isStandalone()) return null;
  const ios=isIOS();
  if(!prompt&&!ios) return null;              /* desktop browsers: nothing to show */
  return (
    <div style={{marginTop:compact?8:12,padding:'10px 13px',background:'#DCEFE3',border:'2px solid #22c55e',borderRadius:10}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>📱 Add the Maths Hub to your phone</div>
      {ios?(
        showIos?(
          <div style={{fontSize:12.5,lineHeight:1.6}}>
            1. Tap the <strong>Share</strong> button at the bottom of Safari (the square with an arrow)<br/>
            2. Scroll down and tap <strong>Add to Home Screen</strong><br/>
            3. Tap <strong>Add</strong><br/>
            <span style={{opacity:.75}}>The icon appears with your other apps.</span>
          </div>
        ):(
          <button className="a-btn" style={{fontSize:12}} onClick={()=>setShowIos(true)}>Show me how</button>
        )
      ):(
        <>
          <div style={{fontSize:12.5,opacity:.85,marginBottom:8}}>It opens like a normal app, with no address bar.</div>
          <button className="a-btn" style={{fontSize:12,background:'var(--green-deep)',color:'#fff',borderColor:'var(--green-deep)'}}
            onClick={async()=>{
              try{ prompt.prompt(); const r=await prompt.userChoice; if(r&&r.outcome==='accepted') setDone(true); window.__installPrompt=null; }
              catch(e){}
            }}>⬇ Install app</button>
        </>
      )}
    </div>
  );
}

/* ═══════════ PASSWORDS ═══════════
   There is no mail service, so "forgot password" files a request the teacher
   sees; she sets a new one and tells the person (WhatsApp is right there). */
/* Self-service reset: email + the phone number they registered with must both
   match, then they set a new password themselves. No teacher, no waiting. */
function findAccountByEmail(email){
  const e=String(email||'').trim().toLowerCase();
  if(!e) return null;
  const stu=DB.students().find(x=>(x.email||'').toLowerCase()===e);
  if(stu) return {kind:'student',rec:stu};
  const par=DB.parents().find(x=>(x.email||'').toLowerCase()===e);
  if(par) return {kind:'parent',rec:par};
  return null;
}
function resetWithPhone(email,phone,newPass){
  const found=findAccountByEmail(email);
  if(!found) return 'nouser';
  const have=normPhone(found.rec.phone||found.rec.phoneRaw||'');
  if(!have) return 'nophone';
  if(normPhone(phone)!==have) return 'nomatch';
  if(String(newPass||'').length<6) return 'short';
  if(found.kind==='student'){ const all=DB.students(); const r=all.find(x=>x.id===found.rec.id); r.pass=newPass; DB.save.students(all); }
  else { const all=DB.parents(); const r=all.find(x=>x.id===found.rec.id); r.pass=newPass; DB.save.parents(all); }
  clearPwRequest(found.rec.email);
  return 'ok';
}
function pwRequests(){ return (appSettings().pwRequests)||[]; }
function addPwRequest(email){
  const e=String(email||'').trim().toLowerCase();
  if(!e) return false;
  const stu=DB.students().find(x=>(x.email||'').toLowerCase()===e);
  const par=DB.parents().find(x=>(x.email||'').toLowerCase()===e);
  const who=stu||par;

  const list=pwRequests().filter(r=>r.email!==e);

  return true;
}
function clearPwRequest(email){
  saveSetting({pwRequests:pwRequests().filter(r=>r.email!==String(email||'').toLowerCase())});
}

/* ═══════════ PHONE NUMBERS ═══════════
   Stored as typed, plus a normalised international form for wa.me links
   (digits only, no + and no spaces — what WhatsApp expects). */
const DEFAULT_DIAL='974';   /* Qatar */
function normPhone(raw){
  let d=String(raw||'').replace(/[^0-9]/g,'');
  if(!d) return '';
  if(d.startsWith('00')) d=d.slice(2);
  if(d.length<=8) d=DEFAULT_DIAL+d;   /* a bare local number gets the country code */
  return d;
}
function validPhone(raw){ const d=normPhone(raw); return d.length>=8&&d.length<=15; }
function prettyPhone(raw){ const d=normPhone(raw); return d?('+'+d):''; }
function waLink(phone,text){ return 'https://wa.me/'+normPhone(phone)+'?text='+encodeURIComponent(text); }
/* Week key so we can remember who has already been messaged this week. */
function weekKey(ts){
  const d=new Date(ts||Date.now()); d.setHours(0,0,0,0);
  d.setDate(d.getDate()+4-(d.getDay()||7));               /* Thursday of this ISO week */
  const y=d.getFullYear();
  const week=Math.ceil(((d-new Date(y,0,1))/86400000+1)/7);
  return y+'-W'+String(week).padStart(2,'0');
}
/* The last Thursday of the month — when the monthly report nudge is due. */
function isLastThursdayOfMonth(d){
  const x=d||new Date();
  if(x.getDay()!==4) return false;
  const probe=new Date(x); probe.setDate(probe.getDate()+7);
  return probe.getMonth()!==x.getMonth();
}
function monthKeyNow(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function weekStartTs(){
  const d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));               /* Monday */
  return d.getTime();
}

/* Change your own password. Asks for the current one first. */
function ChangePassword({user,onDone}){
  const [cur,setCur]=useState(''); const [a,setA]=useState(''); const [b,setB]=useState('');
  const [err,setErr]=useState(''); const [ok,setOk]=useState(false);
  function save(){
    setErr('');
    if(!cur||!a||!b){ setErr('Please fill all three boxes.'); return; }
    if(a!==b){ setErr('The two new passwords do not match.'); return; }
    if(a.length<6){ setErr('Please use at least 6 characters.'); return; }
    if(user.role==='teacher'){
      if(cur!==teacherPassword()){ setErr('Your current password is not correct.'); return; }
      saveSetting({teacherPass:a}); setOk(true); return;
    }
    if(user.role==='student'){
      const all=DB.students(); const me=all.find(x=>x.id===user.id);
      if(!me||me.pass!==cur){ setErr('Your current password is not correct.'); return; }
      me.pass=a; DB.save.students(all); clearPwRequest(me.email); setOk(true); return;
    }
    const all=DB.parents(); const me=all.find(x=>x.id===user.id);
    if(!me||me.pass!==cur){ setErr('Your current password is not correct.'); return; }
    me.pass=a; DB.save.parents(all); clearPwRequest(me.email); setOk(true);
  }
  if(ok) return (
    <div>
      <div style={{padding:'12px 14px',background:'#DCEFE3',border:'2px solid #22c55e',borderRadius:10,fontSize:14,fontWeight:700}}>✓ Your password has been changed.</div>
      <button className="mbtn" style={{marginTop:12}} onClick={onDone}>Close</button>
    </div>
  );
  return (
    <div>
      <div className="mfield"><label>Current password</label><input type="password" value={cur} onChange={e=>setCur(e.target.value)} placeholder="The password you use now"/></div>
      <div className="mfield"><label>New password</label><input type="password" value={a} onChange={e=>setA(e.target.value)} placeholder="At least 6 characters"/></div>
      <div className="mfield"><label>Repeat the new password</label><input type="password" value={b} onChange={e=>setB(e.target.value)} onKeyDown={e=>e.key==='Enter'&&save()} placeholder="Type it again"/></div>
      {err&&<div className="merr">{err}</div>}
      <button className="mbtn" onClick={save}>Save new password</button>
    </div>
  );
}

/* ═══════════ MONTHS ═══════════
   A year of homework is unreadable in one list, so everything is grouped by the
   month it was due (falling back to when it was created). */
function monthKeyOf(a){
  const t=a&&a.dueDate?new Date(a.dueDate+'T00:00:00').getTime():(a&&a.createdAt)||0;
  if(!t||isNaN(t)) return '0000-00';
  const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(key){
  if(!key||key==='0000-00') return 'No date';
  const [y,m]=key.split('-').map(Number);
  const d=new Date(y,(m||1)-1,1);
  return isNaN(d.getTime())?key:d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
}
function monthShort(key){
  if(!key||key==='0000-00') return 'No date';
  const [y,m]=key.split('-').map(Number);
  const d=new Date(y,(m||1)-1,1);
  return isNaN(d.getTime())?key:d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});
}
/* [{key,label,count}] newest first. */
function buildMonths(items){
  const map={};
  items.forEach(a=>{ const k=monthKeyOf(a); map[k]=(map[k]||0)+1; });
  return Object.keys(map).sort((a,b)=>b.localeCompare(a)).map(k=>({key:k,label:monthLabel(k),count:map[k]}));
}
/* The month to open on: the newest one that actually has something in it. */
function newestMonth(items){ const m=buildMonths(items); return m.length?m[0].key:'all'; }

function MonthPicker({months,value,onChange,total,noun,extra}){
  if(!months.length) return null;
  const opts=(extra||[]).concat(months);
  const latest=(extra&&extra.length)?extra[0].key:months[0].key;
  return (
    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:12}}>
      <span style={{fontSize:12,fontWeight:700,opacity:0.7}}>📅 Month:</span>
      <select value={value} onChange={e=>onChange(e.target.value)}
        style={{padding:'6px 10px',border:'2px solid var(--ink)',borderRadius:8,fontSize:13,fontFamily:'inherit',fontWeight:600,background:'#fff',color:'var(--ink)'}}>
        {opts.map(m=><option key={m.key} value={m.key}>{m.label} ({m.count}){m.key===latest?'  ← latest':''}</option>)}
        <option value="all">All months ({total})</option>
      </select>
      {value!==latest&&<button className="a-btn" style={{fontSize:11,padding:'4px 10px'}} onClick={()=>onChange(latest)}>↩ Back to latest</button>}
      {value==='all'&&<span style={{fontSize:12,opacity:0.6}}>showing every {noun||'item'} of the year</span>}
    </div>
  );
}

/* Due-date display for a student's own row: the date plus how it's going. */
function fmtDue(due){ if(!due) return '—'; const d=new Date(due+'T00:00:00'); return isNaN(d.getTime())?due:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function dueNote(due,sub){
  if(!due) return null;
  const end=new Date(due+'T23:59:59').getTime();
  if(isNaN(end)) return null;
  if(sub) return isLate(due,sub.submittedAt)?{txt:'handed in late',tone:'#b45309'}:null;
  const today=new Date(); today.setHours(0,0,0,0);
  const dayMs=86400000;
  const days=Math.round((new Date(due+'T00:00:00').getTime()-today.getTime())/dayMs);
  if(days<0)  return {txt:(days===-1?'1 day overdue':(-days)+' days overdue'),tone:'#b91c1c'};
  if(days===0) return {txt:'due today',tone:'#b45309'};
  if(days===1) return {txt:'due tomorrow',tone:'#b45309'};
  if(days<=7) return {txt:'in '+days+' days',tone:'#1F6B43'};
  return null;
}

/* In-memory cache = source of truth for the app's synchronous reads. */
const _cache = { groups:[], students:[], messages:[], submissions:[], assignments:[], posts:[], meetings:[], parents:[], recordings:[], sessions:[], settings:[] };
const _shadow = { groups:{}, students:{}, messages:{}, submissions:{}, assignments:{}, posts:{}, meetings:{}, parents:{}, recordings:{}, sessions:{}, settings:{} }; /* last-known cloud doc per id */
const _fieldFileId = {};   /* "collection:itemId:field" -> fileId in cloud */
const _fileBlobs = {};     /* fileId -> reassembled base64 */

function _clone(a){ return JSON.parse(JSON.stringify(a||[])); }

function _loadLocal(){ KEYS.forEach(k=>{ try{ const v=JSON.parse(localStorage.getItem('zh_'+k)); if(Array.isArray(v)) _cache[k]=v; }catch(e){} }); }
/* Never copy uploaded files into localStorage — a few PDFs blow past the ~5MB
   browser quota, the write throws, and NOTHING gets cached from then on. Store the
   records only; the file bytes live in the cloud and load on demand. */
function _stripFiles(k,arr){
  const fields=FILE_FIELDS[k]; if(!fields) return arr;
  return arr.map(it=>{
    if(!it||typeof it!=='object') return it;
    let copy=null;
    for(const f of fields){ if(typeof it[f]==='string' && it[f].startsWith('data:')){ copy=copy||Object.assign({},it); copy[f]=''; } }
    return copy||it;
  });
}
function _saveLocal(k){ try{ localStorage.setItem('zh_'+k, JSON.stringify(_stripFiles(k,_cache[k]))); }catch(e){} }

/* ---- Firestore handles ---- */

/* ---- big-file handling: split base64 across chunk docs so it syncs on the free plan ---- */
async function _uploadFile(b64){
  const fid = uid()+uid()+uid();
  const parts=[]; for(let i=0;i<b64.length;i+=CHUNK) parts.push(b64.slice(i,i+CHUNK));
  await fileRef(fid).set({ n: parts.length });
  for(let i=0;i<parts.length;i++){ await fileRef(fid).collection('chunks').doc(String(i)).set({ d: parts[i] }); }
  _fileBlobs[fid]=b64;
  return fid;
}
/* Deleting a message must also delete its file, or the storage is never reclaimed. */
async function _deleteFileById(fid){
  if(!fid||!fdb) return;
  try{
    const meta=await fileRef(fid).get();
    const n=(meta.exists?(meta.data()||{}).n:0)||0;
    for(let i=0;i<n;i++){ try{ await fileRef(fid).collection('chunks').doc(String(i)).delete(); }catch(e){} }
    try{ await fileRef(fid).delete(); }catch(e){}
  }catch(e){}
  delete _fileBlobs[fid];
}
async function _downloadFile(fid){
  if(_fileBlobs[fid]!=null) return _fileBlobs[fid];
  if(_fileLoading[fid]) return null;
  _fileLoading[fid]=true;
  try{
    const meta=await fileRef(fid).get();
    if(!meta.exists){ _fileLoading[fid]=false; return null; }
    const n=(meta.data()||{}).n||0; let out='';
    for(let i=0;i<n;i++){ const c=await fileRef(fid).collection('chunks').doc(String(i)).get(); out += (c.exists?(c.data().d||''):''); }
    _fileBlobs[fid]=out; _fileLoading[fid]=false; _rerender();
    return out;
  }catch(e){ _fileLoading[fid]=false; return null; }
}

/* Convert an app item into the small "doc" form stored in Firestore (files externalised). */
async function _toDoc(k,item){
  const doc=JSON.parse(JSON.stringify(item));
  const fields=FILE_FIELDS[k]||[];
  for(const f of fields){
    const mapKey=k+':'+item.id+':'+f;
    const val=item[f];
    if(typeof val==='string' && val.startsWith('data:')){
      const prevFid=_fieldFileId[mapKey];
      if(prevFid && _fileBlobs[prevFid]===val){ doc[f]={__fileId:prevFid}; }
      else { const fid=await _uploadFile(val); _fieldFileId[mapKey]=fid; doc[f]={__fileId:fid}; }
    } else if(val && typeof val==='object' && val.__fileId){
      doc[f]=val; /* already externalised */
    } else {
      doc[f]=val||null;
    }
  }
  return doc;
}

/* Convert a Firestore doc back into an app item (file fields resolved to their base64). */
function _fromDoc(k,doc){
  const item=JSON.parse(JSON.stringify(doc));
  const fields=FILE_FIELDS[k]||[];
  for(const f of fields){
    const val=doc[f];
    if(val && typeof val==='object' && val.__fileId){
      const fid=val.__fileId; _fieldFileId[k+':'+doc.id+':'+f]=fid;
      /* LAZY: do NOT download here. Eager loading meant every device pulled down
         every file ever uploaded on every snapshot — unusable by mid-year, and it
         put every student's work on every other student's device. The id below
         lets the UI show the button; FileView fetches the bytes only when opened. */
      item[f+'Id']=fid;
      item[f]=(_fileBlobs[fid]!=null)?_fileBlobs[fid]:'';
    }
  }
  return item;
}

/* Pending local writes not yet confirmed on the server. These keep optimistic UI
   (e.g. a just-submitted homework) from being wiped by an incoming snapshot before
   the upload finishes — which was causing "saved but disappears / needs multiple tries". */
const _pending    = { groups:{}, students:{}, messages:{}, submissions:{}, assignments:{}, posts:{}, meetings:{}, parents:{}, recordings:{}, sessions:{}, settings:{} };
const _pendingDel = { groups:{}, students:{}, messages:{}, submissions:{}, assignments:{}, posts:{}, meetings:{}, parents:{}, recordings:{}, sessions:{}, settings:{} };

function _save(k,arr){
  const next=_clone(arr);
  _cache[k]=next;          /* instant local update */
  _saveLocal(k);
  /* mark every item as a pending local write, and note any removed ids as pending deletes */
  const seen={};
  next.forEach(it=>{ if(it&&it.id!=null){ seen[it.id]=true; _pending[k][it.id]=it; delete _pendingDel[k][it.id]; } });
  Object.keys(_shadow[k]).forEach(id=>{ if(!seen[id]) _pendingDel[k][id]=true; });
  _rerender();
  if(CLOUD_ON && fdb) _pushToCloud(k,next);
}

function _clean(o){ const r={}; for(const key in o){ if(o[key]!==undefined) r[key]=o[key]; } return r; }

/* Write one item: the RECORD lands first (so it appears for everyone within a second),
   then any heavy file uploads in the background and patches itself in. */
async function _writeItem(k,item){
  const fileFields=FILE_FIELDS[k]||[];
  const base=JSON.parse(JSON.stringify(item)); /* JSON round-trip also drops undefined */
  const uploads=[];
  for(const f of fileFields){
    const mapKey=k+':'+item.id+':'+f;
    const val=item[f];
    const prevDoc=_shadow[k][item.id] && _shadow[k][item.id][f];  /* what's currently in the cloud */
    if(typeof val==='string' && val.startsWith('data:')){
      const prevFid=_fieldFileId[mapKey];
      if(prevFid && _fileBlobs[prevFid]===val){ base[f]={__fileId:prevFid}; }
      else { base[f]=null; uploads.push({f,val,mapKey}); } /* defer the heavy file */
    } else if(val && typeof val==='object' && val.__fileId){ base[f]=val; }
    else if((val===''||val==null) && prevDoc && typeof prevDoc==='object' && prevDoc.__fileId){
      base[f]=prevDoc;  /* file not downloaded on this device yet → KEEP the existing file, don't wipe it */
    }
    else { base[f]=(val===undefined?null:val); }
  }
  for(const f of fileFields) delete base[f+'Id'];  /* UI-only hint, never stored */
  const cleaned=_clean(base);
  if(!_shadowEqual(_shadow[k][item.id],cleaned)){
    await colRef(k).doc(String(item.id)).set(cleaned);   /* record appears immediately */
    _shadow[k][item.id]=cleaned;
  }
  for(const u of uploads){
    try{
      const fid=await _uploadFile(u.val);
      _fieldFileId[u.mapKey]=fid;
      const patch={}; patch[u.f]={__fileId:fid};
      await colRef(k).doc(String(item.id)).set(patch,{merge:true});
      _shadow[k][item.id]=Object.assign({},_shadow[k][item.id],patch);
      _rerender();
    }catch(e){ console.warn('File upload failed ('+k+'/'+u.f+'):',e); }
  }
}

async function _pushToCloud(k,arr){
  _syncBusy++; _syncErr=''; _syncBadge();
  try{
    const seen={};
    for(const item of arr){
      if(!item || item.id==null) continue;
      seen[item.id]=true;
      try{ await _writeItem(k,item); }
      catch(e){ _syncErr=String((e&&e.message)||e); console.warn('Cloud save ('+k+') failed:',e); }
      if(_pending[k][item.id]===item) delete _pending[k][item.id]; /* confirmed on server */
    }
    for(const id in _shadow[k]){
      if(!seen[id]){ try{ await colRef(k).doc(String(id)).delete(); }catch(e){} delete _shadow[k][id]; delete _pendingDel[k][id]; }
    }
  } finally { _syncBusy--; _syncBadge(); }
}

/* ---- live listeners: any change on any device updates every device ---- */
function _attachListeners(){
  KEYS.forEach(k=>{
    colRef(k).onSnapshot(snap=>{
      const shadow={}; const map={};
      snap.forEach(d=>{ const data=d.data()||{}; shadow[d.id]=data; map[d.id]=data; });
      _shadow[k]=shadow;
      /* overlay still-pending local writes so they survive until the server confirms them */
      Object.keys(_pending[k]).forEach(id=>{ map[id]=_pending[k][id]; });
      Object.keys(_pendingDel[k]).forEach(id=>{ delete map[id]; });
      _cache[k]=Object.values(map).map(d=>_fromDoc(k,d));
      _saveLocal(k);
      if(!_firstSnap[k]){ _firstSnap[k]=true; _maybeSeedFromLocal(k,Object.values(shadow)); }
      _syncErr=''; _syncBadge();
      _rerender();
    }, err=>{ _syncErr='read: '+String((err&&err.message)||err); _syncBadge(); console.warn('Cloud listen ('+k+') error:',err); });
  });
}

/* First-time setup: if the cloud is empty for a collection but this device already
   had local data (e.g. test registrations), upload that data once so nothing is lost. */
function _maybeSeedFromLocal(k,cloudDocs){
  try{
    const flag='zh_seeded_'+FIREBASE_CONFIG.projectId+'_'+k;
    if(localStorage.getItem(flag)) return;
    localStorage.setItem(flag,'1');
    if(cloudDocs.length===0){
      let local=[]; try{ local=JSON.parse(localStorage.getItem('zh_'+k))||[]; }catch(e){}
      if(Array.isArray(local) && local.length){ _pushToCloud(k,local); }
    }
  }catch(e){}
}

/* ---- boot ---- */
if(CLOUD_ON){
  try{

    fdb = firebase.firestore();

    _cloudLive=true;
  }catch(e){
    _cloudLive=false;
    console.error('Firebase init failed — running local-only. Check your config.',e);
  }
  _syncBadge();
}

/* ═══════════ PDF CROPPER ═══════════ */
function PdfCropper({topics,onSaveQuestion}) {
  const [pdfDoc,setPdfDoc]=useState(null);
  const [pageNum,setPageNum]=useState(1);
  const [numPages,setNumPages]=useState(0);
  const [dragStart,setDragStart]=useState(null);
  const [cropRect,setCropRect]=useState(null);
  const [capturedQ,setCapturedQ]=useState(null);
  const [capturedA,setCapturedA]=useState(null);
  const [saveTopic,setSaveTopic]=useState(topics[0]?.id||"");
  const canvasRef=useRef(null);
  const wrapRef=useRef(null);
  useEffect(()=>{ if(pdfDoc)renderPage(pageNum); },[pdfDoc,pageNum]);
  async function handleFile(e){ const file=e.target.files[0]; if(!file)return; const ab=await file.arrayBuffer(); const doc=await pdfjsLib.getDocument({data:ab}).promise; setPdfDoc(doc); setNumPages(doc.numPages); setPageNum(1); }
  async function renderPage(n){ if(!pdfDoc||!canvasRef.current)return; const page=await pdfDoc.getPage(n); const viewport=page.getViewport({scale:1.6}); const canvas=canvasRef.current; canvas.width=viewport.width; canvas.height=viewport.height; const ctx=canvas.getContext("2d"); await page.render({canvasContext:ctx,viewport}).promise; }
  function getRelPos(e){ const rect=canvasRef.current.getBoundingClientRect(); return{x:e.clientX-rect.left+wrapRef.current.scrollLeft,y:e.clientY-rect.top+wrapRef.current.scrollTop}; }
  function onMouseDown(e){ if(!pdfDoc)return; setCropRect(null); setDragStart(getRelPos(e)); }
  function onMouseMove(e){ if(!dragStart)return; const cur=getRelPos(e); setCropRect({x:Math.min(dragStart.x,cur.x),y:Math.min(dragStart.y,cur.y),w:Math.abs(cur.x-dragStart.x),h:Math.abs(cur.y-dragStart.y)}); }
  function onMouseUp(){ setDragStart(null); }
  function cropToDataUrl(){ if(!cropRect||!canvasRef.current)return null; const src=canvasRef.current; const tmp=document.createElement("canvas"); tmp.width=cropRect.w; tmp.height=cropRect.h; tmp.getContext("2d").drawImage(src,cropRect.x,cropRect.y,cropRect.w,cropRect.h,0,0,cropRect.w,cropRect.h); return tmp.toDataURL("image/jpeg",0.9); }
  function captureAsQuestion(){ const d=cropToDataUrl(); if(d)setCapturedQ(d); }
  function captureAsAnswer(){ const d=cropToDataUrl(); if(d)setCapturedA(d); }
  function saveToTopic(){ if(!capturedQ||!capturedA||!saveTopic)return; onSaveQuestion(saveTopic,capturedQ,capturedA); setCapturedQ(null); setCapturedA(null); setCropRect(null); }
  return (
    <div>
      <h2 className="page-title display">PDF Question Cropper</h2>
      <p className="page-sub">Upload your own book PDF. Browse to a page, drag a box around the question, capture it, then do the same for the answer.</p>
      <div className="cropper-toolbar">
        <input type="file" accept="application/pdf" onChange={handleFile}/>
        {pdfDoc&&<><button onClick={()=>setPageNum(p=>Math.max(1,p-1))}>← Prev</button><span className="pageinfo">Page {pageNum}/{numPages}</span><button onClick={()=>setPageNum(p=>Math.min(numPages,p+1))}>Next →</button><input type="number" min="1" max={numPages} value={pageNum} onChange={e=>setPageNum(Math.min(numPages,Math.max(1,Number(e.target.value)||1)))} style={{width:60,border:"2px solid var(--ink)",borderRadius:6,padding:"6px 8px",fontFamily:"inherit"}}/></>}
      </div>
      {pdfDoc&&(<div className="cropper-canvas-wrap" ref={wrapRef} onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} style={{cursor:"crosshair"}}><canvas ref={canvasRef} className="pdfcanvas"/>{cropRect&&<div className="crop-rect" style={{left:cropRect.x,top:cropRect.y,width:cropRect.w,height:cropRect.h}}/>}</div>)}
      <div className="capture-row">
        <div className="capture-box"><h4>Question</h4>{capturedQ?<img src={capturedQ} alt="q"/>:<div className="placeholder">No question captured yet</div>}</div>
        <div className="capture-box"><h4>Answer / Mark Scheme</h4>{capturedA?<img src={capturedA} alt="a"/>:<div className="placeholder">No answer captured yet</div>}</div>
      </div>
      <div className="capture-row" style={{gap:8,flexWrap:"wrap"}}>
        <button className="small-btn" onClick={captureAsQuestion} disabled={!cropRect}>Capture as Question</button>
        <button className="small-btn" onClick={captureAsAnswer} disabled={!cropRect}>Capture as Answer</button>
      </div>
      <div className="save-row" style={{marginTop:10}}>
        <select value={saveTopic} onChange={e=>setSaveTopic(e.target.value)}>{topics.map(t=><option key={t.id} value={t.id}>{t.num}. {t.name}</option>)}</select>
        <button className="small-btn" onClick={saveToTopic} disabled={!capturedQ||!capturedA}>Save to Topic</button>
      </div>
    </div>
  );
}

/* ═══════════ PORTAL MODAL ═══════════ */
function Modal({title,onClose,children}) {
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box">
        <div className="modal-hd">
          <div className="modal-title">{title}</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ═══════════ PORTAL APP ═══════════ */
function PortalApp({user,onLogout,topics,progress,toggleDone,addQuestion,deleteQuestion,saveCroppedQuestion,doneCount,totalCount}) {
  const [view,setView]=useState('home');   // home | group | ebook
  const [groupId,setGroupId]=useState(null);
  const [subView,setSubView]=useState('homework');
  const [dotsOpen,setDotsOpen]=useState(null);
  const [chatTarget,setChatTarget]=useState(null);
  const [modal,setModal]=useState(null);  // {type,id,extra}
  const [tick,setTick]=useState(0);
  const [pendingFile,setPendingFile]=useState({});
  const [showManageStudents,setShowManageStudents]=useState(false);
  // eBook state
  const [ebookTopic,setEbookTopic]=useState(null);
  const [ebookLockMsg,setEbookLockMsg]=useState(false);
  const [ebookSearch,setEbookSearch]=useState('');
  const [ebookLevelFilter,setEbookLevelFilter]=useState('All');
  const [openQ,setOpenQ]=useState(null);
  const [reviewAssignId,setReviewAssignId]=useState(null);
  const [detailStudentId,setDetailStudentId]=useState(null);   /* full-page student report */
  const [liveMeeting,setLiveMeeting]=useState(null);
  const [assignStudentId,setAssignStudentId]=useState(null);

  const refresh=()=>setTick(t=>t+1);
  const isT=user.role==='teacher';

  const groups=DB.groups();
  const myGroups=isT?groups:groups.filter(g=>(g.students||[]).includes(user.id));
  const allStudents=DB.students();

  function removeStudentAccount(sid){
    if(!confirm('Remove this student account? They will be removed from all groups.'))return;
    // Remove from all groups
    const grps=DB.groups();
    grps.forEach(g=>{g.students=(g.students||[]).filter(s=>s!==sid);});
    DB.save.groups(grps);
    // Remove submissions
    DB.save.submissions(DB.submissions().filter(s=>s.studentId!==sid));
    // Remove messages
    DB.save.messages(DB.messages().filter(m=>m.from!==sid&&m.to!==sid));
    // Remove student
    DB.save.students(DB.students().filter(s=>s.id!==sid));
    refresh();
  }

  function openGroup(id,tab,reviewId){ setGroupId(id); setView('group'); setSubView(tab||'homework'); setDotsOpen(null); setReviewAssignId(reviewId||null); }
  function openHome(){ setView('home'); setGroupId(null); setDotsOpen(null); setReviewAssignId(null); }
  function deleteGroup(id){
    if(!confirm('Delete this group and all its assignments?'))return;
    const aIds=DB.assignments().filter(a=>a.groupId===id).map(a=>a.id);
    DB.save.assignments(DB.assignments().filter(a=>a.groupId!==id));
    DB.save.submissions(DB.submissions().filter(s=>!aIds.includes(s.assignmentId)));
    DB.save.groups(DB.groups().filter(g=>g.id!==id));
    if(groupId===id){ setGroupId(null); setView('home'); }
    setDotsOpen(null); refresh();
  }
  function renameGroup(g){
    const nn=prompt('Group name:', g.name); if(nn==null) return;
    if(!nn.trim()){ alert('Please enter a name.'); return; }
    const all=DB.groups(); const r=all.find(x=>x.id===g.id); if(r){ r.name=nn.trim(); DB.save.groups(all);} refresh();
  }
  function removeFromGroup(gid,sid){
    if(!confirm('Remove this student from the group?'))return;
    const all=DB.groups(); const g=all.find(x=>x.id===gid); if(g){ g.students=(g.students||[]).filter(id=>id!==sid); DB.save.groups(all);} refresh();
  }

  /* sidebar */
  const sidebar = (
    <div className="p-sidebar">
      <div className="p-sidebar-top" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
        <div>
          <div className="p-sidebar-logo">Zπ Maths Hub Portal</div>
          <div className="p-sidebar-user">{user.name} · {isT?'Teacher':'Student'}</div>
        </div>
        <Notifications user={user} onOpenPosts={()=>{setView('posts');setDotsOpen(null);}} onOpenGroup={(id,tab,rid)=>id?openGroup(id,tab,rid):openHome()} onOpenMeetings={()=>{setView('meetings');setDotsOpen(null);}} onAddStudent={(sid)=>setAssignStudentId(sid)} onOpenParents={()=>{setView('parents');setDotsOpen(null);}} onOpenRegs={()=>{setView('registrations');setDotsOpen(null);}}/>
      </div>
      <div className="p-sidebar-nav">
        <div className="p-nav-label">Navigation</div>
        <div className={"p-nav-item "+(view==='home'?'active':'')} onClick={openHome}>🏠 Home</div>
        <div className={"p-nav-item "+(view==='ebook'?'active':'')} onClick={()=>{setView('ebook');setEbookTopic(null);setDotsOpen(null);}}>📖 eBook</div>
        {!userIsEbookOnly(user)&&<div className={"p-nav-item "+(view==='lessons'?'active':'')} onClick={()=>{setView('lessons');setDotsOpen(null);}}>📊 Lessons</div>}
        <div className={"p-nav-item "+(view==='posts'?'active':'')} onClick={()=>{setView('posts');setDotsOpen(null);}}>📌 Announcements</div>
        <div className={"p-nav-item "+(view==='recordings'?'active':'')} onClick={()=>{setView('recordings');setDotsOpen(null);}}>🎬 Recordings</div>
        {isT&&<div className={"p-nav-item "+(view==='parents'?'active':'')} onClick={()=>{setView('parents');setDotsOpen(null);}}>👪 Parents</div>}

        <div className="p-nav-label">Groups</div>
        {myGroups.map(g=>(
          <div key={g.id} className="p-group-row">
            <div className={"p-group-btn "+(view==='group'&&groupId===g.id?'active':'')} onClick={()=>openGroup(g.id)}>
              <span>👥</span><span>{g.name}</span>
            </div>
            {isT&&(
              <div className="p-dots-btn" onClick={e=>{e.stopPropagation();setDotsOpen(dotsOpen===g.id?null:g.id);}}>
                ⋮
                {dotsOpen===g.id&&(
                  <div className="p-dots-menu">
                    <div className="p-dots-item" onClick={()=>{openGroup(g.id,'members');setDotsOpen(null);}}>👥 Manage students</div>
                    <div className="p-dots-item" onClick={()=>{renameGroup(g);setDotsOpen(null);}}>✏️ Rename group</div>
                    <div className="p-dots-item" onClick={()=>{setModal({type:'addStudent',id:g.id});setDotsOpen(null);}}>➕ Add students</div>
                    <div className="p-dots-item" onClick={()=>{
                      const all=DB.groups(); const r=all.find(x=>x.id===g.id); if(!r){setDotsOpen(null);return;}
                      const turnOn=!r.ebookOnly;
                      if(confirm(turnOn
                        ? 'Make “'+r.name+'” a Year 9 class?\n\nIts students will no longer see the Lessons slides — only the eBook — and the class gets a Class notices tab.'
                        : 'Turn off Year 9 for “'+r.name+'”?\n\nIts students will get the Lessons slides back.')){
                        r.ebookOnly=turnOn; DB.save.groups(all); refresh();
                      }
                      setDotsOpen(null);
                    }}>📗 {g.ebookOnly?'Year 9 — turn off':'Make Year 9 (eBook only)'}</div>
                    <div className="p-dots-item danger" onClick={()=>deleteGroup(g.id)}>🗑 Delete group</div>
                  </div>
                )}
              </div>
            )}
          </div>
        ))}
        {isT&&<div className="p-nav-item" onClick={()=>setModal({type:'createGroup'})} style={{marginTop:6}}>＋ Create group</div>}
      </div>
      {user.role!=='teacher'&&<NotifyButton user={user}/>}
      <div style={{padding:'0 10px'}}><InstallApp compact/></div>
      <div className="p-sidebar-foot" style={{gap:6}}>
        <button className="p-foot-btn" onClick={()=>setModal({type:'changePw'})} style={{flex:1}}>🔑 Password</button>
        <button className="p-foot-btn" onClick={onLogout} style={{flex:1}}>Sign out</button>
      </div>
    </div>
  );

  /* Manage students overlay */
  const manageStudentsOverlay = showManageStudents?(
    <Modal title={"All registered students ("+allStudents.length+")"} onClose={()=>setShowManageStudents(false)}>
      {allStudents.length===0&&<div className="empty-state">No students registered yet.</div>}
      {allStudents.map(s=><div key={s.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid #eee'}}>
        <div style={{width:32,height:32,borderRadius:'50%',background:'var(--chalk-blue)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700}}>{initials(s.name)}</div>
        <div style={{flex:1}}>
          <div style={{fontWeight:600,fontSize:14}}>{s.name}</div>
          <div style={{fontSize:12,opacity:0.6}}>{s.email}</div>
          <div style={{fontSize:11,opacity:0.5}}>Joined {fmtDate(s.createdAt||Date.now())}</div>
        </div>
        <button className="a-btn danger" onClick={()=>{removeStudentAccount(s.id);setShowManageStudents(false);setTimeout(()=>setShowManageStudents(true),50);}}>🗑 Remove</button>
      </div>)}
    </Modal>
  ):null;

  /* Assign a (newly registered) student to a group */
  const assignStudent = assignStudentId?allStudents.find(s=>s.id===assignStudentId):null;
  function addStudentToGroup(sid,gid){
    const all=DB.groups(); const g=all.find(x=>x.id===gid); if(g){ g.students=g.students||[]; if(!g.students.includes(sid)) g.students.push(sid); DB.save.groups(all);} 
  }
  const assignStudentOverlay = assignStudent?(
    <Modal title={"Add "+assignStudent.name+" to a group"} onClose={()=>setAssignStudentId(null)}>

      {groups.length===0&&<div className="empty-state">No groups yet. Create a group first, then add the student.</div>}

        <div key={g.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid #eee'}}>

             :<button className="a-btn" onClick={()=>addStudentToGroup(assignStudent.id,g.id)} style={{background:'var(--green-deep)',color:'#fff',borderColor:'var(--green-deep)'}}>＋ Add</button>}
        </div>); })}
    </Modal>
  ):null;

  /* ── HOME ── */
  const portalHome = ()=>{
    const assigns=DB.assignments();
    if(isT){
      return (
        <div className="p-main">
          <div className="p-topbar">
            <div className="p-topbar-title">Welcome back, {user.name} 👋</div>
