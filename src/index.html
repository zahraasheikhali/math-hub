                  const hw=assigns.filter(a=>a.groupId===g.id&&a.type==='homework').length;
                  const mk=assigns.filter(a=>a.groupId===g.id&&a.type==='mock').length;
                  return <div key={g.id} className="p-gcard" onClick={()=>openGroup(g.id)}>
                    <div style={{fontWeight:700,marginBottom:8}}>{g.name}</div>
                    <div style={{display:'flex',gap:6}}><span className="pill pill-blue">{hw} hw</span><span className="pill pill-gray">{mk} mocks</span></div>
                  </div>;
                })}
              </div>
            </div>
          )}
          {myGroups.length===0&&<div style={{background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:'16px 20px',boxShadow:'4px 4px 0 var(--ink)',marginBottom:18}}><div className="empty-state">Waiting for your teacher to add you to a group.</div></div>}
          <HomePage topics={topics} onEnter={(topicId)=>{setView('ebook');if(topicId){setEbookTopic(topicId);}}}/>
        </div>
      </div>
    );
  };

  /* ── GROUP VIEW ── */
  const groupView = ()=>{
    const group=DB.groups().find(g=>g.id===groupId);
    if(!group) return <div className="p-main"><div className="p-topbar"><div className="p-topbar-title">Group not found</div></div></div>;

    // Full-page student report (was a cramped modal — a year of assignments needs a page)
    if(detailStudentId){
      const stu=DB.students().find(x=>x.id===detailStudentId);
      if(!stu){ setDetailStudentId(null); return null; }
      return (
        <div className="p-main">
          <div className="p-topbar" style={{flexWrap:'wrap',gap:8}}>
            <button className="a-btn" onClick={()=>setDetailStudentId(null)}>← Back to Track</button>
            <div className="p-topbar-title" style={{flex:1}}>📊 {stu.name}</div>
          </div>
          <div className="p-page">
            <StudentDetail studentId={detailStudentId} groupId={groupId} fullPage/>
          </div>
        </div>
      );
    }

    // Full-page review mode
    if(reviewAssignId){
      const assignment=DB.assignments().find(a=>a.id===reviewAssignId);
      if(!assignment) { setReviewAssignId(null); return null; }
      return (
        <div className="p-main">
          <div className="p-topbar">
            <button className="a-btn" onClick={()=>setReviewAssignId(null)}>← Back</button>
            <div className="p-topbar-title" style={{flex:1}}>{assignment.title}</div>
            <span className="pill pill-gray">{assignment.type==='homework'?'Homework':'Mock'}</span>
          </div>
          <div className="p-page">
            <FullReviewPage assignId={reviewAssignId} group={group} tick={tick} refresh={refresh}/>
          </div>
        </div>
      );
    }

    const eb=isEbookOnlyGroup(group);
    const tabs=(isT?['homework','mock','track','members','chat']:['homework','mock','track','chat'])
      .concat(eb?['notices']:[]);
    const lbls={homework:'Homework',mock:'Mock Exam',track:'Track',members:'👥 Members',chat:'Chat',notices:'📣 Class notices'};
    const groupStudents=DB.students().filter(s=>(group.students||[]).includes(s.id));
    return (
      <div className="p-main">
        <div className="p-topbar" style={{flexWrap:'wrap',gap:8}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <div className="p-topbar-title">{group.name}</div>
            {isT&&group.ebookOnly&&<span className="pill pill-green" style={{fontSize:10}}>📗 Year 9 · eBook only</span>}
          </div>
          <div className="p-tabs">{tabs.map(t=><button key={t} className={"p-tab "+(subView===t?'active':'')} onClick={()=>{setSubView(t);setReviewAssignId(null);setDetailStudentId(null);}}>{lbls[t]}</button>)}</div>
        </div>
        <div className="p-page">
          {subView==='homework'&&<AssignView type="homework" groupId={groupId} user={user} onModal={setModal} tick={tick} refresh={refresh} onReview={setReviewAssignId}/>}
          {subView==='mock'&&<AssignView type="mock" groupId={groupId} user={user} onModal={setModal} tick={tick} refresh={refresh} onReview={setReviewAssignId}/>}
          {subView==='track'&&<TrackView groupId={groupId} user={user} onModal={setModal} onDetail={setDetailStudentId} tick={tick}/>}
          {subView==='notices'&&<GroupNotices groupId={groupId} user={user} refresh={refresh}/>}
          {subView==='members'&&isT&&(
            <div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
                <div style={{fontFamily:'Georgia,serif',fontWeight:700,color:'var(--green-deep)'}}>Students in this group ({groupStudents.length})</div>
                <button className="a-btn" onClick={()=>setModal({type:'addStudent',id:groupId})} style={{background:'var(--green-deep)',color:'#fff',borderColor:'var(--green-deep)'}}>➕ Add students</button>
              </div>
              {groupStudents.length===0&&<div className="empty-state">No students in this group yet. Tap "Add students".</div>}
              {groupStudents.map(s=>(
                <div key={s.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid #eee'}}>
                  <div style={{width:32,height:32,borderRadius:'50%',background:'var(--chalk-blue)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,flexShrink:0}}>{initials(s.name)}</div>
                  <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:14}}>{s.name}</div><div style={{fontSize:12,opacity:0.6}}>{s.email}</div></div>
                  <button className="a-btn danger" onClick={()=>removeFromGroup(groupId,s.id)} style={{fontSize:12,flexShrink:0}}>Remove</button>
                </div>
              ))}
            </div>
          )}
          {subView==='chat'&&<ChatView groupId={groupId} user={user} chatTarget={chatTarget} setChatTarget={setChatTarget} tick={tick} refresh={refresh}/>}
        </div>
      </div>
    );
  };

  /* ── MODALS ── */
  const renderModal = ()=>{
    if(!modal) return null;
    const {type,id,extra}=modal;
    const close=()=>{ setModal(null); setPendingFile({}); refresh(); };

    if(type==='createGroup') return (
      <Modal title="Create group" onClose={close}>
        <CreateGroupForm onDone={close}/>
      </Modal>
    );
    if(type==='addStudent') return (
      <Modal title={"Add students — "+( DB.groups().find(g=>g.id===id)||{name:''}).name} onClose={close}>
        <AddStudentForm groupId={id} onRefresh={()=>setModal({type,id,extra})}/>
      </Modal>
    );
    if(type==='addAssign') return (
      <Modal title={"Add "+(extra==='homework'?'Homework':'Mock Exam')} onClose={close}>
        <AssignForm groupId={id} atype={extra} onDone={close}/>
      </Modal>
    );
    if(type==='editAssign') return (
      <Modal title={"Edit assignment"} onClose={close}>
        <AssignForm assignId={id} onDone={close}/>
      </Modal>
    );
    if(type==='submitWork') return (
      <Modal title={"Submit work"} onClose={close}>
        <SubmitForm assignId={id} userId={user.id} onDone={close}/>
      </Modal>
    );
    if(type==='viewSubs') return (
      <Modal title={"Submissions"} onClose={close}>
        <SubsView assignId={id} onRefresh={()=>setModal({type,id,extra})}/>
      </Modal>
    );
    if(type==='uploadCorrection') return (
      <Modal title={"Upload correction"} onClose={close}>
        <CorrectionForm assignId={id} onDone={close}/>
      </Modal>
    );
    if(type==='changePw') return (
      <Modal title={"Change your password"} onClose={close}>
        <ChangePassword user={user} onDone={close}/>
      </Modal>
    );
    if(type==='studentDetail') return (
      <Modal title={"Student progress"} onClose={close}>
        <StudentDetail studentId={id} groupId={extra}/>
      </Modal>
    );
    return null;
  };

  /* ── EBOOK VIEW ── */
  const ebookView = ()=>{
    const filteredTopics=ebookSearch.trim()?topics.filter(t=>t.name.toLowerCase().includes(ebookSearch.toLowerCase())||String(t.num)===ebookSearch.trim()):topics;
    if(!ebookTopic){
      const est=appSettings();
      return (
        <div className="p-main">
          <div className="p-topbar" style={{gap:8,flexWrap:'wrap'}}><div className="p-topbar-title">📖 eBook — All 58 Topics</div>
            {isT&&<div style={{display:'flex',gap:8}}>
              <button className="a-btn" onClick={()=>saveSetting({ebookLocked:!est.ebookLocked})} style={est.ebookLocked?{background:'#a11',color:'#fff',borderColor:'#a11'}:{}}>{est.ebookLocked?'🔒 Locked (4+)':'🔓 Unlocked for all'}</button>
              <button className="a-btn" onClick={()=>setView('access')}>🔑 Manage access</button>
            </div>}
          </div>
          <div className="p-page">
            {ebookLockMsg&&(
              <div style={{background:'#FFF3E0',border:'2px solid #d97706',borderRadius:12,padding:'14px 16px',marginBottom:14}}>
                <div style={{fontWeight:700,color:'#b45309'}}>🔒 This topic is locked</div>
                <div style={{fontSize:14,marginTop:4}}>Topics 4 onwards need a subscription. Please <b>contact the teacher in the Chat</b> to get access.</div>
                <button className="a-btn" onClick={()=>setEbookLockMsg(false)} style={{marginTop:8}}>OK</button>
              </div>
            )}
            <input placeholder="Search topics…" value={ebookSearch} onChange={e=>setEbookSearch(e.target.value)} style={{width:'100%',padding:'10px 14px',border:'2px solid var(--ink)',borderRadius:8,fontSize:14,marginBottom:16,fontFamily:'inherit',background:'white'}}/>
            <div className="topic-grid">
              {filteredTopics.map(t=>{
                const done=t.questions.filter(q=>progress[q.id]).length;
                const locked=itemLocked((t.num||99)-1,user,'ebook');
                return <div key={t.id} className="topic-chip" style={{opacity:locked?0.6:1}} onClick={()=>{ if(locked){setEbookLockMsg(true);return;} setEbookTopic(t.id);setEbookLevelFilter('All');setOpenQ(null);}}>
                  <span><span className="tnum">{t.num}.</span>{locked?'🔒 ':''}{t.name}</span>
                  <span className="qcount">{locked?'Locked':done+'/'+t.questions.length}</span>
                </div>;
              })}
            </div>
          </div>
        </div>
      );
    }
    const currentTopic=topics.find(t=>t.id===ebookTopic)||topics[0];
    const filteredQs=currentTopic.questions.filter(q=>ebookLevelFilter==='All'||(q.level||'Medium')===ebookLevelFilter);
    return (
      <div className="p-main">
        <div className="p-topbar">
          <button className="a-btn" onClick={()=>{setEbookTopic(null);setOpenQ(null);}}>← Back to topics</button>
          <div className="p-topbar-title" style={{flex:1}}>{currentTopic.num}. {currentTopic.name}</div>
        </div>
        <div className="p-page">
          <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
            {['All','Easy','Medium','Hard'].map(lv=><button key={lv} onClick={()=>setEbookLevelFilter(lv)} style={{padding:'6px 16px',borderRadius:8,fontSize:13,fontWeight:700,border:'2px solid var(--ink)',cursor:'pointer',boxShadow:'3px 3px 0 var(--ink)',transition:'transform .08s',background:ebookLevelFilter===lv?'var(--ink)':'white',color:ebookLevelFilter===lv?'var(--paper)':'var(--ink)'}}>{lv==='Easy'?'🟢 Easy':lv==='Medium'?'🟡 Medium':lv==='Hard'?'🔴 Hard':'All Levels'}</button>)}
          </div>
          <p className="page-sub">{filteredQs.length} question{filteredQs.length===1?'':'s'}{ebookLevelFilter!=='All'?' ('+ebookLevelFilter.toLowerCase()+')':''}</p>
          {filteredQs.length===0&&<div className="empty-state">{ebookLevelFilter==='All'?'No questions in this topic yet.':'No '+ebookLevelFilter.toLowerCase()+' questions.'}</div>}
          {filteredQs.map((q,i)=>{
            const level=q.level||'Medium';
            return <div key={q.id} className={"qcard "+(openQ===q.id?'open':'')}>
              <div className="qhead" onClick={()=>setOpenQ(openQ===q.id?null:q.id)}>
                <div className="qtext" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                  <span className="qnum">Q{i+1}</span>
                  {q.ref?<span className="qref">{q.ref}</span>:null}
                  <LevelBadge level={level}/>
                </div>
                <div className="qmeta">
                  {progress[q.id]&&<span className="tag-done">✓ Done</span>}
                  <span className="reveal-hint">{openQ===q.id?'Hide answer':'Show answer'}</span>
                  <span className="chev">▾</span>
                </div>
              </div>
              <div className="qbody"><MediaList images={q.questionImages} single={q.questionImage} text={q.text} alt="question"/></div>
              <div className="answer-panel">
                <div className="answer-inner">
                  <div className="label">Mark scheme / answer</div>
                  <MediaList images={q.answerImages} single={q.answerImage} text={q.answer} alt="answer"/>
                  <div className="mark-row">
                    <button className={progress[q.id]?'active':''} onClick={()=>toggleDone(q.id)}>{progress[q.id]?'✓ Marked done':'Mark as done'}</button>
                  </div>
                </div>
              </div>
            </div>;
          })}
        </div>
      </div>
    );
  };

  const postsView = ()=> <PostsView user={user}/>;
  const meetingsView = ()=> <MeetingsView user={user} onLive={setLiveMeeting}/>;
  const recordingsView = ()=> <RecordingsView user={user}/>;

  return (
    <div className="portal-layout" onClick={()=>dotsOpen&&setDotsOpen(null)}>
      {sidebar}
      {view==='home'?portalHome():view==='ebook'?ebookView():view==='lessons'?(userIsEbookOnly(user)?<div className="p-main"><div className="p-topbar"><div className="p-topbar-title">📊 Lessons</div></div><div className="p-page"><div className="empty-state">Your class uses the eBook rather than the lesson slides. Open 📖 eBook from the menu.</div></div></div>:<LessonsView user={user} onManageAccess={()=>setView('access')}/>):view==='access'?<AccessView/>:view==='posts'?postsView():view==='recordings'?recordingsView():view==='parents'?<TeacherParentsView/>:view==='registrations'?<RegistrationsView/>:groupView()}
      {renderModal()}
      {manageStudentsOverlay}
      {assignStudentOverlay}
    </div>
  );
}

/* ═══════════ FULL REVIEW PAGE (teacher marks each student) ═══════════ */
function FullReviewPage({assignId,group,tick,refresh}) {
  const a=DB.assignments().find(x=>x.id===assignId);
  const allSubs=DB.submissions().filter(s=>s.assignmentId===assignId);
  const studs=DB.students().filter(s=>(group.students||[]).includes(s.id));
  const [viewingFile,setViewingFile]=useState(null);
  const corrRefs=useRef({});

  function saveMark(subId,val){
    const subs=DB.submissions(); const sub=subs.find(s=>s.id===subId);
    const _v=isNaN(parseFloat(val))?null:parseFloat(val);
    if(sub) sub.mark=_v;
    DB.save.submissions(subs);
    if(sub&&_v!==null){
      const _a=DB.assignments().find(x=>x.id===sub.assignmentId);
      pushNotify('Your work has been marked',
        (_a?_a.title:'Your work')+' — open the Maths Hub to see your mark and the model answers.',
        {userIds:[sub.studentId]});
    } refresh();
  }
  async function uploadCorrection(subId,e){
    const file=e.target.files[0]; if(!file)return;
    const data=await readUpload(file); if(!data)return;
    const subs=DB.submissions(); const sub=subs.find(s=>s.id===subId);
    if(sub){sub.correctedFile=file.name;sub.correctedFileData=data;}
    DB.save.submissions(subs); refresh();
  }

  if(!a) return <div className="empty-state">Assignment not found.</div>;

  /* file viewer */
  if(viewingFile) {
    const vsub=DB.submissions().find(x=>x.id===viewingFile.subId)||{};
    const vName=viewingFile.corr?vsub.correctedFile:vsub.fileName;
    const vData=viewingFile.corr?vsub.correctedFileData:vsub.fileData;
    const vFid=viewingFile.corr?vsub.correctedFileDataId:vsub.fileDataId;
    return (
    <div>
      <button className="a-btn" onClick={()=>setViewingFile(null)} style={{marginBottom:12}}>← Back to students</button>
      <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>
        {(studs.find(s=>s.id===vsub.studentId)||{name:'Unknown'}).name}'s {viewingFile.corr?'correction':'submission'}
      </div>
      <div style={{fontSize:12,opacity:0.6,marginBottom:12}}>📎 {vName}{vsub.submittedAt?(' · '+fmtDate(vsub.submittedAt)):''}</div>
      <FileView data={vData} name={vName} fileId={vFid}/>
      {(vData||vFid)&&<div style={{marginTop:10}}><DownloadBtn data={vData} fileId={vFid} name={vName}/></div>}
    </div>
  );
  }

  const submitted=allSubs.length, total=studs.length;
  const markedSubs=allSubs.filter(s=>s.mark!==null&&s.mark!==undefined);
  const avgMark=markedSubs.length?Math.round(markedSubs.reduce((sum,s)=>sum+s.mark,0)/markedSubs.length*10)/10:null;
  const avgPct=markedSubs.length&&a.totalMark?Math.round(markedSubs.reduce((sum,s)=>sum+(s.mark/a.totalMark*100),0)/markedSubs.length):null;

  return (
    <div>
      {/* assignment info */}
      <div style={{fontSize:13,opacity:0.7,marginBottom:12}}>
        Total marks: <strong>{a.totalMark}</strong>
        {a.dueDate&&<> · Due: <strong>{fmtDate(new Date(a.dueDate).getTime())}</strong></>}
        {a.description&&<> · {a.description}</>}
      </div>

      {/* top stats */}
      <div className="p-stat-row" style={{marginBottom:22}}>
        <div className="p-stat"><div className="n">{submitted}/{total}</div><div className="l">Submitted</div></div>
        <div className="p-stat"><div className="n">{avgMark!==null?avgMark:'—'}<span style={{fontSize:13,opacity:0.5}}>/{a.totalMark}</span></div><div className="l">Avg mark</div></div>
        <div className="p-stat"><div className="n">{avgPct!==null?avgPct+'%':'—'}</div><div className="l">Avg score</div></div>
        <div className="p-stat"><div className="n">{total-submitted}</div><div className="l">Pending</div></div>
      </div>

      {studs.length===0&&<div className="empty-state">No students in this group.</div>}

      {/* student list */}
      {studs.map(s=>{
        const sub=allSubs.find(x=>x.studentId===s.id);
        const late=sub&&isLate(a.dueDate,sub.submittedAt);
        const refKey=sub?sub.id:'no_'+s.id;
        if(sub&&!corrRefs.current[refKey]) corrRefs.current[refKey]=React.createRef();

        return (
          <div key={s.id} style={{background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:'16px 18px',marginBottom:12,boxShadow:'3px 3px 0 var(--ink)'}}>
            {/* row 1: name + status */}
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:sub?12:0}}>
              <div style={{width:40,height:40,borderRadius:'50%',background:sub?'var(--chalk-blue)':'#bbb',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,fontWeight:700,flexShrink:0}}>{initials(s.name)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:15}}>{s.name}</div>
                <div style={{fontSize:12,opacity:0.55}}>{s.email}</div>
              </div>
              <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap',flexShrink:0}}>
                {sub?(
                  <>
                    {a.dueDate&&(late?<span className="tag-late">Late</span>:<span className="tag-ontime">On time</span>)}
                    {sub.mark!==null&&sub.mark!==undefined?<span className="pill pill-blue" style={{fontSize:13,padding:'3px 10px'}}>{sub.mark}/{a.totalMark}</span>:<span className="pill pill-amber">Not marked</span>}
                  </>
                ):(
                  <span className="pill pill-amber" style={{fontSize:12}}>⏳ Not submitted</span>
                )}
              </div>
            </div>

            {/* row 2+: actions — only if submitted */}
            {sub&&(
              <div style={{borderTop:'1.5px dashed #d0cec4',paddingTop:12,display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
                {/* view & download */}
                <button className="a-btn" onClick={()=>setViewingFile({subId:sub.id})} style={{background:'var(--chalk-blue)',color:'white',borderColor:'var(--chalk-blue)',fontSize:12}}>👁 View</button>
                {hasFile(sub,'fileData')&&<DownloadBtn data={sub.fileData} fileId={sub.fileDataId} name={sub.fileName||'submission'} style={{fontSize:12}}/>}
                {sub.correctedFile&&<button className="a-btn" onClick={()=>setViewingFile({subId:sub.id,corr:true})} style={{background:'#1F6B43',color:'white',borderColor:'#1F6B43',fontSize:12}}>👁 View correction</button>}

                {/* divider */}
                <div style={{width:1,height:24,background:'#d0cec4',margin:'0 2px'}}/>

                {/* mark */}
                <MarkInput subId={sub.id} initVal={sub.mark} onSave={saveMark}/>
                <span style={{fontSize:13,fontWeight:600,opacity:0.6}}>/ {a.totalMark}</span>

                {/* divider */}
                <div style={{width:1,height:24,background:'#d0cec4',margin:'0 2px'}}/>

                {/* correction upload */}
                <input ref={corrRefs.current[refKey]} type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" style={{display:'none'}} onChange={e=>uploadCorrection(sub.id,e)}/>
                <button className="a-btn" onClick={()=>corrRefs.current[refKey]?.current?.click()} style={{background:sub.correctedFile?'#1F6B43':'var(--coral)',color:'white',borderColor:sub.correctedFile?'#1F6B43':'var(--coral)',fontSize:12}}>
                  {sub.correctedFile?'✓ '+sub.correctedFile:'📤 Correction'}
                </button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ═══════════ ASSIGN VIEW ═══════════ */
function AssignView({type,groupId,user,onModal,tick,refresh,onReview}) {
  const isT=user.role==='teacher';
  const all=DB.assignments().filter(a=>a.groupId===groupId&&a.type===type)
    .sort((x,y)=>monthKeyOf(y).localeCompare(monthKeyOf(x))||((y.dueDate||'')>(x.dueDate||'')?1:-1));
  const months=buildMonths(all);
  const [month,setMonth]=useState(()=>newestMonth(all));
  /* if everything in the chosen month is deleted, fall back to the newest one */
  const chosen=months.find(m=>m.key===month)||month==='all'?month:newestMonth(all);
  const assigns=chosen==='all'?all:all.filter(a=>monthKeyOf(a)===chosen);
  const subs=DB.submissions();
  const lbl=type==='homework'?'Homework':'Mock Exam';
  function delAssign(id){ if(!confirm('Delete this assignment and all submissions?'))return; DB.save.assignments(DB.assignments().filter(a=>a.id!==id)); DB.save.submissions(DB.submissions().filter(s=>s.assignmentId!==id)); refresh(); }
  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div style={{fontFamily:'Georgia,serif',fontWeight:700,fontSize:17,color:'var(--green-deep)'}}>{lbl}</div>
        {isT&&<button className="small-btn" onClick={()=>onModal({type:'addAssign',id:groupId,extra:type})}>＋ Add {lbl}</button>}
      </div>
      <MonthPicker months={months} value={chosen} onChange={setMonth} total={all.length} noun={type==='mock'?'mock':'homework'}/>
      {all.length===0&&<div className="empty-state">No {lbl.toLowerCase()} yet.</div>}
      {all.length>0&&assigns.length===0&&<div className="empty-state">Nothing in {monthLabel(chosen)}. Choose another month above.</div>}
      {assigns.map(a=>{
        const mySub=subs.find(s=>s.assignmentId===a.id&&s.studentId===user.id);
        const allSubs=isT?subs.filter(s=>s.assignmentId===a.id):[];
        const due=a.dueDate?new Date(a.dueDate):null;

    </div>
  );

  const isT=user.role==='teacher';

  const list=DB.posts().filter(p=>p.groupId===groupId).sort((a,b)=>(b.at||0)-(a.at||0));
  function post(){
    const t=txt.trim();
    if(!t&&!att.att){ alert('Write a notice, or attach a file.'); return; }
    const all=DB.posts();
    const p={id:uid(),groupId,text:t,at:now(),by:'teacher'};
    if(att.att){ p.fileName=att.att.name; p.fileData=att.att.data; }
    all.push(p);
    DB.save.posts(all); setTxt(''); att.setAtt(null); if(refresh) refresh();

    const all=DB.posts(); const n=all.find(x=>x.id===editId);
    if(n){ n.text=editTxt.trim(); n.edited=now(); DB.save.posts(all); }
    setEditId(null); setEditTxt(''); if(refresh) refresh();
  }
  function del(n){
    if(!confirm(n.fileName?('Delete this notice and its file “'+n.fileName+'”?'):'Delete this notice?')) return;

    DB.save.posts(DB.posts().filter(p=>p.id!==n.id)); if(refresh) refresh();

  return (

            placeholder="e.g. This week revise chapter 4 of the eBook, pages 60–72."
            style={{width:'100%',padding:'9px 11px',border:'2px solid var(--ink)',borderRadius:8,fontSize:14,fontFamily:'inherit',resize:'vertical'}}/>
          {att.att&&(
            <div style={{display:'flex',alignItems:'center',gap:8,marginTop:8,padding:'6px 10px',background:'#DCEFE3',border:'1px solid #22c55e',borderRadius:8,fontSize:12}}>
              <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>📎 {att.att.name}</span>

            </div>
          )}

            <input ref={att.inputRef} type="file" accept={CHAT_ACCEPT} style={{display:'none'}} onChange={att.pick}/>
            <button className="a-btn" onClick={()=>att.inputRef.current&&att.inputRef.current.click()}>{att.busy?'⏳ Reading…':'📎 Attach PDF or picture'}</button>
            <button className="small-btn" onClick={post}>📣 Post notice</button>

        <div key={n.id} className="a-card" style={{marginBottom:10}}>
          {editId===n.id?(
            <div>
              <textarea value={editTxt} onChange={e=>setEditTxt(e.target.value)} rows={3}
                style={{width:'100%',padding:'9px 11px',border:'2px solid var(--ink)',borderRadius:8,fontSize:14,fontFamily:'inherit',resize:'vertical'}}/>
              <div style={{display:'flex',gap:6,marginTop:8}}>

/* ═══════════ CHAT ATTACHMENTS (photos, PDFs, Word — any chat) ═══════════ */
const CHAT_ACCEPT='image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt';
const CHAT_MAX_MB=12;
function useAttach(){
  const [att,setAtt]=useState(null);          /* {name,data} waiting to be sent */
  const [busy,setBusy]=useState(false);
  const inputRef=useRef(null);
  async function pick(e){
    const f=e.target.files&&e.target.files[0]; e.target.value='';
    if(!f) return;
    if(f.size>CHAT_MAX_MB*1024*1024){ alert('That file is too big. Please keep attachments under '+CHAT_MAX_MB+' MB.'); return; }
    setBusy(true);
    const d=await readUpload(f);             /* photos shrink automatically */
    setBusy(false);
    if(d) setAtt({name:f.name,data:d}); else alert('Could not read that file.');
  }
  return {att,setAtt,busy,inputRef,pick};
}
/* Downloads a workbook, with a spinner and a real error message if it fails. */
function ExcelBtn({label,build,fileName,style}){
  const [busy,setBusy]=useState(false);
  return <button className="a-btn" disabled={busy} style={Object.assign({background:'#1F6B43',color:'#fff',borderColor:'#1F6B43'},style||{})}
    onClick={async()=>{
      setBusy(true);
      try{ await downloadWorkbook(build(),fileName()); }
      catch(e){ alert('Could not build the Excel file. Check your internet connection and try again.'); }
      setBusy(false);
    }}>{busy?'⏳ Preparing…':(label||'⬇ Excel')}</button>;
}

function AttachBtn({a}){
  return (<>
    <input ref={a.inputRef} type="file" accept={CHAT_ACCEPT} style={{display:'none'}} onChange={a.pick}/>
    <button className="chat-attach" title="Attach a photo or file"
      onClick={()=>a.inputRef.current&&a.inputRef.current.click()}>{a.busy?'⏳':'📎'}</button>

}
function AttachBar({a}){

/* Bubble contents: the text (or an edit box), the attachment, and the small
   ✏️/🗑 controls. Used by every chat so behaviour is identical everywhere. */
function MsgBody({m,canEdit,canDelete,onSave,onDelete}){
  const [editing,setEditing]=useState(false);
  const [txt,setTxt]=useState(m.text||'');
  useEffect(()=>{ setTxt(m.text||''); },[m.text]);
  if(editing){
    return (
      <div>
        <input value={txt} autoFocus onChange={e=>setTxt(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter'){ onSave(m,txt); setEditing(false); } if(e.key==='Escape') setEditing(false); }}
          style={{width:'100%',padding:'6px 9px',border:'2px solid var(--ink)',borderRadius:7,fontSize:13,fontFamily:'inherit'}}/>
        <div style={{display:'flex',gap:6,marginTop:6}}>
          <button className="a-btn" style={{fontSize:11,padding:'3px 9px'}} onClick={()=>{ onSave(m,txt); setEditing(false); }}>Save</button>
          <button className="a-btn" style={{fontSize:11,padding:'3px 9px'}} onClick={()=>{ setTxt(m.text||''); setEditing(false); }}>Cancel</button>
        </div>
      </div>
    );
  }
  return (<>
    {m.text}
    {m.editedAt&&<span style={{fontSize:10,opacity:0.55,marginLeft:6}}>(edited)</span>}
    <MsgFile m={m}/>
    {(canEdit||canDelete)&&(
      <div style={{display:'flex',gap:6,marginTop:6,opacity:0.75}}>
        {canEdit&&m.text!==undefined&&<button className="a-btn" title="Edit this message"
          style={{fontSize:10,padding:'2px 7px'}} onClick={()=>setEditing(true)}>✏️ Edit</button>}
        {canDelete&&<button className="a-btn danger" title="Delete this message"
          style={{fontSize:10,padding:'2px 7px'}} onClick={()=>onDelete(m)}>🗑 Delete</button>}
      </div>
    )}
  </>);
}

function ChatView({groupId,user,chatTarget,setChatTarget,tick,refresh}) {
  const isT=user.role==='teacher';
  const group=DB.groups().find(g=>g.id===groupId);
  const studs=DB.students().filter(s=>(group.students||[]).includes(s.id));
  const allMsgs=DB.messages().filter(m=>m.groupId===groupId);
  const [msg,setMsg]=useState('');
  const att=useAttach();
  const ALL_TARGET='__all__';
  const target=chatTarget||ALL_TARGET;
  function send(){
    const body=msg.trim();
    if(!body&&!att.att)return;                       /* a file on its own is fine */
    const file=att.att?{fileName:att.att.name,fileData:att.att.data}:{};
    const msgs=DB.messages();
    if(isT){
      if(target===ALL_TARGET){
        // Broadcast to all students
        msgs.push(Object.assign({id:uid(),groupId,from:'teacher',to:ALL_TARGET,text:body,at:now(),broadcast:true},file));
      } else {
        msgs.push(Object.assign({id:uid(),groupId,from:'teacher',to:target,text:body,at:now()},file));
      }
    } else {
      msgs.push(Object.assign({id:uid(),groupId,from:user.id,to:'teacher',text:body,at:now()},file));
    }
    DB.save.messages(msgs);
    setMsg(''); att.setAtt(null); refresh();
  }
  const meId=isT?'teacher':user.id;
  function saveEdit(m,text){
    const msgs=DB.messages(); const t=msgs.find(x=>x.id===m.id);
    if(t){ t.text=String(text||'').trim(); t.editedAt=now(); }
    DB.save.messages(msgs); refresh();
  }
  function removeMsg(m){
    if(!confirm(m.fileName?('Delete this message and its file "'+m.fileName+'"? This cannot be undone.')
                          :'Delete this message? This cannot be undone.')) return;
    if(m.fileDataId) DB.deleteFile(m.fileDataId);
    DB.save.messages(DB.messages().filter(x=>x.id!==m.id)); refresh();
  }
  if(isT){
    let conv;
    if(target===ALL_TARGET){
      conv=allMsgs.filter(m=>m.broadcast);
    } else {
      conv=allMsgs.filter(m=>(m.from===target&&m.to==='teacher')||(m.from==='teacher'&&m.to===target)||m.broadcast);
    }
    return (
      <div className="chat-frame">
        <div className="chat-students">
          <div className="chat-hd">Recipients</div>
          <div style={{flex:1,overflowY:'auto'}}>
            <div onClick={()=>setChatTarget(ALL_TARGET)} style={{padding:'10px 12px',cursor:'pointer',display:'flex',alignItems:'center',gap:8,background:(target===ALL_TARGET)?'var(--paper)':'',borderBottom:'2px solid var(--ink)'}}>
              <div style={{width:28,height:28,borderRadius:'50%',background:'var(--coral)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>📢</div>
              <span style={{fontSize:13,fontWeight:700}}>All Students</span>
            </div>
            {studs.length===0&&<div style={{padding:14,fontSize:13,opacity:0.6}}>No students yet</div>}
            {studs.map(s=><div key={s.id} onClick={()=>setChatTarget(s.id)} style={{padding:'10px 12px',cursor:'pointer',display:'flex',alignItems:'center',gap:8,background:(target===s.id)?'var(--paper)':'',borderBottom:'1px solid #eee'}}>
              <div style={{width:28,height:28,borderRadius:'50%',background:'var(--chalk-blue)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>{initials(s.name)}</div>
              <span style={{fontSize:13,fontWeight:600}}>{s.name}</span>
            </div>)}

  const filtered=searchQ.trim()?notEnrolled.filter(s=>s.name.toLowerCase().includes(searchQ.toLowerCase())||s.email.toLowerCase().includes(searchQ.toLowerCase())):notEnrolled;

    setErr('');

          </div>)}

function AssignForm({groupId,atype,assignId,onDone}) {
  const existing=assignId?DB.assignments().find(a=>a.id===assignId):null;
  const [f,setF]=useState({title:existing?.title||'',desc:existing?.description||'',marks:existing?.totalMark||'',due:existing?.dueDate||'',fileName:existing?.fileName||''});
  const [fileData,setFileData]=useState(null);
  const [err,setErr]=useState('');
  const fileRef=useRef(null);
  const resolvedType=existing?existing.type:atype;
  const lbl=resolvedType==='homework'?'Homework':'Mock Exam';
  async function handleFile(e){ const file=e.target.files[0]; if(!file)return; setF({...f,fileName:file.name}); const d=await readUpload(file); if(d) setFileData(d); }
  function submit(){
    if(!f.title.trim()||!f.marks){setErr('Please fill in title and total marks.');return;}
    if(existing){
      const assigns=DB.assignments(); const a=assigns.find(x=>x.id===assignId);
      a.title=f.title.trim(); a.description=f.desc; a.totalMark=Number(f.marks); a.dueDate=f.due||null;
      if(fileData){a.fileName=f.fileName;a.fileData=fileData;}
      DB.save.assignments(assigns);
    } else {
      const assigns=DB.assignments();
      assigns.push({id:uid(),groupId,type:resolvedType,title:f.title.trim(),description:f.desc,totalMark:Number(f.marks),dueDate:f.due||null,fileName:fileData?f.fileName:null,fileData:fileData||null,correctedFile:null,createdAt:now()});
      pushNotify(resolvedType==='mock'?'New mock exam':'New homework',
        f.title.trim()+(f.due?(' — due '+fmtDue(f.due)):'')+'. Open the Maths Hub to see it.');
      DB.save.assignments(assigns);
    }
    onDone();
  }
  return (
    <>
      <div className="mfield"><label>Title</label><input autoFocus value={f.title} onChange={e=>setF({...f,title:e.target.value})} placeholder={lbl+" title"}/></div>
      <div className="mfield"><label>Description (optional)</label><textarea value={f.desc} onChange={e=>setF({...f,desc:e.target.value})} placeholder="Instructions…"/></div>
      <div className="mfield"><label>Total marks</label><input type="number" min="1" value={f.marks} onChange={e=>setF({...f,marks:e.target.value})} placeholder="e.g. 100"/></div>
      <div className="mfield"><label>Due date</label><input type="date" value={f.due} onChange={e=>setF({...f,due:e.target.value})}/></div>
      <div className="mfield">
        <label>PDF attachment (optional)</label>
        <div className="mupload" onClick={()=>fileRef.current&&fileRef.current.click()}>
          📎 {f.fileName?f.fileName:(existing?.fileName?'Current: '+existing.fileName+' — click to replace':'Click to attach PDF')}
        </div>
        <input ref={fileRef} type="file" accept=".pdf" style={{display:'none'}} onChange={handleFile}/>
      </div>
      {err&&<div className="merr">{err}</div>}
      <button className="mbtn" onClick={submit}>{existing?'Save changes':'Add '+lbl}</button>
    </>
  );
}

function StudentDetail({studentId,groupId,fullPage}) {
  const stu=DB.students().find(s=>s.id===studentId);
  const assigns=DB.assignments().filter(a=>a.groupId===groupId);
  const [month,setMonth]=useState('all');   /* 'all' or a YYYY-MM key */
  const [kind,setKind]=useState('all');     /* all | homework | mock */
  const [state,setState]=useState('all');   /* all | marked | unmarked | missing */
  const [q,setQ]=useState('');
  const mySubs=DB.submissions().filter(s=>s.studentId===studentId&&assigns.find(a=>a.id===s.assignmentId));
  const marked=mySubs.filter(s=>s.mark!==null&&s.mark!==undefined);
  const totPoss=marked.reduce((sum,sub)=>{const a=assigns.find(x=>x.id===sub.assignmentId);return sum+(a?a.totalMark:0);},0);
  const totGot=marked.reduce((sum,sub)=>sum+sub.mark,0);
  const pct=totPoss>0?Math.round(totGot/totPoss*100):0;
  const done=mySubs.length,total=assigns.length,notDone=total-done;
  function buildPie(done,notDone){ const total=done+notDone; if(total===0)return`<circle cx="80" cy="80" r="60" fill="#D3D1C7"/>`; if(notDone===0)return`<circle cx="80" cy="80" r="60" fill="#16261F"/>`; if(done===0)return`<circle cx="80" cy="80" r="60" fill="#D3D1C7"/>`; const pct=done/total,angle=pct*2*Math.PI,x=80+60*Math.sin(angle),y=80-60*Math.cos(angle),large=pct>.5?1:0; return`<circle cx="80" cy="80" r="60" fill="#D3D1C7"/><path d="M80,80 L80,20 A60,60 0 ${large},1 ${x},${y} Z" fill="#16261F"/><circle cx="80" cy="80" r="36" fill="#F7F4EC"/><text x="80" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#16261F">${Math.round(pct*100)}%</text>`; }
  return (
    <>
      {!fullPage&&<div style={{fontWeight:700,fontSize:15,marginBottom:14}}>{stu?.name}</div>}
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:12}}>
        <ExcelBtn
          label={'⬇ Download '+((stu&&stu.name)?stu.name.split(' ')[0]+"'s":'these')+' results (Excel)'}
          build={()=>studentWorkbook(stu,assigns,mySubs,(DB.groups().find(g=>g.id===groupId)||{}).name)}
          fileName={()=>safeFileName((stu&&stu.name?stu.name:'student')+'_results_'+todayStamp())+'.xlsx'}/>
      </div>
      <div className="p-stat-row" style={{marginBottom:16}}>
        <div className="p-stat"><div className="n">{done}/{total}</div><div className="l">Submitted</div></div>
        <div className="p-stat"><div className="n">{totGot}/{totPoss||'—'}</div><div className="l">Marks</div></div>
        <div className="p-stat"><div className="n">{marked.length>0?pct+'%':'—'}</div><div className="l">Score</div></div>
      </div>
      {total>0&&<><svg viewBox="0 0 160 160" width="120" height="120" style={{display:'block',margin:'0 auto'}} dangerouslySetInnerHTML={{__html:buildPie(done,notDone)}}/>
      <div style={{display:'flex',gap:16,justifyContent:'center',margin:'8px 0 16px',fontSize:12}}>
        <span><span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:'#16261F',marginRight:4}}></span>Done ({done})</span>
        <span><span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:'#D3D1C7',marginRight:4}}></span>Pending ({notDone})</span>
      </div></>}
      {(() => {
        /* Newest first, then filtered — a full year of assignments needs narrowing down. */
        const ordered=assigns.slice().sort((a,b)=>{
          const ad=a.dueDate?new Date(a.dueDate+'T00:00:00').getTime():(a.createdAt||0);
          const bd=b.dueDate?new Date(b.dueDate+'T00:00:00').getTime():(b.createdAt||0);
          return bd-ad;
        });
        const monthsD=buildMonths(assigns);
        const rows=ordered.filter(a=>{
          if(month!=='all'&&monthKeyOf(a)!==month) return false;
          if(kind!=='all'&&a.type!==kind) return false;
          const sub=mySubs.find(s=>s.assignmentId===a.id);
          const has=sub&&sub.mark!=null&&sub.mark!==undefined;
          if(state==='marked'&&!has) return false;
          if(state==='unmarked'&&!(sub&&!has)) return false;
          if(state==='missing'&&sub) return false;
          if(q.trim()&&!a.title.toLowerCase().includes(q.trim().toLowerCase())) return false;
          return true;
        });
        const chip=(cur,set,val,label)=>(
          <button key={val} className="a-btn" onClick={()=>set(val)}
            style={{fontSize:11,padding:'4px 10px',background:cur===val?'var(--green-deep)':'',color:cur===val?'#fff':'',borderColor:cur===val?'var(--green-deep)':''}}>{label}</button>);
        return (<>
          <MonthPicker months={monthsD} value={month} onChange={setMonth} total={assigns.length} noun="assignment"/>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',marginBottom:10}}>
            {chip(kind,setKind,'all','All')}
            {chip(kind,setKind,'homework','Homework')}
            {chip(kind,setKind,'mock','Mocks')}
            <span style={{width:1,height:20,background:'#ccc',margin:'0 4px'}}/>
            {chip(state,setState,'all','Any status')}
            {chip(state,setState,'marked','Marked')}
            {chip(state,setState,'unmarked','Awaiting mark')}
            {chip(state,setState,'missing','Not done')}
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search title…"
              style={{flex:'1 1 140px',minWidth:120,padding:'5px 10px',border:'2px solid var(--ink)',borderRadius:7,fontSize:12,fontFamily:'inherit'}}/>
          </div>
          <div style={{fontSize:12,opacity:0.65,marginBottom:6}}>Showing {rows.length} of {assigns.length}{assigns.length!==rows.length?' — filtered':''}</div>
          <div style={{maxHeight:fullPage?'none':'42vh',overflowY:fullPage?'visible':'auto'}}>
            <table className="p-table">
              <thead><tr><th>Assignment</th><th>Due</th><th>Submitted</th><th>Mark</th><th>Score</th></tr></thead>
              <tbody>
                {rows.length===0&&<tr><td colSpan={5} style={{textAlign:'center',opacity:0.6,padding:'14px 0'}}>Nothing matches those filters.</td></tr>}
                {rows.map(a=>{
                  const sub=mySubs.find(s=>s.assignmentId===a.id);
                  const late=sub&&isLate(a.dueDate,sub.submittedAt);
                  const has=sub&&sub.mark!=null&&sub.mark!==undefined;
                  const pc=has&&a.totalMark?Math.round(sub.mark/a.totalMark*100):null;
                  return <tr key={a.id}>
                    <td>{a.title} <span className="pill pill-gray" style={{fontSize:10}}>{a.type}</span></td>
                    <td style={{whiteSpace:'nowrap'}}>{fmtDue(a.dueDate)}</td>
                    <td>{sub?<span className={"pill "+(late?'pill-amber':'pill-green')}>{late?'Late':'Yes'}</span>:<span className="pill pill-red">No</span>}</td>
                    <td style={{fontWeight:700,whiteSpace:'nowrap'}}>{has?(sub.mark+'/'+a.totalMark):(sub?<span style={{fontWeight:400,opacity:0.6}}>awaiting</span>:'—')}</td>
                    <td style={{fontWeight:700,whiteSpace:'nowrap',color:pc==null?undefined:(pc>=70?'#16a34a':(pc>=50?'#b45309':'#b91c1c'))}}>{pc==null?'—':pc+'%'}</td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>
        </>);
      })()}
    </>
  );
}

/* ═══════════ POSTS / ANNOUNCEMENTS ═══════════ */
function PostsView({user}){
  const isT=user.role==='teacher';
  const posts=DB.posts().filter(p=>!p.groupId).slice().sort((a,b)=>b.at-a.at);   /* group notices live in their own class tab */
  const [text,setText]=useState('');
  const [title,setTitle]=useState('');
  const [editId,setEditId]=useState(null);
  const [editText,setEditText]=useState('');
  const [editTitle,setEditTitle]=useState('');
  const [replyText,setReplyText]=useState({});
  useEffect(()=>{ try{ localStorage.setItem('zh_seen_posts_'+user.id,String(Date.now())); window.dispatchEvent(new Event('zh-data-changed')); }catch(e){} },[posts.length]);

  function publish(){
    if(!text.trim())return;
    const p={id:uid(),title:title.trim()||null,text:text.trim(),by:user.name||'Teacher',at:now(),replies:[]};
    DB.save.posts([...DB.posts(),p]);
    pushNotify('New announcement', (title.trim()||text.trim()).slice(0,120));
    setText(''); setTitle('');
  }
  function del(id){ if(!confirm('Delete this announcement?'))return; DB.save.posts(DB.posts().filter(p=>p.id!==id)); }
  function startEdit(p){ setEditId(p.id); setEditText(p.text); setEditTitle(p.title||''); }
  function saveEdit(){ const all=DB.posts(); const p=all.find(x=>x.id===editId); if(p){ p.text=editText.trim()||p.text; p.title=editTitle.trim()||null; p.edited=true; DB.save.posts(all);} setEditId(null); }
  function sendReply(postId){ const t=(replyText[postId]||'').trim(); if(!t)return; const all=DB.posts(); const p=all.find(x=>x.id===postId); if(p){ p.replies=p.replies||[]; p.replies.push({id:uid(),byId:user.id,by:user.name||(isT?'Teacher':'Student'),role:user.role,text:t,at:now()}); DB.save.posts(all);} setReplyText(Object.assign({},replyText,{[postId]:''})); }
  function delReply(postId,rid){ const all=DB.posts(); const p=all.find(x=>x.id===postId); if(p){ p.replies=(p.replies||[]).filter(r=>r.id!==rid); DB.save.posts(all);} }

  const card={background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:'14px 16px',boxShadow:'3px 3px 0 var(--ink)',marginBottom:12};
  return (<div className="p-main">
    <div className="p-topbar"><div className="p-topbar-title">📌 Announcements</div></div>
    <div className="p-page">

        <div style={{background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:16,boxShadow:'4px 4px 0 var(--ink)',marginBottom:18}}>

          <div className="mfield"><label>Message</label><textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Write an announcement for your students…"/></div>
          <button className="mbtn" onClick={publish}>📢 Post announcement</button>
        </div>
      )}
      {posts.length===0&&<div className="empty-state">No announcements yet.</div>}
      {posts.map(p=>(
        <div key={p.id} style={card}>
          {editId===p.id?(
            <div>
              <div className="mfield"><label>Title</label><input value={editTitle} onChange={e=>setEditTitle(e.target.value)}/></div>
              <div className="mfield"><label>Message</label><textarea value={editText} onChange={e=>setEditText(e.target.value)}/></div>
              <div style={{display:'flex',gap:8}}><button className="mbtn" onClick={saveEdit}>Save</button><button className="a-btn" onClick={()=>setEditId(null)}>Cancel</button></div>
            </div>
          ):(
            <div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:4}}>
                <div style={{fontWeight:700,color:'var(--green-deep)',fontFamily:'Georgia,serif'}}>{p.title||'Announcement'}</div>
                {isT&&<div style={{display:'flex',gap:6,flexShrink:0}}>
                  <button className="a-btn" onClick={()=>startEdit(p)} style={{fontSize:11}}>✏️ Edit</button>

              <div style={{whiteSpace:'pre-wrap',fontSize:14,lineHeight:1.5}}>{p.text}</div>
              <div style={{fontSize:11,opacity:0.55,marginTop:8}}>{p.by} · {fmtDate(p.at)}{p.edited?' · edited':''}</div>
            </div>
          )}

          {/* replies */}
          {(p.replies&&p.replies.length>0)&&(
            <div style={{marginTop:12,borderTop:'1px solid #eee',paddingTop:10,display:'flex',flexDirection:'column',gap:8}}>
              {p.replies.slice().sort((a,b)=>a.at-b.at).map(r=>(
                <div key={r.id} style={{background:r.role==='teacher'?'#FFF5F2':'var(--paper)',border:'1.5px solid var(--ink)',borderRadius:8,padding:'7px 10px'}}>

                  </div>

            <button className="a-btn" onClick={()=>sendReply(p.id)} style={{flexShrink:0}}>Reply</button>
          </div>
        </div>
      ))}
    </div>
  </div>);
}

/* ═══════════ NOTIFICATIONS ═══════════ */
function _seen(uid,key){ try{ return Number(localStorage.getItem('zh_seen_'+key+'_'+uid))||0; }catch(e){ return 0; } }
function _markSeen(uid,key){ try{ localStorage.setItem('zh_seen_'+key+'_'+uid,String(Date.now())); }catch(e){} }
function Notifications({user,onOpenPosts,onOpenGroup,onOpenMeetings,onAddStudent,onOpenParents,onOpenChat,onOpenRegs}){
  const isT=user.role==='teacher';
  const isParent=user.role==='parent';
  const [open,setOpen]=useState(false);
  const items=[];
  const allMeet=DB.meetings();
  const myMeetings=isT?allMeet:allMeet.filter(m=>m.participants==='all'||(Array.isArray(m.participants)&&m.participants.includes(user.id)));
  if(isT){
    const subs=DB.submissions(), studs=DB.students(), assigns=DB.assignments(), parents=DB.parents();
    /* new student registrations → tap to add them to a group */
    const seenReg=_seen(user.id,'reg');
    studs.filter(s=>(s.createdAt||0)>seenReg).forEach(s=>{
      items.push({t:s.createdAt,txt:'👤 New student registered: '+s.name+(s.approved===false?' — tap to approve':''),go:onOpenRegs});
    });
    /* new parent registrations → shows which child, tap to approve */
    const seenPreg=_seen(user.id,'preg');
    parents.filter(p=>(p.createdAt||0)>seenPreg).forEach(p=>{
      const cn=(studs.find(s=>s.id===p.childId)||{}).name||'a student';
      items.push({t:p.createdAt,txt:'👪 New parent registered: '+p.name+' (parent of '+cn+')'+(p.approved===false?' — tap to approve':''),go:onOpenRegs});
    });
    const seenSub=_seen(user.id,'subs');
    subs.filter(s=>(s.submittedAt||0)>seenSub).forEach(s=>{
      const nm=(studs.find(x=>x.id===s.studentId)||{}).name||'A student';
      const a=assigns.find(x=>x.id===s.assignmentId)||{};
      items.push({t:s.submittedAt,txt:'📥 '+nm+' submitted "'+(a.title||'work')+'"',go:()=>onOpenGroup(a.groupId,a.type==='mock'?'mock':'homework',a.id)});
    });
    const seenMsg=_seen(user.id,'tmsg');
    DB.messages().filter(m=>m.to==='teacher'&&!m.parentId&&(m.at||0)>seenMsg).forEach(m=>{
      const nm=(studs.find(x=>x.id===m.from)||{}).name||'A student';
      items.push({t:m.at,txt:'💬 '+nm+': '+String(m.text||'').slice(0,40),go:()=>onOpenGroup(m.groupId,'chat')});
    });
    /* parent messages */
    const seenPmsg=_seen(user.id,'pmsg');
    DB.messages().filter(m=>m.parentId&&m.from==='parent'&&(m.at||0)>seenPmsg).forEach(m=>{
      const pn=(parents.find(p=>p.id===m.parentId)||{}).name||'A parent';
      items.push({t:m.at,txt:'💬 '+pn+' (parent): '+String(m.text||'').slice(0,40),go:onOpenParents});
    });
  } else if(isParent){
    const seenPost=_seen(user.id,'posts');
    DB.posts().filter(p=>(p.at||0)>seenPost&&!p.groupId).forEach(p=>items.push({t:p.at,txt:'📌 New announcement: '+(p.title||String(p.text||'').slice(0,40)),go:onOpenPosts}));
    const seenTd=_seen(user.id,'ptmsg');
    DB.messages().filter(m=>(m.parentId===user.id||m.parentBroadcast)&&m.from==='teacher'&&(m.at||0)>seenTd).forEach(m=>items.push({t:m.at,txt:(m.parentBroadcast?'📢 ':'💬 ')+'Teacher: '+String(m.text||'').slice(0,40),go:onOpenChat}));
  } else {
    const seenPost=_seen(user.id,'posts');
    DB.posts().filter(p=>(p.at||0)>seenPost&&!p.groupId).forEach(p=>items.push({t:p.at,txt:'📌 New announcement: '+(p.title||String(p.text||'').slice(0,40)),go:onOpenPosts}));
    const myGroupIds=DB.groups().filter(g=>(g.students||[]).includes(user.id)).map(g=>g.id);
    const seenAssign=_seen(user.id,'assign');
    DB.assignments().filter(a=>myGroupIds.includes(a.groupId)&&(a.createdAt||0)>seenAssign).forEach(a=>items.push({t:a.createdAt,txt:'📋 New '+(a.type==='mock'?'mock exam':'homework')+': '+a.title,go:()=>onOpenGroup(a.groupId,a.type==='mock'?'mock':'homework')}));
    const seenMsg=_seen(user.id,'smsg');
    DB.messages().filter(m=>(m.at||0)>seenMsg&&m.from==='teacher'&&!m.parentId&&(m.to===user.id||m.broadcast)).forEach(m=>items.push({t:m.at,txt:'💬 Teacher: '+String(m.text||'').slice(0,40),go:()=>onOpenGroup(m.groupId,'chat')}));
    /* class notices, for the classes this student is actually in */
    const myGids=DB.groups().filter(g=>(g.students||[]).includes(user.id)).map(g=>g.id);
    DB.posts().filter(p=>p.groupId&&myGids.includes(p.groupId)&&(p.at||0)>seenPost)
      .forEach(p=>items.push({t:p.at,txt:'📣 Class notice: '+String(p.text||'').slice(0,40),go:()=>onOpenGroup(p.groupId,'notices')}));
  }
  items.sort((a,b)=>b.t-a.t);
  const count=items.length;
  function clearAll(){
    if(isT){ _markSeen(user.id,'subs'); _markSeen(user.id,'tmsg'); _markSeen(user.id,'reg'); _markSeen(user.id,'pmsg'); _markSeen(user.id,'preg'); }
    else if(isParent){ _markSeen(user.id,'posts'); _markSeen(user.id,'ptmsg'); }
    else { _markSeen(user.id,'posts'); _markSeen(user.id,'assign'); _markSeen(user.id,'smsg'); _markSeen(user.id,'meet'); }
    window.dispatchEvent(new Event('zh-data-changed')); setOpen(false);
  }
  return (
    <div style={{position:'relative'}}>
      <button className="a-btn" onClick={()=>setOpen(o=>!o)} style={{position:'relative',padding:'6px 10px'}}>
        🔔
        {count>0&&<span style={{position:'absolute',top:-7,right:-7,background:'var(--coral)',color:'white',borderRadius:'50%',minWidth:18,height:18,fontSize:10,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 4px',border:'2px solid var(--ink)'}}>{count>9?'9+':count}</span>}
      </button>
      {open&&(
        <div style={{position:'absolute',right:0,top:'115%',width:260,maxWidth:'80vw',maxHeight:340,overflowY:'auto',background:'white',border:'2px solid var(--ink)',borderRadius:10,boxShadow:'4px 4px 0 var(--ink)',zIndex:1500,padding:8}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'4px 6px 8px'}}>
            <strong style={{fontSize:13}}>Notifications</strong>
            {count>0&&<button className="linklike" onClick={clearAll} style={{fontSize:11}}>Mark all read</button>}
          </div>
          {count===0&&<div style={{fontSize:13,opacity:0.6,padding:'10px 6px'}}>No new notifications.</div>}
          {items.slice(0,30).map((it,i)=>(
            <div key={i} onClick={()=>{ if(it.go)it.go(); clearAll(); }} style={{padding:'8px 6px',borderTop:i?'1px solid #eee':'none',fontSize:13,cursor:'pointer'}}>
              <div>{it.txt}</div>
              <div style={{fontSize:11,opacity:0.5}}>{fmtDate(it.t)}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ═══════════ LIVE MEETING (Jitsi) ═══════════ */
let _jitsiLoading=null;
function loadJitsi(){
  if(window.JitsiMeetExternalAPI) return Promise.resolve();
  if(_jitsiLoading) return _jitsiLoading;
  _jitsiLoading=new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='https://meet.jit.si/external_api.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('Could not load the video service. Check your internet.'));
    document.body.appendChild(s);
  });
  return _jitsiLoading;
}
function LiveMeeting({meeting,user,onClose}){
  const ref=useRef(null); const apiRef=useRef(null); const [err,setErr]=useState('');
  const recRef=useRef(null); const chunksRef=useRef([]); const [recording,setRecording]=useState(false);
  useEffect(()=>{
    loadJitsi().then(()=>{
      if(!ref.current) return;
      const api=new window.JitsiMeetExternalAPI('meet.jit.si',{
        roomName:'ZahraMathHub_'+meeting.id,
        parentNode:ref.current, width:'100%', height:'100%',
        userInfo:{ displayName:(user.name||(user.role==='teacher'?'Teacher':'Student')) },
        configOverwrite:{ prejoinPageEnabled:true, startWithAudioMuted:user.role!=='teacher', startWithVideoMuted:user.role!=='teacher', disableDeepLinking:true, whiteboard:{ enabled:true } },
        interfaceConfigOverwrite:{ MOBILE_APP_PROMO:false, DISABLE_DEEP_LINKING:true,
          TOOLBAR_BUTTONS:['microphone','camera','desktop','whiteboard','recording','chat','raisehand','participants-pane','tileview','security','settings','fullscreen','hangup'] }
      });
      apiRef.current=api;
      api.addEventListener('readyToClose',()=>onClose());
    }).catch(e=>setErr(e.message||'Video failed to load'));
    return ()=>{ try{ apiRef.current&&apiRef.current.dispose(); }catch(e){} try{ recRef.current&&recRef.current.stop(); }catch(e){} };
  },[]);
  async function startRec(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){
      alert('In-browser recording isn\u2019t supported on this device (common on phones). Please use your phone\u2019s built-in screen recorder instead, then add the video link on the Recordings page.');
      return;
    }
    try{
      const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
      chunksRef.current=[];
      const rec=new MediaRecorder(stream);
      rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunksRef.current.push(e.data); };
      rec.onstop=()=>{
        try{
          const blob=new Blob(chunksRef.current,{type:'video/webm'});
          const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
          a.download=(meeting.title||'meeting').replace(/[^a-z0-9]+/gi,'_')+'_'+new Date().toISOString().slice(0,10)+'.webm';
          a.click();
        }catch(e){}
        stream.getTracks().forEach(t=>t.stop()); setRecording(false);
      };
      stream.getVideoTracks()[0].addEventListener('ended',()=>{ try{ rec.state!=='inactive'&&rec.stop(); }catch(e){} });
      rec.start(); recRef.current=rec; setRecording(true);
    }catch(e){ /* user cancelled the screen picker */ }
  }
  function stopRec(){ try{ recRef.current&&recRef.current.state!=='inactive'&&recRef.current.stop(); }catch(e){} }
  return (
    <div style={{position:'fixed',inset:0,zIndex:5000,background:'#000',display:'flex',flexDirection:'column'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 14px',background:'#1F3A33',color:'#fff',gap:8}}>
        <div style={{fontWeight:700,fontFamily:'Georgia,serif'}}>🎥 {meeting.title}</div>
        <div style={{display:'flex',gap:8}}>
          {user.role==='teacher'&&(recording
            ? <button className="a-btn" onClick={stopRec} style={{background:'#a11',color:'#fff',borderColor:'#a11'}}>⏹ Stop &amp; save video</button>
            : <button className="a-btn" onClick={startRec} style={{background:'#fff',color:'var(--ink)'}}>⏺ Record to device</button>)}
          <button className="a-btn" onClick={onClose} style={{background:'var(--coral)',color:'#fff',borderColor:'var(--coral)'}}>✕ Leave</button>
        </div>
      </div>
      {err&&<div style={{color:'#fff',padding:20,fontFamily:'Georgia,serif'}}>{err}</div>}
      <div ref={ref} style={{flex:1,minHeight:0}}/>
      {user.role==='teacher'&&<div style={{background:'#132b25',color:'#cfe',fontSize:11,padding:'5px 12px',textAlign:'center'}}>Tip: <b>Share screen</b> for slides, <b>Whiteboard</b> to draw. To record, tap the <b>⏺ Record</b> button and connect Dropbox — after the meeting, copy the Dropbox link into the meeting's "Add recording" so students can watch it. Open <b>Security → Lobby</b> to admit students.</div>}
    </div>
  );
}

/* ═══════════ MEETINGS (scheduler) ═══════════ */
function MeetingsView({user,onLive}){
  const isT=user.role==='teacher';
  const students=DB.students();
  const meetings=DB.meetings().slice().sort((a,b)=>(((b.date||'')+(b.start||'')) > ((a.date||'')+(a.start||''))?1:-1));
  const blank={title:'',date:'',start:'',end:'',purpose:'',location:'',online:true,participants:'all',recurrence:'none',reminderMin:15,status:'Scheduled',notes:'',actionItems:'',attachmentData:null,attachmentName:'',recordingUrl:''};
  const [f,setF]=useState(blank);
  const [editId,setEditId]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const fileRef=useRef(null);
  useEffect(()=>{ try{ localStorage.setItem('zh_seen_meet_'+user.id,String(Date.now())); }catch(e){} },[meetings.length]);
  function set(k,v){ setF(p=>Object.assign({},p,{[k]:v})); }
  async function pickFile(e){ const file=e.target.files[0]; if(!file)return; set('attachmentName',file.name); const d=await readUpload(file); if(d) set('attachmentData',d); }
  function dur(s,e){ if(!s||!e)return''; const a=s.split(':').map(Number),b=e.split(':').map(Number); let m=(b[0]*60+b[1])-(a[0]*60+a[1]); if(m<0)m+=1440; return Math.floor(m/60)+'h '+(m%60)+'m'; }
  function save(){

function embedVideo(url){
  const yt=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{11})/);
  if(yt) return <iframe src={'https://www.youtube.com/embed/'+yt[1]} style={{width:'100%',aspectRatio:'16/9',border:0,borderRadius:8}} allowFullScreen title="rec"/>;
  const gd=url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if(gd) return <iframe src={'https://drive.google.com/file/d/'+gd[1]+'/preview'} style={{width:'100%',aspectRatio:'16/9',border:0,borderRadius:8}} allowFullScreen title="rec"/>;
  const dbx=url.match(/dropbox\.com\/[^\s]+/);
  if(dbx){ const direct=url.replace('www.dropbox.com','dl.dropboxusercontent.com').replace('?dl=0','').replace('&dl=0',''); return <video src={direct} controls controlsList="nodownload noplaybackrate" onContextMenu={e=>e.preventDefault()} style={{width:'100%',borderRadius:8,background:'#000'}}/>; }
  return <video src={url} controls controlsList="nodownload noplaybackrate" onContextMenu={e=>e.preventDefault()} style={{width:'100%',borderRadius:8,background:'#000'}}/>;
}

/* ═══════════ PARENT ↔ TEACHER CHAT ═══════════ */
const PARENT_ALL='__allparents__';
function ParentChat({parentId,me}){
  const isAll=parentId===PARENT_ALL;
  const conv=DB.messages().filter(m=>
    isAll ? !!m.parentBroadcast                       /* teacher composing to everyone */
          : (m.parentId===parentId || !!m.parentBroadcast)  /* a parent sees theirs + announcements */
  ).sort((a,b)=>a.at-b.at);
  const [msg,setMsg]=useState('');
  const att=useAttach();
  const listRef=useRef(null);
  useEffect(()=>{ if(listRef.current) listRef.current.scrollTop=listRef.current.scrollHeight; },[conv.length]);
  function send(){
    const body=msg.trim();
    if(!body&&!att.att)return;
    const file=att.att?{fileName:att.att.name,fileData:att.att.data}:{};
    const all=DB.messages();
    const base={id:uid(),parentId:parentId,from:me,text:body,at:now()};
    if(isAll) base.parentBroadcast=true;
    all.push(Object.assign(base,file));
    DB.save.messages(all); setMsg(''); att.setAtt(null);
  }
  function saveEdit(m,text){
    const all=DB.messages(); const t=all.find(x=>x.id===m.id);
    if(t){ t.text=String(text||'').trim(); t.editedAt=now(); }
    DB.save.messages(all);
  }
  function removeMsg(m){
    if(!confirm(m.fileName?('Delete this message and its file "'+m.fileName+'"? This cannot be undone.')
                          :'Delete this message? This cannot be undone.')) return;
    if(m.fileDataId) DB.deleteFile(m.fileDataId);
    DB.save.messages(DB.messages().filter(x=>x.id!==m.id));
  }
  return (
    <div className="chat-body" style={{display:'flex',flexDirection:'column',flex:1,minHeight:0}}>
      <div className="chat-list" ref={listRef}>
        {conv.length===0&&<div className="empty-state">{isAll?'No announcements to parents yet. Anything you send here goes to every parent.':'No messages yet. Say hello 👋'}</div>}
        {conv.map(m=><div key={m.id} className={"msg "+(m.from===me?'mine':'')}><div className={"msg-bubble "+(m.from===me?'mine':'other')}>{m.parentBroadcast&&<div style={{fontSize:10,opacity:0.6,marginBottom:2}}>📢 To all parents</div>}<MsgBody m={m} canEdit={canEditMsg(m,me)} canDelete={canDeleteMsg(m,me,me==='teacher')} onSave={saveEdit} onDelete={removeMsg}/></div></div>)}
      </div>
      <AttachBar a={att}/>
      <div className="chat-ir"><AttachBtn a={att}/><input value={msg} onChange={e=>setMsg(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder={me==='parent'?'Message the teacher…':(isAll?'Announcement to ALL parents…':'Reply to parent…')}/><button className="chat-send" onClick={send}>Send</button></div>
    </div>
  );
}
/* ═══════════ WEEKLY WHATSAPP REMINDERS ═══════════
   Free and immediate: the app writes a personalised message for each parent and
   opens WhatsApp with it ready; the teacher presses send. No Meta account, no
   cost, and the message can name the child and their actual marks — which an
   automated template cannot easily do. */
function weekSummaryFor(childId){
  const since=weekStartTs();
  const gids=DB.groups().filter(g=>(g.students||[]).includes(childId)).map(g=>g.id);
  const assigns=DB.assignments().filter(a=>gids.includes(a.groupId));
  const subs=DB.submissions().filter(x=>x.studentId===childId);
  const newWork=assigns.filter(a=>(a.createdAt||0)>=since);
  const marked=subs.filter(x=>{
    const a=assigns.find(y=>y.id===x.assignmentId);
    return a && x.mark!=null && x.mark!==undefined && (x.markedAt||a.createdAt||0)>=0;
  });
  const missing=assigns.filter(a=>{
    if(!a.dueDate) return false;
    const due=new Date(a.dueDate+'T23:59:59').getTime();
    return due<Date.now() && due>=since && !subs.find(x=>x.assignmentId===a.id);
  });
  let got=0,poss=0;
  marked.forEach(x=>{ const a=assigns.find(y=>y.id===x.assignmentId); if(a){ got+=x.mark; poss+=(a.totalMark||0); } });
  return {newWork,marked,missing,pct:poss?Math.round(got/poss*100):null};
}
/* "Dear Mr / Mrs Hassan," — using the surname, and never doubling a title that
   is already part of the stored name (e.g. a parent registered as "Mrs Hassan"). */
function parentSalutation(p){
  let n=String((p&&p.name)||'').trim();
  n=n.replace(/^(mr|mrs|ms|miss|dr|prof|sheikh|sheikha)\.?\s+/i,'');
  if(!n) return 'Dear Mr / Mrs,';
  const parts=n.split(/\s+/).filter(Boolean);
  let last=parts[parts.length-1];
  /* tidy a name typed in lower case, keeping Al-Hassan style hyphens */
  last=last.replace(/(^|[-'])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
  return 'Dear Mr / Mrs '+last+',';
}
/* The end-of-month nudge: how the month went, and a push to open the report. */
function buildParentMonthlyMessage(parent,child,teacherName){
  const name=(child&&child.name)?child.name.split(' ')[0]:'your child';
  const mk=monthKeyNow();
  const gids=DB.groups().filter(g=>(g.students||[]).includes(child?child.id:null)).map(g=>g.id);
  const assigns=DB.assignments().filter(a=>gids.includes(a.groupId)&&monthKeyOf(a)===mk);
  const subs=DB.submissions().filter(x=>x.studentId===(child?child.id:null));
  let got=0,poss=0,done=0,late=0;
  assigns.forEach(a=>{
    const sub=subs.find(x=>x.assignmentId===a.id);
    if(sub){ done++; if(isLate(a.dueDate,sub.submittedAt)) late++;
      if(sub.mark!=null&&sub.mark!==undefined){ got+=sub.mark; poss+=(a.totalMark||0); } }
  });
  const missing=assigns.filter(a=>!subs.find(x=>x.assignmentId===a.id));
  const L=[];
  L.push(parentSalutation(parent));
  L.push('');
  L.push('The report for '+monthLabel(mk)+' is now complete for '+name+'.');
  L.push('');
  L.push('This month: '+assigns.length+' piece'+(assigns.length===1?'':'s')+' of work set, '+done+' handed in'+(late?(', '+late+' late'):''));
  if(poss) L.push('Average score: '+Math.round(got/poss*100)+'%');
  if(missing.length) L.push('Not handed in: '+missing.map(a=>a.title).join(', '));
  L.push('');
  L.push('Please open the Maths Hub to see the full month report, the marked work and the model answers.');
  L.push('');
  L.push(teacherName||'Ms. Zahra');
  return L.join('\n');
}
function buildParentMessage(parent,child,teacherName){
  const s=weekSummaryFor(child?child.id:null);
  const name=(child&&child.name)?child.name.split(' ')[0]:'your child';
  const L=[];
  L.push(parentSalutation(parent));
  L.push('');
  L.push('This week’s update for '+name+' has been added to the Maths Hub.');
  if(s.newWork.length){
    L.push('');
    L.push('New this week:');
    s.newWork.slice(0,6).forEach(a=>L.push('• '+(a.type==='mock'?'Mock: ':'Homework: ')+a.title+(a.dueDate?(' — due '+fmtDue(a.dueDate)):'')));
  }
  if(s.pct!==null) L.push('', 'Average score: '+s.pct+'%');
  if(s.missing.length) L.push('', 'Still not handed in: '+s.missing.map(a=>a.title).join(', '));
  L.push('');
  L.push('Please log in to see the full details and the marked work.');
  L.push('');
  L.push(teacherName||'Ms. Zahra');
  return L.join('\n');
}

function WeeklyReminders(){

  const [mode,setMode]=useState(()=>isLastThursdayOfMonth()?'month':'week');
  const st=appSettings();

  const sent=(monthly?st.monthlySent:st.weeklySent)||{};

  const parents=DB.parents(); const studs=DB.students();
  const today=new Date();
  const isThursday=today.getDay()===4;
  const isLastThurs=isLastThursdayOfMonth(today);
  const link=(st.siteLink||'').trim();

  function markSent(pid){
    const s0=appSettings();
    const cur=(monthly?s0.monthlySent:s0.weeklySent)||{};
    const next=Object.assign({},cur,{[pid]:wk});
    saveSetting(monthly?{monthlySent:next}:{weeklySent:next});
    setTick(t=>t+1);
  }
  function savePhone(pid){
    const v=edit[pid]||'';
    if(!validPhone(v)){ alert('Please enter a valid number with the country code, e.g. +974 5555 1234'); return; }

    setEdit(e=>{ const n=Object.assign({},e); delete n[pid]; return n; });
    setTick(t=>t+1);
  }
  const done=parents.filter(p=>sent[p.id]===wk).length;

  return (
    <div>

        <button className="a-btn" onClick={()=>setMode('week')} style={{background:mode==='week'?'var(--green-deep)':'',color:mode==='week'?'#fff':'',borderColor:mode==='week'?'var(--green-deep)':''}}>📅 Weekly update</button>

/* ═══════════ REGISTRATIONS (teacher: approve / remove accounts) ═══════════ */
function RegistrationsView(){
  const accts=[
    ...DB.students().map(s=>Object.assign({},s,{kind:'student'})),
    ...DB.parents().map(p=>Object.assign({},p,{kind:'parent'})),
  ];
  const pending=accts.filter(a=>a.approved===false).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const approved=accts.filter(a=>a.approved!==false).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  function accept(a){
    if(a.kind==='student'){ const all=DB.students(); const r=all.find(x=>x.id===a.id); if(r){r.approved=true;DB.save.students(all);} }
    else { const all=DB.parents(); const r=all.find(x=>x.id===a.id); if(r){r.approved=true;DB.save.parents(all);} }
  }
  function remove(a){
    if(!confirm('Remove '+a.name+'\u2019s account? This cannot be undone.'))return;
    if(a.kind==='student'){
      DB.save.students(DB.students().filter(x=>x.id!==a.id));
      const gs=DB.groups(); let changed=false; gs.forEach(g=>{ if((g.students||[]).includes(a.id)){ g.students=g.students.filter(id=>id!==a.id); changed=true; } }); if(changed) DB.save.groups(gs);
    } else { DB.save.parents(DB.parents().filter(x=>x.id!==a.id)); }
  }
  function childName(p){ const c=DB.students().find(s=>s.id===p.childId); return c?c.name:'—'; }
  const reqs=pwRequests();
  function resetPw(a){
    const np=prompt('New password for '+a.name+'\n\nType a temporary password (at least 6 characters). Send it to them on WhatsApp and ask them to change it after signing in.','');
    if(np===null) return;
    if(String(np).length<6){ alert('Please use at least 6 characters.'); return; }
    if(a.kind==='student'){ const all=DB.students(); const r=all.find(x=>x.id===a.id); if(r){ r.pass=np; DB.save.students(all); } }
    else { const all=DB.parents(); const r=all.find(x=>x.id===a.id); if(r){ r.pass=np; DB.save.parents(all); } }
    clearPwRequest(a.email);
    alert('Done. '+a.name+'\u2019s password is now:\n\n'+np+'\n\nSend it to them and ask them to change it.');
  }
  const row=(a)=>(
    <div key={a.kind+a.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',borderBottom:'1px solid #eee'}}>
      <div style={{width:34,height:34,borderRadius:'50%',background:a.kind==='parent'?'var(--green-deep)':'var(--chalk-blue)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,flexShrink:0}}>{initials(a.name)}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:700,fontSize:14}}>{a.name} <span className="pill pill-gray" style={{fontSize:10}}>{a.kind}</span></div>
        <div style={{fontSize:12,opacity:0.6}}>{a.email}{a.kind==='parent'?(' · parent of '+childName(a)):''}</div>
      </div>
      {a.approved===false&&<button className="a-btn" onClick={()=>accept(a)} style={{background:'var(--green-deep)',color:'#fff',borderColor:'var(--green-deep)',fontSize:12,flexShrink:0}}>✓ Accept</button>}
      {reqs.find(r=>r.email===(a.email||'').toLowerCase())&&<span className="pill pill-amber" style={{fontSize:10}}>🔑 asked for a reset</span>}
      <button className="a-btn" onClick={()=>resetPw(a)} style={{fontSize:12,flexShrink:0}}>🔑 Reset password</button>
      <button className="a-btn danger" onClick={()=>remove(a)} style={{fontSize:12,flexShrink:0}}>🗑 Remove</button>
    </div>
  );
  return (
    <div className="p-main">
      <div className="p-topbar"><div className="p-topbar-title">👥 Registrations</div></div>
      <div className="p-page">
        <PushSetup/>
        {reqs.length>0&&(
          <div style={{background:'#FFF4E5',border:'2px solid #E8623D',borderRadius:12,padding:'12px 16px',marginBottom:16}}>
            <div style={{fontWeight:700,marginBottom:4}}>🔑 Password help needed ({reqs.length})</div>
            <div style={{fontSize:13,opacity:0.85,marginBottom:6}}>These people said they forgot their password. Find them below and press “Reset password”, then send them the new one.</div>
            {reqs.map(r=><div key={r.email} style={{fontSize:13}}>• <strong>{r.name}</strong> ({r.role}) — {r.email}</div>)}
          </div>
        )}
        <div style={{background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:'14px 16px',boxShadow:'3px 3px 0 var(--ink)',marginBottom:16}}>
          <div style={{fontWeight:700,fontFamily:'Georgia,serif',color:'var(--coral-dark)',marginBottom:6}}>⏳ Waiting for approval ({pending.length})</div>
          {pending.length===0?<div style={{fontSize:13,opacity:0.6}}>No one is waiting.</div>:pending.map(row)}
        </div>
        <div style={{background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:'14px 16px',boxShadow:'3px 3px 0 var(--ink)'}}>
          <div style={{fontWeight:700,fontFamily:'Georgia,serif',color:'var(--green-deep)',marginBottom:6}}>✓ Approved accounts ({approved.length})</div>
          {approved.length===0?<div style={{fontSize:13,opacity:0.6}}>No approved accounts yet.</div>:approved.map(row)}
        </div>
      </div>
    </div>
  );
}

/* ═══════════ PARENT PORTAL ═══════════ */function childReport(childId,since){
  const gids=DB.groups().filter(g=>(g.students||[]).includes(childId)).map(g=>g.id);
  const assigns=DB.assignments().filter(a=>gids.includes(a.groupId)&&(!since||(a.createdAt||0)>=since));
  const subs=DB.submissions().filter(s=>s.studentId===childId);
  const r={hwTotal:0,hwDone:0,mkTotal:0,mkDone:0,late:0,onTime:0,got:0,poss:0};
  assigns.forEach(a=>{
    const isHw=a.type!=='mock';
    if(isHw)r.hwTotal++;else r.mkTotal++;
    const sub=subs.find(s=>s.assignmentId===a.id);
    if(sub){ if(isHw)r.hwDone++;else r.mkDone++;
      if(isLate(a.dueDate,sub.submittedAt))r.late++;else r.onTime++;
      if(sub.mark!=null&&sub.mark!==undefined){ r.got+=Number(sub.mark)||0; r.poss+=Number(a.totalMark)||0; }
    }
  });
  r.hwNotDone=r.hwTotal-r.hwDone; r.mkNotDone=r.mkTotal-r.mkDone;
  r.pct=r.poss>0?Math.round(r.got/r.poss*100):null;
  return r;
}
function ReportCard({title,r,note}){
  const cell=(label,val,color)=>(<div style={{flex:'1 1 90px',textAlign:'center',padding:'8px 4px'}}><div style={{fontSize:22,fontWeight:800,color:color||'var(--green-deep)',fontFamily:'Georgia,serif'}}>{val}</div><div style={{fontSize:11,opacity:0.7}}>{label}</div></div>);
  return (
    <div style={{background:'white',border:'2px solid var(--ink)',borderRadius:12,padding:'14px 16px',boxShadow:'3px 3px 0 var(--ink)',marginBottom:14}}>
      <div style={{fontWeight:700,fontFamily:'Georgia,serif',color:'var(--coral-dark)',marginBottom:6}}>{title}</div>
      {note&&<div style={{fontSize:12,opacity:0.65,marginBottom:8}}>{note}</div>}
      <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
        {cell('Homework done',r.hwDone+'/'+r.hwTotal)}
        {cell('Mocks done',r.mkDone+'/'+r.mkTotal)}
        {cell('Not done',(r.hwNotDone+r.mkNotDone),(r.hwNotDone+r.mkNotDone)>0?'var(--coral-dark)':undefined)}
        {cell('On time',r.onTime,'#16a34a')}
        {cell('Late',r.late,r.late>0?'#d97706':undefined)}
        {cell('Average score',r.pct!=null?r.pct+'%':'—')}
      </div>
    </div>
  );
}
